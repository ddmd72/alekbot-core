# Informational only (`make check-types`) — never fails the build. Lenient on purpose: the SDKs
# adapters wrap ship partial stubs, so strict mode would report the libraries, not our code.
# Tighten once the count (printed by the target) has been watched for a couple of weeks.
[mypy]
python_version = 3.11
plugins = pydantic.mypy
ignore_missing_imports = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR
files = src/adapters
