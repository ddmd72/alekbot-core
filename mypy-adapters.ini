# Informational only (`make check-types`) — never fails the build. Lenient on purpose: the SDKs
# adapters wrap ship partial stubs, so strict mode would report the libraries, not our code.
# Tighten once the count (printed by the target) has been watched for a couple of weeks.
[mypy]
python_version = 3.11
plugins = pydantic.mypy
ignore_missing_imports = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR
files = src/adapters
check_untyped_defs = True

# Frozen in favour of MicrosoftToDoAdapter (service_container.py), unreferenced, no tests: it has
# drifted from the Task domain (notes, due_date, NEEDS_ACTION) and cannot be repaired without the
# Google Tasks API to verify against. Revisit only if the adapter is un-frozen.
[mypy-src.adapters.google_tasks_adapter]
ignore_errors = True
