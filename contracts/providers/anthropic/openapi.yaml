            - code_execution_20260120
            - code_execution_20260521
            - direct
            type: string
          type: array
        allowed_domains:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
        blocked_domains:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
        cache_control:
