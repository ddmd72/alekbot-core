components:
  schemas:
    Base64ImageSourceParam:
      additionalProperties: false
      properties:
        data:
          anyOf:
          - type: string
          - format: path
            type: string
        media_type:
          enum:
          - image/gif
          - image/jpeg
          - image/png
          - image/webp
          type: string
        type:
          const: base64
          type: string
      required:
      - data
      - media_type
      - type
      type: object
    Base64PDFSourceParam:
      additionalProperties: false
      properties:
        data:
          anyOf:
          - type: string
          - format: path
            type: string
        media_type:
          const: application/pdf
          type: string
        type:
          const: base64
          type: string
      required:
      - data
      - media_type
      - type
      type: object
    BashCodeExecutionOutputBlockParam:
      additionalProperties: false
      properties:
        file_id:
          type: string
        type:
          const: bash_code_execution_output
          type: string
      required:
      - file_id
      - type
      type: object
    BashCodeExecutionResultBlockParam:
      additionalProperties: false
      properties:
        content:
          items:
            $ref: '#/components/schemas/BashCodeExecutionOutputBlockParam'
          type: array
        return_code:
          type: integer
        stderr:
          type: string
        stdout:
          type: string
        type:
          const: bash_code_execution_result
          type: string
      required:
      - content
      - return_code
      - stderr
      - stdout
      - type
      type: object
    BashCodeExecutionToolResultBlockParam:
      additionalProperties: false
      properties:
        cache_control:
          anyOf:
          - $ref: '#/components/schemas/CacheControlEphemeralParam'
          - type: 'null'
        content:
          anyOf:
          - $ref: '#/components/schemas/BashCodeExecutionToolResultErrorParam'
          - $ref: '#/components/schemas/BashCodeExecutionResultBlockParam'
        tool_use_id:
          type: string
        type:
          const: bash_code_execution_tool_result
          type: string
      required:
      - content
      - tool_use_id
      - type
      type: object
    BashCodeExecutionToolResultErrorParam:
      additionalProperties: false
      properties:
        error_code:
          enum:
          - execution_time_exceeded
          - invalid_tool_input
          - output_file_too_large
          - too_many_requests
          - unavailable
          type: string
        type:
          const: bash_code_execution_tool_result_error
          type: string
      required:
      - error_code
      - type
      type: object
    CacheControlEphemeralParam:
      additionalProperties: false
      properties:
        ttl:
          enum:
          - 1h
          - 5m
          type: string
        type:
          const: ephemeral
          type: string
      required:
      - type
      type: object
    CitationCharLocationParam:
      additionalProperties: false
      properties:
        cited_text:
          type: string
        document_index:
          type: integer
        document_title:
          anyOf:
          - type: string
          - type: 'null'
        end_char_index:
          type: integer
        start_char_index:
          type: integer
        type:
          const: char_location
          type: string
      required:
      - cited_text
      - document_index
      - document_title
      - end_char_index
      - start_char_index
      - type
      type: object
    CitationContentBlockLocationParam:
      additionalProperties: false
      properties:
        cited_text:
          type: string
        document_index:
          type: integer
        document_title:
          anyOf:
          - type: string
          - type: 'null'
        end_block_index:
          type: integer
        start_block_index:
          type: integer
        type:
          const: content_block_location
          type: string
      required:
      - cited_text
      - document_index
      - document_title
      - end_block_index
      - start_block_index
      - type
      type: object
    CitationPageLocationParam:
      additionalProperties: false
      properties:
        cited_text:
          type: string
        document_index:
          type: integer
        document_title:
          anyOf:
          - type: string
          - type: 'null'
        end_page_number:
          type: integer
        start_page_number:
          type: integer
        type:
          const: page_location
          type: string
      required:
      - cited_text
      - document_index
      - document_title
      - end_page_number
      - start_page_number
      - type
      type: object
    CitationSearchResultLocationParam:
      additionalProperties: false
      properties:
        cited_text:
          type: string
        end_block_index:
          type: integer
        search_result_index:
          type: integer
        source:
          type: string
        start_block_index:
          type: integer
        title:
          anyOf:
          - type: string
          - type: 'null'
        type:
          const: search_result_location
          type: string
      required:
      - cited_text
      - end_block_index
      - search_result_index
      - source
      - start_block_index
      - title
      - type
      type: object
    CitationWebSearchResultLocationParam:
      additionalProperties: false
      properties:
        cited_text:
          type: string
        encrypted_index:
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
        type:
          const: web_search_result_location
          type: string
        url:
          type: string
      required:
      - cited_text
      - encrypted_index
      - title
      - type
      - url
      type: object
    CitationsConfigParam:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
      type: object
    CodeExecutionOutputBlockParam:
      additionalProperties: false
      properties:
        file_id:
          type: string
        type:
          const: code_execution_output
          type: string
      required:
      - file_id
      - type
      type: object
    CodeExecutionResultBlockParam:
      additionalProperties: false
      properties:
        content:
          items:
            $ref: '#/components/schemas/CodeExecutionOutputBlockParam'
          type: array
        return_code:
          type: integer
        stderr:
          type: string
        stdout:
          type: string
        type:
          const: code_execution_result
          type: string
      required:
      - content
      - return_code
      - stderr
      - stdout
      - type
      type: object
    CodeExecutionToolResultBlockParam:
      additionalProperties: false
      properties:
        cache_control:
          anyOf:
          - $ref: '#/components/schemas/CacheControlEphemeralParam'
          - type: 'null'
        content:
          anyOf:
          - $ref: '#/components/schemas/CodeExecutionToolResultErrorParam'
          - $ref: '#/components/schemas/CodeExecutionResultBlockParam'
          - $ref: '#/components/schemas/EncryptedCodeExecutionResultBlockParam'
        tool_use_id:
          type: string
        type:
          const: code_execution_tool_result
          type: string
      required:
      - content
      - tool_use_id
      - type
      type: object
    CodeExecutionToolResultErrorParam:
      additionalProperties: false
      properties:
        error_code:
          enum:
          - execution_time_exceeded
          - invalid_tool_input
          - too_many_requests
          - unavailable
          type: string
        type:
          const: code_execution_tool_result_error
          type: string
      required:
      - error_code
      - type
      type: object
    ContentBlockSourceParam:
      additionalProperties: false
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - $ref: '#/components/schemas/TextBlockParam'
              - $ref: '#/components/schemas/ImageBlockParam'
            type: array
        type:
          const: content
          type: string
      required:
      - content
      - type
      type: object
    DirectCallerParam:
      additionalProperties: false
      properties:
        type:
          const: direct
          type: string
      required:
      - type
      type: object
    DocumentBlockParam:
      additionalProperties: false
      properties:
        cache_control:
          anyOf:
          - $ref: '#/components/schemas/CacheControlEphemeralParam'
          - type: 'null'
        citations:
          anyOf:
          - $ref: '#/components/schemas/CitationsConfigParam'
          - type: 'null'
        context:
          anyOf:
          - type: string
          - type: 'null'
        source:
          anyOf:
          - $ref: '#/components/schemas/Base64PDFSourceParam'
          - $ref: '#/components/schemas/PlainTextSourceParam'
          - $ref: '#/components/schemas/ContentBlockSourceParam'
          - $ref: '#/components/schemas/URLPDFSourceParam'
        title:
          anyOf:
          - type: string
          - type: 'null'
        type:
          const: document
          type: string
      required:
      - source
      - type
      type: object
    EncryptedCodeExecutionResultBlockParam:
      additionalProperties: false
      properties:
        content:
          items:
            $ref: '#/components/schemas/CodeExecutionOutputBlockParam'
          type: array
        encrypted_stdout:
          type: string
        return_code:
          type: integer
        stderr:
          type: string
        type:
          const: encrypted_code_execution_result
          type: string
      required:
      - content
      - encrypted_stdout
      - return_code
      - stderr
      - type
      type: object
    ImageBlockParam:
      additionalProperties: false
      properties:
        cache_control:
          anyOf:
          - $ref: '#/components/schemas/CacheControlEphemeralParam'
          - type: 'null'
        source:
          anyOf:
          - $ref: '#/components/schemas/Base64ImageSourceParam'
          - $ref: '#/components/schemas/URLImageSourceParam'
        type:
          const: image
          type: string
      required:
      - source
      - type
      type: object
    JSONOutputFormatParam:
      additionalProperties: false
      properties:
        schema:
          type: object
        type:
          const: json_schema
          type: string
      required:
      - schema
      - type
      type: object
    MessageCreateParamsStreaming:
      additionalProperties: false
      properties:
        container:
          anyOf:
          - type: string
          - type: 'null'
        max_tokens:
          type: integer
        messages:
          items:
            $ref: '#/components/schemas/MessageParam'
          type: array
        model:
          type: string
        output_config:
          $ref: '#/components/schemas/OutputConfigParam'
        stream:
          const: true
          type: boolean
        system:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/TextBlockParam'
            type: array
        thinking:
          anyOf:
          - $ref: '#/components/schemas/ThinkingConfigDisabledParam'
          - $ref: '#/components/schemas/ThinkingConfigAdaptiveParam'
          - additionalProperties: false
            properties:
              type:
                const: between_tools
            required:
            - type
            type: object
            x-alek-extension: Sonnet 5.5 rejects thinking.type=disabled; between_tools is its no-thinking floor (src/adapters/claude_adapter.py
              _THINKING_OFF), absent from the SDK's ThinkingConfigParam (2026-11-18)
        tool_choice:
          anyOf:
          - $ref: '#/components/schemas/ToolChoiceAutoParam'
          - $ref: '#/components/schemas/ToolChoiceAnyParam'
        tools:
          items:
            anyOf:
            - $ref: '#/components/schemas/ToolParam'
            - $ref: '#/components/schemas/WebSearchTool20250305Param'
            - $ref: '#/components/schemas/WebFetchTool20250910Param'
            - $ref: '#/components/schemas/WebSearchTool20260209Param'
            - $ref: '#/components/schemas/WebFetchTool20260209Param'
          type: array
      required:
      - max_tokens
      - messages
      - model
      - stream
      type: object
    MessageParam:
      additionalProperties: false
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - $ref: '#/components/schemas/TextBlockParam'
              - $ref: '#/components/schemas/ImageBlockParam'
              - $ref: '#/components/schemas/DocumentBlockParam'
              - $ref: '#/components/schemas/ThinkingBlockParam'
              - $ref: '#/components/schemas/RedactedThinkingBlockParam'
              - $ref: '#/components/schemas/ToolUseBlockParam'
              - $ref: '#/components/schemas/ToolResultBlockParam'
              - $ref: '#/components/schemas/ServerToolUseBlockParam'
              - $ref: '#/components/schemas/WebSearchToolResultBlockParam'
              - $ref: '#/components/schemas/WebFetchToolResultBlockParam'
              - $ref: '#/components/schemas/CodeExecutionToolResultBlockParam'
              - $ref: '#/components/schemas/BashCodeExecutionToolResultBlockParam'
              - $ref: '#/components/schemas/TextEditorCodeExecutionToolResultBlockParam'
            type: array
        role:
          enum:
          - assistant
          - system
          - user
          type: string
      required:
      - content
      - role
      type: object
    OutputConfigParam:
      additionalProperties: false
      properties:
        effort:
          anyOf:
          - enum:
            - high
            - low
            - max
            - medium
            - xhigh
            type: string
          - type: 'null'
        format:
          $ref: '#/components/schemas/JSONOutputFormatParam'
      type: object
    PlainTextSourceParam:
      additionalProperties: false
      properties:
        data:
          type: string
        media_type:
          const: text/plain
          type: string
        type:
          const: text
          type: string
      required:
      - data
      - media_type
      - type
      type: object
    RedactedThinkingBlockParam:
      additionalProperties: false
      properties:
        data:
          type: string
        type:
          const: redacted_thinking
          type: string
      required:
      - data
      - type
      type: object
    SearchResultBlockParam:
      additionalProperties: false
      properties:
        cache_control:
          anyOf:
          - $ref: '#/components/schemas/CacheControlEphemeralParam'
          - type: 'null'
        citations:
          $ref: '#/components/schemas/CitationsConfigParam'
        content:
          items:
            $ref: '#/components/schemas/TextBlockParam'
          type: array
        source:
          type: string
        title:
          type: string
        type:
          const: search_result
          type: string
      required:
      - content
      - source
      - title
      - type
      type: object
    ServerToolCaller20260120Param:
      additionalProperties: false
      properties:
        tool_id:
          type: string
        type:
          const: code_execution_20260120
          type: string
      required:
      - tool_id
      - type
      type: object
    ServerToolCallerParam:
      additionalProperties: false
      properties:
        tool_id:
          type: string
        type:
          const: code_execution_20250825
          type: string
      required:
      - tool_id
      - type
      type: object
    ServerToolUseBlockParam:
      additionalProperties: false
      properties:
        cache_control:
          anyOf:
          - $ref: '#/components/schemas/CacheControlEphemeralParam'
          - type: 'null'
        caller:
          anyOf:
          - $ref: '#/components/schemas/DirectCallerParam'
          - $ref: '#/components/schemas/ServerToolCallerParam'
          - $ref: '#/components/schemas/ServerToolCaller20260120Param'
        id:
          type: string
        input:
          additionalProperties: true
          type: object
        name:
          enum:
          - bash_code_execution
          - code_execution
          - text_editor_code_execution
          - tool_search_tool_bm25
          - tool_search_tool_regex
          - web_fetch
          - web_search
          type: string
        type:
          const: server_tool_use
          type: string
      required:
      - id
      - input
      - name
      - type
      type: object
    TextBlockParam:
      additionalProperties: false
