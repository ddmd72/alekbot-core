info:
  title: anthropic request and response subset
  version: 0.121.0
openapi: 3.1.0
paths:
  /v1/messages:
    post:
      parameters:
      - explode: false
        in: header
        name: anthropic-beta
        required: false
        schema:
          items:
            anyOf:
            - enum:
              - advisor-tool-2026-03-01
              - agent-memory-2026-07-22
              - cache-diagnosis-2026-04-07
              - code-execution-2025-05-22
              - computer-use-2024-10-22
              - computer-use-2025-01-24
              - context-1m-2025-08-07
              - context-management-2025-06-27
              - dev-full-thinking-2025-05-14
              - dreaming-2026-04-21
              - extended-cache-ttl-2025-04-11
              - fallback-credit-2026-06-01
              - fallback-credit-2026-07-01
              - fast-mode-2026-02-01
              - files-api-2025-04-14
              - interleaved-thinking-2025-05-14
              - managed-agents-2026-04-01
              - mcp-client-2025-04-04
              - mcp-client-2025-11-20
              - message-batches-2024-09-24
              - mid-conversation-tool-changes-2026-07-01
              - model-context-window-exceeded-2025-08-26
              - output-128k-2025-02-19
              - output-300k-2026-03-24
              - pdfs-2024-09-25
              - prompt-caching-2024-07-31
              - server-side-fallback-2026-06-01
              - server-side-fallback-2026-07-01
              - skills-2025-10-02
              - thinking-token-count-2026-05-13
              - token-counting-2024-11-01
              - token-efficient-tools-2025-02-19
              - user-profiles-2026-03-24
              type: string
            - const: web-search-2025-03-05
              x-alek-extension: sent with the legacy web_search_20250305 tool on the grounding path of models without dynamic
                search (src/adapters/claude_adapter.py generate_content beta_headers), absent from the SDK's AnthropicBetaParam
                literals (2026-11-18)
          type: array
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateParamsStreaming'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
            text/event-stream:
              schema:
                anyOf:
                - $ref: '#/components/schemas/RawMessageStartEvent'
                - $ref: '#/components/schemas/RawMessageDeltaEvent'
                - $ref: '#/components/schemas/RawMessageStopEvent'
                - $ref: '#/components/schemas/RawContentBlockStartEvent'
                - $ref: '#/components/schemas/RawContentBlockDeltaEvent'
                - $ref: '#/components/schemas/RawContentBlockStopEvent'
                - additionalProperties: false
                  properties:
                    type:
                      const: ping
                  required:
                  - type
                  type: object
                  x-alek-extension: 'Anthropic''s streaming documentation: a stream may carry any number of ping events (data
                    {"type": "ping"}); the SDK passes on only the event names it knows (anthropic/_streaming.py Stream.__stream__)
                    and drops ping, so its event types lack it (2026-11-19)'
          description: 'the parts our adapter reads: src/adapters/claude_adapter.py:627-639, 709-742, 1277-1387 (_raise_on_refusal,
            _grounded_stream_loop, _map_finish_reason, _parse_response)'
servers:
- url: https://api.anthropic.com
x-retrieved: '2026-11-19'
x-source: anthropic-sdk-python@0.121.0
x-transforms:
- 'prune: only the listed top-level fields and union variants are kept'
- 'flatten-allOf: an allOf of objects becomes one object (properties and required merged)'
- 'oneOf-to-anyOf: variants overlap (a message with list content matches two of them)'
- 'close-objects: additionalProperties false on every object that declares properties, except the open paths'
- 'open-paths: our own JSON Schemas (the open paths) are free-form objects'
- 'drop-redundant-literals: a literal next to a plain {type: T} in a union accepts nothing more (model id lists)'
- 'drop-doc-keys: documentation keys and vendor doc extensions dropped (spec_drift.normalize); property names kept'
- 'stringify-dates: YAML dates become ISO strings'
- 'sdk-schema: pydantic TypeAdapter(<request TypedDict>).json_schema(), $defs as components'
- 'drop-header-aliases: fields the SDK sends as headers (PropertyInfo alias) are not body fields'
- 'drop-sdk-response-models: union members that are SDK response models (accepted as input for convenience) are dropped; the
  request types (*Param) are the wire contract'
- 'header-literals: a header''s allowed values are its SDK type''s Literal values'
- 'sdk-response-schema: pydantic TypeAdapter(<response model>).json_schema(), $defs as components'
- 'sdk-response-closed: the SDK''s response models accept extra fields (additionalProperties true); the subset closes every
  one that declares properties'
- 'response-unread: a top-level response field the adapter does not read is kept by name with an any-value schema (x-alek-unread);
  the object stays closed'
- 'response-stream-item: a text/event-stream schema is one event''s data JSON (OpenAPI 3.1 has no item schema)'
