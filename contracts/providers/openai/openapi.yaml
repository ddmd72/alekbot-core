        prompt:
          x-alek-unread: 'not read by our adapter: any value'
        prompt_cache_diagnostics:
          x-alek-unread: 'not read by our adapter: any value'
        prompt_cache_key:
          x-alek-unread: 'not read by our adapter: any value'
        prompt_cache_options:
          x-alek-unread: 'not read by our adapter: any value'
        prompt_cache_retention:
          x-alek-unread: 'not read by our adapter: any value'
        reasoning:
          x-alek-unread: 'not read by our adapter: any value'
        safety_identifier:
          x-alek-unread: 'not read by our adapter: any value'
        service_tier:
          x-alek-unread: 'not read by our adapter: any value'
        status:
