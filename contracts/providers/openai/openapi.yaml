            lacks it; not read by the adapter (2026-11-19)
        completed_at:
          x-alek-unread: 'not read by our adapter: any value'
        conversation:
          x-alek-unread: 'not read by our adapter: any value'
        created_at:
          x-alek-unread: 'not read by our adapter: any value'
        error:
          x-alek-unread: 'not read by our adapter: any value'
        frequency_penalty:
