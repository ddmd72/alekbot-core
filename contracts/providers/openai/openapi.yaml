            spec's Response lacks it; not read by the adapter (2026-11-19)
        id:
          x-alek-unread: 'not read by our adapter: any value'
        image:
          x-alek-unread: 'not read by our adapter: any value'
        incomplete_details:
          anyOf:
          - additionalProperties: false
            properties:
              reason:
                enum:
                - content_filter
                - max_messages
                - max_output_tokens
                - steered
                type: string
            type: object
          - type: 'null'
        input_transformations:
          x-alek-unread: 'not read by our adapter: any value'
        instructions:
          x-alek-unread: 'not read by our adapter: any value'
        max_output_tokens:
          x-alek-unread: 'not read by our adapter: any value'
        max_tool_calls:
          x-alek-unread: 'not read by our adapter: any value'
        metadata:
          x-alek-unread: 'not read by our adapter: any value'
        model:
          $ref: '#/components/schemas/ModelIdsResponses'
        moderation:
          x-alek-unread: 'not read by our adapter: any value'
        object:
          x-alek-unread: 'not read by our adapter: any value'
        output:
          items:
            anyOf:
            - $ref: '#/components/schemas/OutputMessage'
            - $ref: '#/components/schemas/FunctionToolCall'
            - $ref: '#/components/schemas/WebSearchToolCall'
            - $ref: '#/components/schemas/ReasoningItem'
          type: array
        output_text:
          x-alek-unread: 'not read by our adapter: any value'
        parallel_tool_calls:
          x-alek-unread: 'not read by our adapter: any value'
        presence_penalty:
