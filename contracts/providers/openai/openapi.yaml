components:
  schemas:
    Annotation:
      anyOf:
      - $ref: '#/components/schemas/FileCitationBody'
      - $ref: '#/components/schemas/UrlCitationBody'
      - $ref: '#/components/schemas/ContainerFileCitationBody'
      - $ref: '#/components/schemas/FilePath'
    CacheWriteTokensDetails:
      additionalProperties: false
      properties:
        ttl_12h_tokens:
          type: integer
        ttl_30m_tokens:
          type: integer
      required:
      - ttl_12h_tokens
      - ttl_30m_tokens
      type: object
    CallableToolAllowedCaller:
      enum:
      - direct
      - programmatic
      type: string
    ContainerFileCitationBody:
      additionalProperties: false
      properties:
        container_id:
          type: string
        end_index:
          type: integer
        file_id:
          type: string
        filename:
          type: string
        start_index:
          type: integer
        type:
          default: container_file_citation
          enum:
          - container_file_citation
          type: string
      required:
      - container_id
      - end_index
      - file_id
      - filename
      - start_index
      - type
      type: object
    CreateResponse:
      additionalProperties: false
      properties:
        input:
          $ref: '#/components/schemas/InputParam'
        instructions:
          anyOf:
          - type: string
          - type: 'null'
        max_output_tokens:
          anyOf:
          - minimum: 16
            type: integer
          - type: 'null'
        model:
          $ref: '#/components/schemas/ModelIdsResponses'
        prompt_cache_key:
          anyOf:
          - type: string
          - type: 'null'
        prompt_cache_retention:
          anyOf:
          - enum:
            - 24h
            - in_memory
            type: string
          - type: 'null'
          deprecated: true
          x-alek-extension: deprecated in the spec; sent only for models before GPT-5.6, where it still sets the 24h retention
            (src/adapters/openai_adapter.py _DEPRECATED_RETENTION_PREFIXES, generate_content) (2026-11-18)
        reasoning:
          $ref: '#/components/schemas/Reasoning'
        store:
          anyOf:
          - default: true
            type: boolean
          - type: 'null'
        text:
          $ref: '#/components/schemas/ResponseTextParam'
        tool_choice:
          $ref: '#/components/schemas/ToolChoiceOptions'
        tools:
          $ref: '#/components/schemas/ToolsArray'
      type: object
    DetailEnum:
      enum:
      - auto
      - high
      - low
      - original
      type: string
    DirectToolCallCaller:
      additionalProperties: false
      properties:
        type:
          default: direct
          enum:
          - direct
          type: string
      required:
      - type
      type: object
    DirectToolCallCallerParam:
      additionalProperties: false
      properties:
        type:
          default: direct
          enum:
          - direct
          type: string
      required:
      - type
      type: object
    EasyInputMessage:
      additionalProperties: false
      properties:
        content:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/InputMessageContentList'
        phase:
          anyOf:
          - $ref: '#/components/schemas/MessagePhase'
          - type: 'null'
        role:
          enum:
          - assistant
          - developer
          - system
          - user
          type: string
        type:
          enum:
          - message
          type: string
      required:
      - content
      - role
      type: object
    FileCitationBody:
      additionalProperties: false
      properties:
        file_id:
          type: string
        filename:
          type: string
        index:
          type: integer
        type:
          default: file_citation
          enum:
          - file_citation
          type: string
      required:
      - file_id
      - filename
      - index
      - type
      type: object
    FileDetailEnum:
      enum:
      - auto
      - high
      - low
      type: string
    FileInputDetail:
      enum:
      - auto
      - high
      - low
      type: string
    FilePath:
      additionalProperties: false
      properties:
        file_id:
          type: string
        index:
          type: integer
        type:
          enum:
          - file_path
          type: string
      required:
      - file_id
      - index
      - type
      type: object
    FunctionCallItemStatus:
      enum:
      - completed
      - in_progress
      - incomplete
      type: string
    FunctionCallOutputItemParam:
      additionalProperties: false
      properties:
        call_id:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
        caller:
          anyOf:
          - $ref: '#/components/schemas/ToolCallCallerParam'
          - type: 'null'
        id:
          anyOf:
          - type: string
          - type: 'null'
        name:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
        namespace:
          anyOf:
          - maxLength: 128
            minLength: 1
            pattern: ^[a-zA-Z0-9_-]+$
            type: string
          - type: 'null'
        output:
          anyOf:
          - maxLength: 10485760
            type: string
          - items:
              anyOf:
              - $ref: '#/components/schemas/InputTextContentParam'
              - $ref: '#/components/schemas/InputImageContentParamAutoParam'
              - $ref: '#/components/schemas/InputFileContentParam'
            type: array
        status:
          anyOf:
          - $ref: '#/components/schemas/FunctionCallItemStatus'
          - type: 'null'
        type:
          default: function_call_output
          enum:
          - function_call_output
          type: string
      required:
      - output
      - type
      type: object
    FunctionTool:
      additionalProperties: false
      properties:
        allowed_callers:
          anyOf:
          - items:
              $ref: '#/components/schemas/CallableToolAllowedCaller'
            type: array
          - type: 'null'
        async:
          type: boolean
        defer_loading:
          type: boolean
        description:
          anyOf:
          - type: string
          - type: 'null'
        name:
          type: string
        output_schema:
          anyOf:
          - additionalProperties: {}
            type: object
          - type: 'null'
        parameters:
          type: object
        strict:
          anyOf:
          - type: boolean
          - type: 'null'
        type:
          default: function
          enum:
          - function
          type: string
      required:
      - name
      - parameters
      - strict
      - type
      type: object
      x-openai-structured-output: function
    FunctionToolCall:
      additionalProperties: false
      properties:
        arguments:
          type: string
        async:
          type: boolean
        call_id:
          type: string
        caller:
          anyOf:
          - $ref: '#/components/schemas/ToolCallCaller'
          - type: 'null'
        id:
          type: string
        name:
          type: string
        namespace:
          type: string
        status:
          enum:
          - completed
          - in_progress
          - incomplete
          type: string
        type:
          const: function_call
          type: string
      required:
      - arguments
      - call_id
      - name
      - type
      type: object
    ImageDetail:
      enum:
      - auto
      - high
      - low
      - original
      type: string
    InputFileContent:
      additionalProperties: false
      properties:
        detail:
          $ref: '#/components/schemas/FileInputDetail'
        file_data:
          type: string
        file_id:
          anyOf:
          - type: string
          - type: 'null'
        file_url:
          format: uri
          type: string
        filename:
          type: string
        prompt_cache_breakpoint:
          $ref: '#/components/schemas/PromptCacheBreakpointConfig'
        type:
          default: input_file
          enum:
          - input_file
          type: string
      required:
      - type
      type: object
    InputFileContentParam:
      additionalProperties: false
      properties:
        detail:
          $ref: '#/components/schemas/FileDetailEnum'
        file_data:
          anyOf:
          - maxLength: 73400320
            type: string
          - type: 'null'
        file_id:
          anyOf:
          - type: string
          - type: 'null'
        file_url:
          anyOf:
          - format: uri
            type: string
          - type: 'null'
        filename:
          anyOf:
          - type: string
          - type: 'null'
        prompt_cache_breakpoint:
          anyOf:
          - $ref: '#/components/schemas/PromptCacheBreakpointParam'
          - type: 'null'
        type:
          default: input_file
          enum:
          - input_file
          type: string
      required:
      - type
      type: object
    InputImageContent:
      additionalProperties: false
      properties:
        detail:
          $ref: '#/components/schemas/ImageDetail'
        file_id:
          anyOf:
          - type: string
          - type: 'null'
        image_url:
          anyOf:
          - format: uri
            type: string
          - type: 'null'
        prompt_cache_breakpoint:
          $ref: '#/components/schemas/PromptCacheBreakpointConfig'
        type:
          default: input_image
          enum:
          - input_image
          type: string
      required:
      - detail
      - type
      type: object
    InputImageContentParamAutoParam:
      additionalProperties: false
      properties:
        detail:
          anyOf:
          - $ref: '#/components/schemas/DetailEnum'
          - type: 'null'
        file_id:
          anyOf:
          - type: string
          - type: 'null'
        image_url:
          anyOf:
          - format: uri
            maxLength: 20971520
            type: string
          - type: 'null'
        prompt_cache_breakpoint:
          anyOf:
          - $ref: '#/components/schemas/PromptCacheBreakpointParam'
          - type: 'null'
        type:
          default: input_image
          enum:
          - input_image
          type: string
      required:
      - type
      type: object
    InputMessage:
      additionalProperties: false
      properties:
        content:
          $ref: '#/components/schemas/InputMessageContentList'
        role:
          enum:
          - developer
          - system
          - user
          type: string
        status:
          enum:
          - completed
          - in_progress
          - incomplete
          type: string
        type:
          const: message
          type: string
      required:
      - content
      - role
      type: object
    InputMessageContentList:
      items:
        anyOf:
        - $ref: '#/components/schemas/InputTextContent'
        - $ref: '#/components/schemas/InputImageContent'
        - $ref: '#/components/schemas/InputFileContent'
      type: array
    InputParam:
      anyOf:
      - type: string
      - items:
          anyOf:
          - $ref: '#/components/schemas/EasyInputMessage'
          - $ref: '#/components/schemas/InputMessage'
          - $ref: '#/components/schemas/OutputMessage'
          - $ref: '#/components/schemas/WebSearchToolCall'
          - $ref: '#/components/schemas/FunctionToolCall'
          - $ref: '#/components/schemas/FunctionCallOutputItemParam'
          - $ref: '#/components/schemas/ReasoningItem'
        type: array
    InputTextContent:
      additionalProperties: false
      properties:
        prompt_cache_breakpoint:
          $ref: '#/components/schemas/PromptCacheBreakpointConfig'
        text:
          type: string
        type:
          default: input_text
          enum:
          - input_text
          type: string
      required:
      - text
      - type
      type: object
    InputTextContentParam:
      additionalProperties: false
      properties:
        prompt_cache_breakpoint:
          anyOf:
          - $ref: '#/components/schemas/PromptCacheBreakpointParam'
          - type: 'null'
        text:
          maxLength: 10485760
          type: string
        type:
          default: input_text
          enum:
          - input_text
          type: string
      required:
      - text
      - type
      type: object
    LogProb:
      additionalProperties: false
      properties:
        bytes:
          items:
            type: integer
          type: array
        logprob:
          type: number
        token:
          type: string
        top_logprobs:
          items:
            $ref: '#/components/schemas/TopLogProb'
          type: array
      required:
      - bytes
      - logprob
      - token
      - top_logprobs
      type: object
    MessagePhase:
      enum:
      - commentary
      - final_answer
      type: string
    ModelIdsResponses:
      $ref: '#/components/schemas/ModelIdsShared'
    ModelIdsShared:
      type: string
    OutputMessage:
      additionalProperties: false
      properties:
        content:
          items:
            $ref: '#/components/schemas/OutputTextContent'
          type: array
        id:
          type: string
        phase:
          anyOf:
          - $ref: '#/components/schemas/MessagePhase'
          - type: 'null'
        role:
          const: assistant
          type: string
        status:
          enum:
          - completed
          - in_progress
          - incomplete
          type: string
        type:
          const: message
          type: string
      required:
      - content
      - id
      - role
      - status
      - type
      type: object
    OutputTextContent:
      additionalProperties: false
      properties:
        annotations:
          items:
            $ref: '#/components/schemas/Annotation'
          type: array
        logprobs:
          items:
            $ref: '#/components/schemas/LogProb'
          type: array
        text:
          type: string
        type:
          default: output_text
          enum:
          - output_text
          type: string
      required:
      - annotations
      - logprobs
      - text
      - type
      type: object
    ProgramToolCallCaller:
      additionalProperties: false
      properties:
        caller_id:
          type: string
        type:
          default: program
          enum:
          - program
          type: string
      required:
      - caller_id
      - type
      type: object
    ProgramToolCallCallerParam:
      additionalProperties: false
      properties:
        caller_id:
          maxLength: 64
          minLength: 1
          type: string
        type:
          default: program
          enum:
          - program
          type: string
      required:
      - caller_id
      - type
      type: object
    PromptCacheBreakpointConfig:
      additionalProperties: false
      properties:
        mode:
          default: explicit
          enum:
          - explicit
          type: string
        ttl:
          enum:
          - 12h
          - 30m
          type: string
      required:
      - mode
      type: object
    PromptCacheBreakpointParam:
      additionalProperties: false
      properties:
        mode:
          default: explicit
          enum:
          - explicit
          type: string
        ttl:
          enum:
          - 12h
          - 30m
          type: string
      required:
      - mode
      type: object
    Reasoning:
      additionalProperties: false
      properties:
        context:
          anyOf:
          - enum:
            - all_turns
            - auto
            - current_turn
            type: string
          - type: 'null'
        effort:
          $ref: '#/components/schemas/ReasoningEffort'
        generate_summary:
          anyOf:
          - deprecated: true
            enum:
            - auto
            - concise
            - detailed
            type: string
          - type: 'null'
        mode:
          $ref: '#/components/schemas/ReasoningModeEnum'
        summary:
          anyOf:
          - enum:
            - auto
            - concise
            - detailed
            type: string
          - type: 'null'
      type: object
    ReasoningEffort:
      anyOf:
      - default: medium
        enum:
        - high
        - low
        - max
        - medium
        - minimal
        - none
        - xhigh
        type: string
      - type: 'null'
    ReasoningItem:
      additionalProperties: false
      properties:
        content:
          items:
            $ref: '#/components/schemas/ReasoningTextContent'
          type: array
        encrypted_content:
          anyOf:
          - type: string
          - type: 'null'
        id:
          type: string
        status:
          enum:
          - completed
          - in_progress
          - incomplete
          type: string
        summary:
          items:
            $ref: '#/components/schemas/SummaryTextContent'
          type: array
        type:
          enum:
          - reasoning
          type: string
      required:
      - id
      - summary
      - type
      type: object
    ReasoningModeEnum:
      type: string
    ReasoningTextContent:
      additionalProperties: false
      properties:
        text:
          type: string
        type:
          default: reasoning_text
          enum:
          - reasoning_text
          type: string
      required:
      - text
      - type
      type: object
    Response:
      additionalProperties: false
      properties:
        access_programs:
          x-alek-unread: 'not read by our adapter: any value'
        background:
          x-alek-unread: 'not read by our adapter: any value'
        billing:
          additionalProperties: false
          properties:
            payer:
              type: string
          required:
