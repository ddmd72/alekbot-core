        tool_choice:
          x-alek-unread: 'not read by our adapter: any value'
        tool_usage:
          x-alek-unread: 'not read by our adapter: any value'
        tools:
          x-alek-unread: 'not read by our adapter: any value'
        top_logprobs:
          x-alek-unread: 'not read by our adapter: any value'
        top_p:
          x-alek-unread: 'not read by our adapter: any value'
        truncation:
          x-alek-unread: 'not read by our adapter: any value'
        usage:
