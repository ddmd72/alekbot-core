# Ruff configuration — lint gate for src/ (see Makefile `make lint` / `make format`).
# Rule set is ruff's default high-signal selection (pyflakes + pycodestyle errors)
# plus RUF006: real bugs and import hygiene, not stylistic noise. `ruff format` is
# black-compatible.
target-version = "py313"
line-length = 120

extend-exclude = ["archive", "docx_generator"]

[lint]
# RUF006: asyncio.create_task()/ensure_future() result must be stored — an untracked
# Task holds no strong ref and can be GC'd mid-flight. Selected as one explicit rule
# (not the whole RUF category) to avoid pulling in unvetted stylistic rules. See
# docs/04_solution_strategy/decisions/asyncio_dangling_task_lint_gate.md.
select = ["E4", "E7", "E9", "F", "RUF006"]
