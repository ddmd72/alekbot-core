steps:
  # Pull previous image to use as build cache (|| true so first deploy doesn't fail)
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "docker pull gcr.io/$PROJECT_ID/alek-bot-dev:latest || true"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "--cache-from", "gcr.io/$PROJECT_ID/alek-bot-dev:latest",
           "-t", "gcr.io/$PROJECT_ID/alek-bot-dev:latest", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/alek-bot-dev:latest"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "alek-bot-dev"
      - "--service-account=alek-main@$PROJECT_ID.iam.gserviceaccount.com"
      - "--image=gcr.io/$PROJECT_ID/alek-bot-dev:latest"
      - "--region=us-central1"
      - "--set-env-vars=APP_ENV=development,SLACK_MODE=http,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CLOUD_RUN_SERVICE_URL=$_SERVICE_URL,FIRESTORE_DATABASE=us-production,OAUTH_REDIRECT_URI=$_OAUTH_REDIRECT_URI,ENABLE_HTML_RENDERER=true,ENABLE_GROUNDING_ATTRIBUTION=false,DEBUG_PROMPTS=true,GCS_MEDIA_BUCKET=alek-media-dev,SYSTEM_DEFAULT_LANGUAGE=uk,MCP_RESOURCE_URI=$_SERVICE_URL/mcp,TRACING_BACKEND=both,LOGFIRE_CAPTURE_CONTENT=true,BIGQUERY_PROMPT_DATASET=alek_observability_dev,VOICE_RELAY_STREAM_URL=$_VOICE_RELAY_URL,DRIVE_INDEXER_URL=$_INDEXER_URL,DRIVE_TRANSCRIBE_USD_CAP=$_DRIVE_TRANSCRIBE_USD_CAP,DRIVE_TRANSCRIBE_ENABLED=$_DRIVE_TRANSCRIBE_ENABLED,SANDBOX_RENDER=$_SANDBOX_RENDER,SANDBOX_RENDER_URL=$_SANDBOX_RENDER_URL,FACT_LIFECYCLE_SWEEP_DRY_RUN=0,DRIVE_NOTES_ENABLED=$_DRIVE_NOTES_ENABLED"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--timeout=1800"
      - "--port=8080" # Required for HTTP mode
      - "--allow-unauthenticated" # For dev testing
      - "--set-secrets=SLACK_BOT_TOKEN=SLACK_BOT_TOKEN_DEV:latest,SLACK_SIGNING_SECRET=SLACK_SIGNING_SECRET_DEV:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,XAI_API_KEY=XAI_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,FIREBASE_WEB_API_KEY=FIREBASE_WEB_API_KEY:latest,OAUTH_SESSION_SECRET=OAUTH_SESSION_SECRET:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN_DEV:latest,TELEGRAM_WEBHOOK_SECRET=TELEGRAM_WEBHOOK_SECRET_DEV:latest,DOCS_OWNER_USER_ID=docs-owner-user-id:latest,OAUTH_CONNECT_REDIRECT_URI=OAUTH_CONNECT_REDIRECT_URI_DEV:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENAI_DEEP_RESEARCH_WEBHOOK_URL=OPENAI_DEEP_RESEARCH_WEBHOOK_URL_DEV:latest,OPENAI_DEEP_RESEARCH_WEBHOOK_SECRET=OPENAI_DEEP_RESEARCH_WEBHOOK_SECRET_DEV:latest,GOOGLE_SEARCH_API_KEY=GOOGLE_SEARCH_API_KEY:latest,UNSPLASH_ACCESS_KEY=UNSPLASH_ACCESS_KEY:latest,MICROSOFT_TODO_CLIENT_ID=MICROSOFT_TODO_CLIENT_ID:latest,MICROSOFT_TODO_CLIENT_SECRET=MICROSOFT_TODO_CLIENT_SECRET:latest,MICROSOFT_TASKS_WEBHOOK_SECRET=MICROSOFT_TASKS_WEBHOOK_SECRET:latest,BILLING_SLACK_WEBHOOK_URL=BILLING_SLACK_WEBHOOK_URL:latest,SLACK_APP_TOKEN=SLACK_APP_TOKEN:latest,GOOGLE_SEARCH_CX=GOOGLE_SEARCH_CX:latest,SERVICE_ACCOUNT_EMAIL=SERVICE_ACCOUNT_EMAIL:latest,LOGFIRE_TOKEN=LOGFIRE_TOKEN:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_VERIFY_SERVICE_SID=TWILIO_VERIFY_SERVICE_SID:latest,TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest,CLOUDFLARE_SFU_APP_ID=CLOUDFLARE_SFU_APP_ID:latest,CLOUDFLARE_SFU_APP_SECRET=CLOUDFLARE_SFU_APP_SECRET:latest,GCS_WORKSPACE_BUCKET=GCS_WORKSPACE_BUCKET:latest,DRIVE_INVOKER_SA_EMAIL=DRIVE_INVOKER_SA_EMAIL:latest,VOICE_RELAY_SA_EMAIL=VOICE_RELAY_SA_EMAIL:latest,OIDC_TRANSITION_SA_EMAILS=OIDC_TRANSITION_SA_EMAILS:latest,KMS_CRYPTO_KEY=KMS_CRYPTO_KEY:latest,SECRET_DIGEST_KEY=SECRET_DIGEST_KEY:latest"

  # Explicitly grant public access — --allow-unauthenticated alone is not
  # reliable if the Cloud Build SA lacks roles/iam.securityAdmin.
  # This step is idempotent and ensures every deployment leaves the service
  # publicly accessible.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "alek-bot-dev"
      - "--region=us-central1"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

  # Drive indexing (docs/10_rfcs/USER_DRIVE_INDEXING_RFC.md §4, §12.5): the drive-sync queue and the
  # indexer service deploy AFTER alek-bot-dev, so a failing drive step (the queue's one-time IAM grant
  # missing, an indexer revision that does not start) never blocks a hotfix of the bot. Cost, on the
  # second pass of the two-pass first deploy only: the main service gets DRIVE_INDEXER_URL a minute or
  # two before the indexer does, so a nudge or tick in that window meets the first pass's 503 and is
  # retried by the queue (min-backoff 60 s); the "/worker 5xx" alert may fire once.
  #
  # Drive sync queue. Provisioned here, never by the app: GcpTaskQueue.create_queue_if_not_exists
  # would create it with max-concurrent-dispatches=5. max-concurrent-dispatches=1 is a CPU/memory
  # knob for the indexer instance, not the correctness mechanism — the per-user Firestore lease is
  # (§7.1); raising it is an extension (§14).
  # Retry: only an exception the tick did not handle answers 500 (src/web/indexer_worker_app.py);
  # every handled outcome is a 200 and the tick enqueues its own continuation, and the fan-out
  # re-ticks every user each 10 min — so a few backed-off attempts, then the fan-out takes over.
  # Log sampling 1.0: one line per task operation, a few per user per hour.
  # Prerequisite: the identity this build runs as needs queue admin rights on this queue
  # (roles/cloudtasks.queueAdmin, granted on the queue; docs/07_deployment/SCHEDULERS.md § Start Drive Sync).
  # Without it this step fails the build after the main service is deployed; the indexer, research job,
  # relay and scheduler steps then do not run.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud tasks queues describe drive-sync-dev \
          --location=us-central1 --project=$PROJECT_ID >/dev/null 2>&1 \
        && gcloud tasks queues update drive-sync-dev \
          --max-concurrent-dispatches=1 \
          --max-dispatches-per-second=1 \
          --max-attempts=3 \
          --min-backoff=60s \
          --max-backoff=600s \
          --max-doublings=3 \
          --log-sampling-ratio=1.0 \
          --location=us-central1 \
          --project=$PROJECT_ID \
        || gcloud tasks queues create drive-sync-dev \
          --max-concurrent-dispatches=1 \
          --max-dispatches-per-second=1 \
          --max-attempts=3 \
          --min-backoff=60s \
          --max-backoff=600s \
          --max-doublings=3 \
          --log-sampling-ratio=1.0 \
          --location=us-central1 \
          --project=$PROJECT_ID

  # Deploy Cloud Run service for the drive indexer (same image, different entry point —
  # indexer_main.py). RFC §9 "Host" and §12.5, owner decision D5: the whole drive_sync tick runs
  # here, so alek-bot-dev (1 GiB, already at 74-90 % memory) never indexes. Same deploy discipline
  # as the relay: its own env, no dual-purpose .env key.
  # --memory=2Gi + --execution-environment=gen2: the host S1 measures extraction limits on (Slice 2);
  #   those limits hold only for this pinned environment.
  # --concurrency=1: one tick per instance. --max-instances=1: the drive queue dispatches one task
  #   at a time anyway; raise both together (§14).
  # --timeout=1800: TICK_DEADLINE_S, the Cloud Tasks HTTP maximum; every drive_sync enqueue passes it
  #   as dispatch_deadline, and the tick starts no new work after 8 min (§7.1).
  # --min-instances=0: idle between ticks; a cold start costs nothing a background tick notices.
  # Runs as its own service account (--service-account below). The tasks' OIDC identity is DRIVE_INVOKER_SA_EMAIL when that secret
  #   exists, else SERVICE_ACCOUNT_EMAIL (GcpTaskQueue, drive_indexing_setup); /worker accepts the same
  #   identity plus the optional OIDC_TRANSITION_SA_EMAILS list (src/web/indexer_worker_app.py).
  # Seven secrets, exactly what indexer_main.py reads: GEMINI_API_KEY (embeddings, and the drive agents' Gemini
  #   Flash fallback, §24.2 D7 rev 3.17),
  #   MICROSOFT_TODO_CLIENT_ID/SECRET (drive token refresh; same app registration as Step 1),
  #   SERVICE_ACCOUNT_EMAIL (the /worker gate + the identity of the tasks it enqueues; superseded per role by
  #   DRIVE_INVOKER_SA_EMAIL once that secret is mounted),
  #   ANTHROPIC_API_KEY / OPENAI_API_KEY (the drive reader and triage agents, Slice 2+4 §24.2: secrets, never
  #   substitutions) and BILLING_SLACK_WEBHOOK_URL (the advisory daily budget alert of their billing).
  # DRIVE_UPGRADE_PASS is the upgrade pass's emergency switch (RFC §25.8): it rides as the substitution
  #   _DRIVE_UPGRADE_PASS (Makefile, from DRIVE_UPGRADE_PASS_DEV in .env, default "on"), because
  #   --set-env-vars replaces every variable: a switch set only with `gcloud run services update` would turn
  #   back on at the next deploy (XC-7).
  # DRIVE_TRANSCRIBE_ENABLED is the transcription kill switch (RFC §27.13) and DRIVE_TRANSCRIBE_USD_CAP its optional
  #   monthly dollar cap (only ever LOWERS $20; empty = $20). Same reasoning, same pattern: the substitutions
  #   _DRIVE_TRANSCRIBE_ENABLED (default "off") and _DRIVE_TRANSCRIBE_USD_CAP (default empty) come from the deploy-only
  #   .env keys DRIVE_TRANSCRIBE_ENABLED_DEV / DRIVE_TRANSCRIBE_USD_CAP_DEV (Makefile). The cap rides on the MAIN
  #   service too: the Cabinet shows the effective cap (service_container.py).
  # DRIVE_NOTES_ENABLED is the owner-notes kill switch (DRIVE_FILE_NOTES_RFC §3.6), read by BOTH services: the same
  #   substitution _DRIVE_NOTES_ENABLED (default "on", the code default) from the deploy-only .env key
  #   DRIVE_NOTES_ENABLED_DEV (Makefile) sets it on the main service and the indexer, so they switch and roll back
  #   together and a switch survives the next deploy (XC-7).
  # DRIVE_INDEXER_URL is this service's own URL (continuations and nudge re-queues come back here, and
  #   the /worker gate pins the token audience to it). Empty on the first pass of the two-pass first
  #   deploy (Makefile, _INDEXER_URL): the service still starts and /worker answers 503.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "alek-bot-indexer-dev"
      - "--service-account=alek-indexer@$PROJECT_ID.iam.gserviceaccount.com"
      - "--image=gcr.io/$PROJECT_ID/alek-bot-dev:latest"
      - "--region=us-central1"
      - "--command=python"
      - "--args=indexer_main.py"
      - "--execution-environment=gen2"
      - "--memory=2Gi"
      - "--cpu=1"
      - "--concurrency=1"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--timeout=1800"
      - "--set-env-vars=APP_ENV=development,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,DRIVE_INDEXER_URL=$_INDEXER_URL,DRIVE_UPGRADE_PASS=$_DRIVE_UPGRADE_PASS,DRIVE_TRANSCRIBE_ENABLED=$_DRIVE_TRANSCRIBE_ENABLED,DRIVE_TRANSCRIBE_USD_CAP=$_DRIVE_TRANSCRIBE_USD_CAP,DRIVE_NOTES_ENABLED=$_DRIVE_NOTES_ENABLED"
      - "--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,MICROSOFT_TODO_CLIENT_ID=MICROSOFT_TODO_CLIENT_ID:latest,MICROSOFT_TODO_CLIENT_SECRET=MICROSOFT_TODO_CLIENT_SECRET:latest,SERVICE_ACCOUNT_EMAIL=SERVICE_ACCOUNT_EMAIL:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,BILLING_SLACK_WEBHOOK_URL=BILLING_SLACK_WEBHOOK_URL:latest,DRIVE_INVOKER_SA_EMAIL=DRIVE_INVOKER_SA_EMAIL:latest,OIDC_TRANSITION_SA_EMAILS=OIDC_TRANSITION_SA_EMAILS:latest,KMS_CRYPTO_KEY=KMS_CRYPTO_KEY:latest"
      # RFC Δ21. Ingress internal: the only caller is Cloud Tasks on drive-sync-dev, which counts as
      # internal (same project, default run.app URL). No internet request can reach the service or
      # take its single request slot (concurrency 1, max 1 instance) from a dispatch.
      # Unauthenticated at the IAM layer, OIDC checked in the app: GcpTaskQueue sets no token audience,
      # so Cloud Tasks uses the target URL ({DRIVE_INDEXER_URL}/worker) — RFC §4's "bound to the
      # indexer's /worker URL and OIDC audience" — and Cloud Run IAM documents only the service URL as
      # an accepted audience. The in-app gate (src/web/indexer_worker_app.py) checks signature, the
      # SA email and an audience pinned to this service, and fails closed on Cloud Run without
      # SERVICE_ACCOUNT_EMAIL. Manual triggers therefore go through the queue
      # (`gcloud tasks create-http-task --queue=drive-sync-dev …`), not a curl from outside.
      - "--ingress=internal"
      - "--allow-unauthenticated"
      - "--project=$PROJECT_ID"

  # Explicitly grant invoker to allUsers — see the identical step for alek-bot-dev above
  # (--allow-unauthenticated alone is not reliable if the Cloud Build SA lacks
  # roles/iam.securityAdmin). Idempotent. Ingress stays internal, and /worker stays OIDC-gated.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "alek-bot-indexer-dev"
      - "--region=us-central1"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

  # Deploy Cloud Run Job for deep research (same image, different entrypoint).
  # task-timeout: 3600s (1 hour) — covers first pass + second pass for large research.
  # max-retries: 0 — no automatic retries; the research loop has its own overload retry.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "alek-research-job-dev"
      - "--image=gcr.io/$PROJECT_ID/alek-bot-dev:latest"
      - "--region=us-central1"
      - "--command=python"
      - "--args=job_main.py"
      - "--service-account=alek-research-job@$PROJECT_ID.iam.gserviceaccount.com"
      - "--max-retries=0"
      - "--task-timeout=18000"
      - "--memory=1024Mi"
      - "--cpu=2"
      - "--set-env-vars=APP_ENV=development,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CLOUD_RUN_SERVICE_URL=$_SERVICE_URL,DEBUG_PROMPTS=true,GCS_MEDIA_BUCKET=alek-media-dev,BIGQUERY_PROMPT_DATASET=alek_observability_dev"
      - "--set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,SERVICE_ACCOUNT_EMAIL=SERVICE_ACCOUNT_EMAIL:latest"
      - "--project=$PROJECT_ID"

  # Deploy Cloud Run service for the voice relay (same image, different
  # entrypoint — relay_main.py). RFC docs/10_rfcs/VOICE_COMPANION_RFC.md §4.14:
  # a second Cloud Run *service* (not a Job, like alek-research-job-dev above)
  # because it holds one long-lived WebSocket per phone call — hence
  # --timeout=3600 (vs. the main service's 1800s). Region us-central1 per RFC
  # §5.2 ("start us-central1 beside everything else"); a European region is an
  # unverified optimisation (§9 item 10), not this deploy's default.
  # min-instances=0: RFC §9 item 9 leaves this genuinely open (unlike the main
  # service, the relay has no scheduler keep-alive yet) — start cold, revisit
  # after real call volume.
  # Runs as its own service account (--service-account below): relay_main.py mints an OIDC token from its
  # own Cloud Run runtime identity to call back into the main service's
  # /voice/* control plane (src/web/voice_control_plane_app.py). Main accepts
  # SERVICE_ACCOUNT_EMAIL, VOICE_RELAY_SA_EMAIL (the relay's own runtime SA, once that
  # secret exists) and the optional OIDC_TRANSITION_SA_EMAILS list. A relay under a
  # different service account therefore needs VOICE_RELAY_SA_EMAIL (or the
  # transition list) set first, or every one of those calls 401s. Until then the
  # relay runs as the same default service account as the other runtimes.
  # Three secrets: relay_main.py reads OPENAI_API_KEY, XAI_API_KEY and
  # BILLING_SLACK_WEBHOOK_URL via os.environ (see its module docstring). The provider
  # of each call comes from the user's session config, not from env
  # (VOICE_MULTI_PROVIDER_RFC §4.2). No
  # TWILIO_* secrets here; those belong to the MAIN service's own webhook/
  # telephony adapter (src/web/voice_webhook_app.py,
  # src/adapters/twilio_telephony_adapter.py), wired into the alek-bot-dev
  # step above, not this one.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "alek-voice-relay-dev"
      - "--service-account=alek-relay@$PROJECT_ID.iam.gserviceaccount.com"
      - "--image=gcr.io/$PROJECT_ID/alek-bot-dev:latest"
      - "--region=us-central1"
      - "--command=python"
      - "--args=relay_main.py"
      - "--timeout=3600"
      - "--min-instances=0"
      # max-instances=1 is required by SfuStreamHandler's ingest/egress pairing
      # (VOICE_WEB_TRANSPORT_RFC.md §5.4) — the SFU's two WebSocket legs for one
      # ticket must land on the SAME process to be paired in memory. Do not raise
      # this without redesigning that pairing (e.g. a shared store keyed by
      # ticket instead of an in-process dict).
      - "--max-instances=1"
      - "--memory=1024Mi"
      - "--cpu=2"
      - "--set-env-vars=CLOUD_RUN_SERVICE_URL=$_SERVICE_URL"
      - "--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,XAI_API_KEY=XAI_API_KEY:latest,BILLING_SLACK_WEBHOOK_URL=BILLING_SLACK_WEBHOOK_URL:latest"
      # Cloud Run's own default TCP startup probe, spelled out. Naming only the port resets
      # the window to 3x10s, and a slow relay cold start then fails the rollout
      # (2026-09-23). An HTTP probe tried for the "opening handshake failed" noise did not
      # remove it (the empty connections are not the probe), so it was dropped.
      - "--startup-probe=tcpSocket.port=8080,timeoutSeconds=240,periodSeconds=240,failureThreshold=1"
      # Twilio Media Streams connects to this WebSocket directly and cannot
      # present a Google-signed OIDC token, so — same reasoning as
      # alek-bot-dev's own --allow-unauthenticated — Cloud Run ingress must
      # stay open; there is no OIDC-fronted alternative for a carrier webhook.
      - "--allow-unauthenticated"
      - "--project=$PROJECT_ID"

  # Explicitly grant public access to the relay too — see the identical step
  # for alek-bot-dev above (--allow-unauthenticated alone is not reliable if
  # the Cloud Build SA lacks roles/iam.securityAdmin). Idempotent.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "alek-voice-relay-dev"
      - "--region=us-central1"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

  # Keep the dev container warm to avoid ~30s cold starts (min-instances=0).
  # update falls through to create on first deploy.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "scripts/infrastructure/cloudbuild_scheduler_jobs.sh"
    # The script body lives in a file (Cloud Build caps each step arg at 10 000 chars). Substitutions
    # are not applied inside files, so pass the values it reads through env.
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "SERVICE_URL=$_SERVICE_URL"

  # Untrusted-content sandbox, render family (UNTRUSTED_CONTENT_SANDBOX_RFC §4.12). After every drive step on purpose: a
  # failing sandbox step never blocks a hotfix of the bot. Each step is a no-op while _SANDBOX_RENDER_SA is empty (the
  # service identity does not exist yet), so these steps cannot break the main deploy. The script holds the logic (Cloud
  # Build caps a step arg at 10 000 characters; substitutions do not apply inside files, hence `env:`).
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["scripts/infrastructure/cloudbuild_sandbox_render.sh", "pull"]
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "SANDBOX_RENDER_SA=$_SANDBOX_RENDER_SA"
      - "SANDBOX_RENDER_URL=$_SANDBOX_RENDER_URL"
      - "SANDBOX_RENDER_CALLERS=$_SANDBOX_RENDER_CALLERS"

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["scripts/infrastructure/cloudbuild_sandbox_render.sh", "build"]
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "SANDBOX_RENDER_SA=$_SANDBOX_RENDER_SA"
      - "SANDBOX_RENDER_URL=$_SANDBOX_RENDER_URL"
      - "SANDBOX_RENDER_CALLERS=$_SANDBOX_RENDER_CALLERS"

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["scripts/infrastructure/cloudbuild_sandbox_render.sh", "push"]
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "SANDBOX_RENDER_SA=$_SANDBOX_RENDER_SA"
      - "SANDBOX_RENDER_URL=$_SANDBOX_RENDER_URL"
      - "SANDBOX_RENDER_CALLERS=$_SANDBOX_RENDER_CALLERS"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args: ["scripts/infrastructure/cloudbuild_sandbox_render.sh", "deploy"]
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "SANDBOX_RENDER_SA=$_SANDBOX_RENDER_SA"
      - "SANDBOX_RENDER_URL=$_SANDBOX_RENDER_URL"
      - "SANDBOX_RENDER_CALLERS=$_SANDBOX_RENDER_CALLERS"

# Two full image builds run serially once the sandbox identity is set; the 10-minute default would cut the second one off.
timeout: 1800s

# Build logs go to Cloud Logging only: required once a build runs as a user-specified service account
# (a later step sets `serviceAccount`); harmless for the default build identity.
# Builds run as their own least-privilege identity (IAM Step 1), never as the default compute identity.
# A user-specified build identity requires `options.logging: CLOUD_LOGGING_ONLY` (below).
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/alek-deployer@$PROJECT_ID.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY

# Defaults for substitutions a manual `gcloud builds submit` may leave out (the Makefile always passes them).
substitutions:
  _DRIVE_UPGRADE_PASS: "on"
  # Owner notes (DRIVE_FILE_NOTES_RFC §3.6): ON, as the code's default; both services get the same value.
  _DRIVE_NOTES_ENABLED: "on"
  # Transcription (RFC §27.13): OFF unless the deploy-only .env key says otherwise, so a manual `gcloud builds submit`
  # without the Makefile deploys OFF, never an empty value. The cap's empty default means the $20 monthly maximum.
  _DRIVE_TRANSCRIBE_ENABLED: "off"
  _DRIVE_TRANSCRIBE_USD_CAP: ""
  # Sandbox render service (S1). `inprocess` keeps the DOCX engine in the main process; the rest is empty until the service
  # identity and URL exist (docs/07_deployment/README.md § Sandbox render service).
  _SANDBOX_RENDER: "inprocess"
  _SANDBOX_RENDER_URL: ""
  _SANDBOX_RENDER_SA: ""
  _SANDBOX_RENDER_CALLERS: ""
