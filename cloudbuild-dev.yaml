steps:
  # Pull previous image to use as build cache (|| true so first deploy doesn't fail)
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "docker pull gcr.io/$PROJECT_ID/alek-bot-dev:latest || true"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "--cache-from", "gcr.io/$PROJECT_ID/alek-bot-dev:latest",
           "-t", "gcr.io/$PROJECT_ID/alek-bot-dev:latest", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/alek-bot-dev:latest"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "alek-bot-dev"
      - "--image=gcr.io/$PROJECT_ID/alek-bot-dev:latest"
      - "--region=us-central1"
      - "--set-env-vars=APP_ENV=development,SLACK_MODE=http,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CLOUD_RUN_SERVICE_URL=$_SERVICE_URL,FIRESTORE_DATABASE=us-production,OAUTH_REDIRECT_URI=$_OAUTH_REDIRECT_URI,ENABLE_HTML_RENDERER=true,ENABLE_GROUNDING_ATTRIBUTION=false,DEBUG_PROMPTS=true,GCS_MEDIA_BUCKET=alek-media-dev,SYSTEM_DEFAULT_LANGUAGE=uk,MCP_RESOURCE_URI=$_SERVICE_URL/mcp,TRACING_BACKEND=both,LOGFIRE_CAPTURE_CONTENT=true,BIGQUERY_PROMPT_DATASET=alek_observability_dev,CLAUDE_PERFORMANCE_MODEL=claude-sonnet-5-5,VOICE_RELAY_STREAM_URL=$_VOICE_RELAY_URL,DRIVE_INDEXER_URL=$_INDEXER_URL"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--memory=1024Mi"
      - "--cpu=2"
      - "--timeout=1800"
      - "--port=8080" # Required for HTTP mode
      - "--allow-unauthenticated" # For dev testing
      - "--set-secrets=SLACK_BOT_TOKEN=SLACK_BOT_TOKEN_DEV:latest,SLACK_SIGNING_SECRET=SLACK_SIGNING_SECRET_DEV:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,XAI_API_KEY=XAI_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,FIREBASE_WEB_API_KEY=FIREBASE_WEB_API_KEY:latest,OAUTH_SESSION_SECRET=OAUTH_SESSION_SECRET:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN_DEV:latest,TELEGRAM_WEBHOOK_SECRET=TELEGRAM_WEBHOOK_SECRET_DEV:latest,DOCS_OWNER_USER_ID=docs-owner-user-id:latest,GMAIL_OAUTH_REDIRECT_URI=GMAIL_OAUTH_REDIRECT_URI_DEV:latest,GOOGLE_TASKS_OAUTH_REDIRECT_URI=GOOGLE_TASKS_OAUTH_REDIRECT_URI_DEV:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENAI_DEEP_RESEARCH_WEBHOOK_URL=OPENAI_DEEP_RESEARCH_WEBHOOK_URL_DEV:latest,OPENAI_DEEP_RESEARCH_WEBHOOK_SECRET=OPENAI_DEEP_RESEARCH_WEBHOOK_SECRET_DEV:latest,GOOGLE_SEARCH_API_KEY=GOOGLE_SEARCH_API_KEY:latest,UNSPLASH_ACCESS_KEY=UNSPLASH_ACCESS_KEY:latest,MICROSOFT_TODO_CLIENT_ID=MICROSOFT_TODO_CLIENT_ID:latest,MICROSOFT_TODO_CLIENT_SECRET=MICROSOFT_TODO_CLIENT_SECRET:latest,MICROSOFT_TODO_REDIRECT_URI=MICROSOFT_TODO_REDIRECT_URI_DEV:latest,ONEDRIVE_REDIRECT_URI=ONEDRIVE_REDIRECT_URI_DEV:latest,MICROSOFT_TASKS_WEBHOOK_SECRET=MICROSOFT_TASKS_WEBHOOK_SECRET:latest,BILLING_SLACK_WEBHOOK_URL=BILLING_SLACK_WEBHOOK_URL:latest,SLACK_APP_TOKEN=SLACK_APP_TOKEN:latest,GOOGLE_SEARCH_CX=GOOGLE_SEARCH_CX:latest,SERVICE_ACCOUNT_EMAIL=SERVICE_ACCOUNT_EMAIL:latest,LOGFIRE_TOKEN=LOGFIRE_TOKEN:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_VERIFY_SERVICE_SID=TWILIO_VERIFY_SERVICE_SID:latest,TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest,CLOUDFLARE_SFU_APP_ID=CLOUDFLARE_SFU_APP_ID:latest,CLOUDFLARE_SFU_APP_SECRET=CLOUDFLARE_SFU_APP_SECRET:latest"

  # Explicitly grant public access — --allow-unauthenticated alone is not
  # reliable if the Cloud Build SA lacks roles/iam.securityAdmin.
  # This step is idempotent and ensures every deployment leaves the service
  # publicly accessible.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "alek-bot-dev"
      - "--region=us-central1"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

  # Drive indexing (docs/10_rfcs/USER_DRIVE_INDEXING_RFC.md §4, §12.5): the drive-sync queue and the
  # indexer service deploy AFTER alek-bot-dev, so a failing drive step (the queue's one-time IAM grant
  # missing, an indexer revision that does not start) never blocks a hotfix of the bot. Cost, on the
  # second pass of the two-pass first deploy only: the main service gets DRIVE_INDEXER_URL a minute or
  # two before the indexer does, so a nudge or tick in that window meets the first pass's 503 and is
  # retried by the queue (min-backoff 60 s); the "/worker 5xx" alert may fire once.
  #
  # Drive sync queue. Provisioned here, never by the app: GcpTaskQueue.create_queue_if_not_exists
  # would create it with max-concurrent-dispatches=5. max-concurrent-dispatches=1 is a CPU/memory
  # knob for the indexer instance, not the correctness mechanism — the per-user Firestore lease is
  # (§7.1); raising it is an extension (§14).
  # Retry: only an exception the tick did not handle answers 500 (src/web/indexer_worker_app.py);
  # every handled outcome is a 200 and the tick enqueues its own continuation, and the fan-out
  # re-ticks every user each 10 min — so a few backed-off attempts, then the fan-out takes over.
  # Log sampling 1.0: one line per task operation, a few per user per hour.
  # Prerequisite: the Cloud Build service account needs roles/cloudtasks.queueAdmin (one-time grant,
  # docs/07_deployment/SCHEDULERS.md § Start Drive Sync). Without it this step fails the build after
  # the main service is deployed; the indexer, research job, relay and scheduler steps then do not run.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud tasks queues describe drive-sync-dev \
          --location=us-central1 --project=$PROJECT_ID >/dev/null 2>&1 \
        && gcloud tasks queues update drive-sync-dev \
          --max-concurrent-dispatches=1 \
          --max-dispatches-per-second=1 \
          --max-attempts=3 \
          --min-backoff=60s \
          --max-backoff=600s \
          --max-doublings=3 \
          --log-sampling-ratio=1.0 \
          --location=us-central1 \
          --project=$PROJECT_ID \
        || gcloud tasks queues create drive-sync-dev \
          --max-concurrent-dispatches=1 \
          --max-dispatches-per-second=1 \
          --max-attempts=3 \
          --min-backoff=60s \
          --max-backoff=600s \
          --max-doublings=3 \
          --log-sampling-ratio=1.0 \
          --location=us-central1 \
          --project=$PROJECT_ID

  # Deploy Cloud Run service for the drive indexer (same image, different entry point —
  # indexer_main.py). RFC §9 "Host" and §12.5, owner decision D5: the whole drive_sync tick runs
  # here, so alek-bot-dev (1 GiB, already at 74-90 % memory) never indexes. Same deploy discipline
  # as the relay: its own env, no dual-purpose .env key.
  # --memory=2Gi + --execution-environment=gen2: the host S1 measures extraction limits on (Slice 2);
  #   those limits hold only for this pinned environment.
  # --concurrency=1: one tick per instance. --max-instances=1: the drive queue dispatches one task
  #   at a time anyway; raise both together (§14).
  # --timeout=1800: TICK_DEADLINE_S, the Cloud Tasks HTTP maximum; every drive_sync enqueue passes it
  #   as dispatch_deadline, and the tick starts no new work after 8 min (§7.1).
  # --min-instances=0: idle between ticks; a cold start costs nothing a background tick notices.
  # No --service-account override: Cloud Tasks mints each task's OIDC token for SERVICE_ACCOUNT_EMAIL
  #   (GcpTaskQueue), and /worker checks that same email — one identity, as for alek-bot-dev.
  # Four secrets, exactly what indexer_main.py reads: GEMINI_API_KEY (card embeddings),
  #   MICROSOFT_TODO_CLIENT_ID/SECRET (drive token refresh; same app registration as Step 1),
  #   SERVICE_ACCOUNT_EMAIL (the /worker gate + the identity of the tasks it enqueues).
  # DRIVE_INDEXER_URL is this service's own URL (continuations and nudge re-queues come back here, and
  #   the /worker gate pins the token audience to it). Empty on the first pass of the two-pass first
  #   deploy (Makefile, _INDEXER_URL): the service still starts and /worker answers 503.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "alek-bot-indexer-dev"
      - "--image=gcr.io/$PROJECT_ID/alek-bot-dev:latest"
      - "--region=us-central1"
      - "--command=python"
      - "--args=indexer_main.py"
      - "--execution-environment=gen2"
      - "--memory=2Gi"
      - "--cpu=1"
      - "--concurrency=1"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--timeout=1800"
      - "--set-env-vars=APP_ENV=development,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,DRIVE_INDEXER_URL=$_INDEXER_URL"
      - "--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,MICROSOFT_TODO_CLIENT_ID=MICROSOFT_TODO_CLIENT_ID:latest,MICROSOFT_TODO_CLIENT_SECRET=MICROSOFT_TODO_CLIENT_SECRET:latest,SERVICE_ACCOUNT_EMAIL=SERVICE_ACCOUNT_EMAIL:latest"
      # Plan Δ21. Ingress internal: the only caller is Cloud Tasks on drive-sync-dev, which counts as
      # internal (same project, default run.app URL). No internet request can reach the service or
      # take its single request slot (concurrency 1, max 1 instance) from a dispatch.
      # Unauthenticated at the IAM layer, OIDC checked in the app: GcpTaskQueue sets no token audience,
      # so Cloud Tasks uses the target URL ({DRIVE_INDEXER_URL}/worker) — RFC §4's "bound to the
      # indexer's /worker URL and OIDC audience" — and Cloud Run IAM documents only the service URL as
      # an accepted audience. The in-app gate (src/web/indexer_worker_app.py) checks signature, the
      # SA email and an audience pinned to this service, and fails closed on Cloud Run without
      # SERVICE_ACCOUNT_EMAIL. Manual triggers therefore go through the queue
      # (`gcloud tasks create-http-task --queue=drive-sync-dev …`), not a curl from outside.
      - "--ingress=internal"
      - "--allow-unauthenticated"
      - "--project=$PROJECT_ID"

  # Explicitly grant invoker to allUsers — see the identical step for alek-bot-dev above
  # (--allow-unauthenticated alone is not reliable if the Cloud Build SA lacks
  # roles/iam.securityAdmin). Idempotent. Ingress stays internal, and /worker stays OIDC-gated.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "alek-bot-indexer-dev"
      - "--region=us-central1"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

  # Deploy Cloud Run Job for deep research (same image, different entrypoint).
  # task-timeout: 3600s (1 hour) — covers first pass + second pass for large research.
  # max-retries: 0 — no automatic retries; the research loop has its own overload retry.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "alek-research-job-dev"
      - "--image=gcr.io/$PROJECT_ID/alek-bot-dev:latest"
      - "--region=us-central1"
      - "--command=python"
      - "--args=job_main.py"
      - "--max-retries=0"
      - "--task-timeout=18000"
      - "--memory=1024Mi"
      - "--cpu=2"
      - "--set-env-vars=APP_ENV=development,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CLOUD_RUN_SERVICE_URL=$_SERVICE_URL,DEBUG_PROMPTS=true,GCS_MEDIA_BUCKET=alek-media-dev,BIGQUERY_PROMPT_DATASET=alek_observability_dev"
      - "--set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,SERVICE_ACCOUNT_EMAIL=SERVICE_ACCOUNT_EMAIL:latest"
      - "--project=$PROJECT_ID"

  # Deploy Cloud Run service for the voice relay (same image, different
  # entrypoint — relay_main.py). RFC docs/10_rfcs/VOICE_COMPANION_RFC.md §4.14:
  # a second Cloud Run *service* (not a Job, like alek-research-job-dev above)
  # because it holds one long-lived WebSocket per phone call — hence
  # --timeout=3600 (vs. the main service's 1800s). Region us-central1 per RFC
  # §5.2 ("start us-central1 beside everything else"); a European region is an
  # unverified optimisation (§9 item 10), not this deploy's default.
  # min-instances=0: RFC §9 item 9 leaves this genuinely open (unlike the main
  # service, the relay has no scheduler keep-alive yet) — start cold, revisit
  # after real call volume.
  # No --service-account override: relay_main.py mints an OIDC token from its
  # own Cloud Run runtime identity to call back into the main service's
  # /voice/session-config and /voice/submit-transcript (src/web/
  # voice_control_plane_app.py), and main.py wires the SAME check used for
  # /worker — verify_worker_oidc(token, expected_sa_email=config.get(
  # "SERVICE_ACCOUNT_EMAIL")) (main.py:866-869) — against one shared expected
  # email. Deploying the relay under a different service account would make
  # every one of those calls 401 unless SERVICE_ACCOUNT_EMAIL were also
  # changed, which no task authorizes. So the relay deliberately runs as the
  # same (default compute) service account as alek-bot-dev and
  # alek-research-job-dev above — neither overrides --service-account either.
  # Three secrets: relay_main.py reads OPENAI_API_KEY, XAI_API_KEY and
  # BILLING_SLACK_WEBHOOK_URL via os.environ (see its module docstring). The provider
  # of each call comes from the user's session config, not from env
  # (VOICE_MULTI_PROVIDER_RFC §4.2). No
  # TWILIO_* secrets here; those belong to the MAIN service's own webhook/
  # telephony adapter (src/web/voice_webhook_app.py,
  # src/adapters/twilio_telephony_adapter.py), wired into the alek-bot-dev
  # step above, not this one.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "alek-voice-relay-dev"
      - "--image=gcr.io/$PROJECT_ID/alek-bot-dev:latest"
      - "--region=us-central1"
      - "--command=python"
      - "--args=relay_main.py"
      - "--timeout=3600"
      - "--min-instances=0"
      # max-instances=1 is required by SfuStreamHandler's ingest/egress pairing
      # (VOICE_WEB_TRANSPORT_RFC.md §5.4) — the SFU's two WebSocket legs for one
      # ticket must land on the SAME process to be paired in memory. Do not raise
      # this without redesigning that pairing (e.g. a shared store keyed by
      # ticket instead of an in-process dict).
      - "--max-instances=1"
      - "--memory=1024Mi"
      - "--cpu=2"
      - "--set-env-vars=CLOUD_RUN_SERVICE_URL=$_SERVICE_URL"
      - "--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,XAI_API_KEY=XAI_API_KEY:latest,BILLING_SLACK_WEBHOOK_URL=BILLING_SLACK_WEBHOOK_URL:latest"
      # Cloud Run's own default TCP startup probe, spelled out. Naming only the port resets
      # the window to 3x10s, and a slow relay cold start then fails the rollout
      # (2026-09-23). An HTTP probe tried for the "opening handshake failed" noise did not
      # remove it (the empty connections are not the probe), so it was dropped.
      - "--startup-probe=tcpSocket.port=8080,timeoutSeconds=240,periodSeconds=240,failureThreshold=1"
      # Twilio Media Streams connects to this WebSocket directly and cannot
      # present a Google-signed OIDC token, so — same reasoning as
      # alek-bot-dev's own --allow-unauthenticated — Cloud Run ingress must
      # stay open; there is no OIDC-fronted alternative for a carrier webhook.
      - "--allow-unauthenticated"
      - "--project=$PROJECT_ID"

  # Explicitly grant public access to the relay too — see the identical step
  # for alek-bot-dev above (--allow-unauthenticated alone is not reliable if
  # the Cloud Build SA lacks roles/iam.securityAdmin). Idempotent.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "alek-voice-relay-dev"
      - "--region=us-central1"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

  # Keep the dev container warm to avoid ~30s cold starts (min-instances=0).
  # update falls through to create on first deploy.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        # OIDC identity for /worker scheduler jobs. The /worker route verifies a
        # Google-signed token whose email == this SA (audience is not pinned —
        # see src/web/worker_oidc_verifier.py). Derive the default compute SA
        # from the project number so no infra id is hardcoded (secrets rule).
        SA="$$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')-compute@developer.gserviceaccount.com"
        gcloud scheduler jobs update http alek-bot-dev-keep-alive \
          --schedule="*/10 * * * *" \
          --uri="$_SERVICE_URL/health" \
          --http-method=GET \
          --location=us-central1 \
          --attempt-deadline=30s \
          --project=$PROJECT_ID 2>/dev/null \
        || gcloud scheduler jobs create http alek-bot-dev-keep-alive \
          --schedule="*/10 * * * *" \
          --uri="$_SERVICE_URL/health" \
          --http-method=GET \
          --location=us-central1 \
          --attempt-deadline=30s \
          --project=$PROJECT_ID

        gcloud scheduler jobs delete alek-bot-dev-renew-task-subscriptions \
          --location=us-central1 --project=$PROJECT_ID --quiet 2>/dev/null || true
        gcloud scheduler jobs create http alek-bot-dev-renew-task-subscriptions \
          --schedule="0 2 * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"renew_all_task_subscriptions"}' \
          --headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=60s \
          --project=$PROJECT_ID

        gcloud scheduler jobs describe alek-bot-dev-start-email-indexing \
          --location=us-central1 --project=$PROJECT_ID 2>/dev/null \
        && gcloud scheduler jobs update http alek-bot-dev-start-email-indexing \
          --schedule="7 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"start_email_indexing"}' \
          --update-headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=60s \
          --project=$PROJECT_ID \
        || gcloud scheduler jobs create http alek-bot-dev-start-email-indexing \
          --schedule="7 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"start_email_indexing"}' \
          --headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=60s \
          --project=$PROJECT_ID

        gcloud scheduler jobs describe alek-bot-dev-fire-due-reminders \
          --location=us-central1 --project=$PROJECT_ID 2>/dev/null \
        && gcloud scheduler jobs update http alek-bot-dev-fire-due-reminders \
          --schedule="*/5 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"fire_due_reminders"}' \
          --update-headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=60s \
          --project=$PROJECT_ID \
        || gcloud scheduler jobs create http alek-bot-dev-fire-due-reminders \
          --schedule="*/5 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"fire_due_reminders"}' \
          --headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=60s \
          --project=$PROJECT_ID

        gcloud scheduler jobs describe alek-bot-dev-billing-daily-summary \
          --location=us-central1 --project=$PROJECT_ID 2>/dev/null \
        && gcloud scheduler jobs update http alek-bot-dev-billing-daily-summary \
          --schedule="0 9 * * *" \
          --time-zone="Europe/Madrid" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"billing_daily_summary"}' \
          --update-headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=60s \
          --project=$PROJECT_ID \
        || gcloud scheduler jobs create http alek-bot-dev-billing-daily-summary \
          --schedule="0 9 * * *" \
          --time-zone="Europe/Madrid" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"billing_daily_summary"}' \
          --headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=60s \
          --project=$PROJECT_ID

        gcloud scheduler jobs describe alek-bot-dev-repair-email-embeddings \
          --location=us-central1 --project=$PROJECT_ID 2>/dev/null \
        && gcloud scheduler jobs update http alek-bot-dev-repair-email-embeddings \
          --schedule="2 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"repair_email_embeddings"}' \
          --update-headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=300s \
          --project=$PROJECT_ID \
        || gcloud scheduler jobs create http alek-bot-dev-repair-email-embeddings \
          --schedule="2 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"repair_email_embeddings"}' \
          --headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=300s \
          --project=$PROJECT_ID

        gcloud scheduler jobs describe alek-bot-dev-sweep-consolidation \
          --location=us-central1 --project=$PROJECT_ID 2>/dev/null \
        && gcloud scheduler jobs update http alek-bot-dev-sweep-consolidation \
          --schedule="17 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"sweep_consolidation"}' \
          --update-headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=60s \
          --project=$PROJECT_ID \
        || gcloud scheduler jobs create http alek-bot-dev-sweep-consolidation \
          --schedule="17 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"sweep_consolidation"}' \
          --headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=60s \
          --project=$PROJECT_ID

        gcloud scheduler jobs describe alek-bot-dev-start-daily-email-review \
          --location=us-central1 --project=$PROJECT_ID 2>/dev/null \
        && gcloud scheduler jobs update http alek-bot-dev-start-daily-email-review \
          --schedule="12 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"start_daily_email_review"}' \
          --update-headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=180s \
          --project=$PROJECT_ID \
        || gcloud scheduler jobs create http alek-bot-dev-start-daily-email-review \
          --schedule="12 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"start_daily_email_review"}' \
          --headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=180s \
          --project=$PROJECT_ID

        # Drive index fan-out (USER_DRIVE_INDEXING_RFC §7.1, §12.1): every TICK_INTERVAL the MAIN
        # service enqueues one drive_sync per user on drive-sync-dev (run by alek-bot-indexer-dev),
        # then checks staleness and the reconnect notice. 3-59/10 (:03, :13, ...) collides with no
        # other job (keep-alive */10, reminders */5, hourly jobs at :02/:07/:12/:17) and fires inside
        # each 10-minute tick_key bucket, not on its boundary. 180s: one pass may post a notice
        # through the formatter agent. Without DRIVE_INDEXER_URL it answers 200 "disabled".
        gcloud scheduler jobs describe alek-bot-dev-start-drive-sync \
          --location=us-central1 --project=$PROJECT_ID 2>/dev/null \
        && gcloud scheduler jobs update http alek-bot-dev-start-drive-sync \
          --schedule="3-59/10 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"start_drive_sync"}' \
          --update-headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=180s \
          --project=$PROJECT_ID \
        || gcloud scheduler jobs create http alek-bot-dev-start-drive-sync \
          --schedule="3-59/10 * * * *" \
          --uri="$_SERVICE_URL/worker" \
          --oidc-service-account-email="$$SA" \
          --http-method=POST \
          --message-body='{"task_type":"start_drive_sync"}' \
          --headers="Content-Type=application/json" \
          --location=us-central1 \
          --attempt-deadline=180s \
          --project=$PROJECT_ID
