name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff lint + mypy + unit/architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the change
        # A change of documentation only (docs/, root *.md, CLAUDE.md files, .github/*.md) skips `make ci` and runs
        # only the tests that read docs. scripts/ci/docs_only.py is the one place that defines "docs"; an empty or
        # unknown diff runs everything. --no-renames lists the old path of a rename. Runs before setup-python (stdlib python3).
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          FILES=""
          if [ "$EVENT" = "pull_request" ]; then
            FILES=$(git diff --no-renames --name-only "origin/$BASE_REF...HEAD" || true)
          elif [ -n "$BEFORE" ] && [ "${BEFORE#*[!0]}" != "$BEFORE" ]; then
            FILES=$(git diff --no-renames --name-only "$BEFORE" "$SHA" || true)
          fi
          echo "docs_only=$(printf '%s\n' "$FILES" | python3 scripts/ci/docs_only.py)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache ffmpeg
        # The media extractor tests run the real ffmpeg/ffprobe (they skip without them). A pinned static
        # build from the Actions cache, not apt: `apt-get update` took 31-39 min on 2026-10-22 (normally 16 s).
        id: ffmpeg-cache
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg
          key: ffmpeg-autobuild-2026-10-22-13-06-n8.1.3-gpl

      - name: Install ffmpeg
        if: steps.changes.outputs.docs_only != 'true' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        # BtbN may prune the pinned tag; then fall back to apt (and cache nothing) instead of failing every run.
        timeout-minutes: 15
        run: |
          T=autobuild-2026-10-22-13-06; A=ffmpeg-n8.1.3-23-g5c4f5744cd-linux64-gpl-8.1.tar.xz
          if ! { curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/$A" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$T/$A" \
            && echo "1aa0c5526768bf4db3e62cba954169e3e0be38327c9cbbb6c5675794df6c03df  $RUNNER_TEMP/$A" | sha256sum -c - \
            && mkdir -p ~/.cache/ffmpeg && tar -xJf "$RUNNER_TEMP/$A" -C ~/.cache/ffmpeg --strip-components=1; }; then
            echo "::warning::pinned ffmpeg build unavailable, falling back to apt"
            rm -rf ~/.cache/ffmpeg
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Put ffmpeg on PATH
        if: steps.changes.outputs.docs_only != 'true'
        run: echo "$HOME/.cache/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Doc-reading tests
        # Docs-only change: the tests that read documentation still run (scripts/ci/docs_only.py: DOC_READING_TESTS).
        if: steps.changes.outputs.docs_only == 'true'
        run: |
          echo "::notice title=docs-only::make ci skipped: only documentation changed; doc-reading tests ran"
          python -m pytest $(python scripts/ci/docs_only.py --doc-reading-tests) -q -p no:cacheprovider

      - name: make ci
        # make ci = ruff check src/ and the root entry points + mypy (domain/ports) + the unit suite once (slow tests, coverage gate)
        # + the offline G2 end to end.
        # No secrets: the unit suite mocks all I/O at the port/SDK boundary.
        # A hung test otherwise holds the job for GitHub's 6 h default.
        if: steps.changes.outputs.docs_only != 'true'
        timeout-minutes: 30
        run: |
          set -o pipefail
          make ci 2>&1 | tee ci-output.log

      - name: Failure summary as an annotation
        # Job logs are served from blob storage that a cloud session cannot reach; check-run annotations are read
        # through the API. One annotation carries the failure lines and the tail of the output.
        if: failure() && steps.changes.outputs.docs_only != 'true'
        run: |
          {
            grep -E "FAILED|ERROR|Error:|threshold|floor|Required test coverage|make(\[[0-9]+\])?: \*\*\*" ci-output.log | tail -60
            echo "----- tail -----"
            tail -40 ci-output.log
          } | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > summary.txt
          echo "::error title=make ci failed::$(cat summary.txt)"

      - name: Coverage per layer as a notice
        # The runner's per-layer table, on green runs too: the floors are calibrated on it (scripts/check_coverage_layers.py).
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: |
          awk '/^layer +statements/{f=1} f&&/^$/{exit} f' ci-output.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > layers.txt
          [ -s layers.txt ] && echo "::notice title=Coverage per layer::$(cat layers.txt)" || true

      - name: Notify Slack (pass/fail)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          # Untrusted inputs passed via env (never inlined into run: — avoids script injection).
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret not set — skipping Slack notification."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          SUMMARY=$(printf '%s' "$COMMIT_MSG" | head -1)
          TEXT="$ICON CI *$STATUS* — \`$REF\` by $ACTOR
          $SUMMARY
          $RUN_URL"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "$(jq -nc --arg t "$TEXT" '{text:$t}')" \
            "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed (delivery only — build result unaffected)"

  timing:
    # Wall-clock/CPU-time tests (`timing` marker) — off the PR gate by owner decision (2026-10-20): they fail on a
    # loaded machine with no code change. Run once per merge to main, on a fresh runner, alone and serial.
    # Separate job: its result never blocks or reruns `check`.
    name: timing tests (after merge to main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the change
        # Same rule as the `check` job (scripts/ci/docs_only.py): a docs-only push to main skips the timing run.
        # Always a push here; an all-zero `before` (new branch) or an empty diff runs everything.
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          FILES=""
          if [ -n "$BEFORE" ] && [ "${BEFORE#*[!0]}" != "$BEFORE" ]; then
            FILES=$(git diff --no-renames --name-only "$BEFORE" "$SHA" || true)
          fi
          echo "docs_only=$(printf '%s\n' "$FILES" | python3 scripts/ci/docs_only.py)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: pip install -r requirements.txt

      - name: make test-timing
        if: steps.changes.outputs.docs_only != 'true'
        run: make test-timing

      - name: Notify Slack (pass/fail)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret not set — skipping Slack notification."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then ICON="⏱✅"; else ICON="⏱❌"; fi
          TEXT="$ICON timing tests *$STATUS* — \`$REF\`
          $RUN_URL"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "$(jq -nc --arg t "$TEXT" '{text:$t}')" \
            "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed (delivery only — build result unaffected)"
