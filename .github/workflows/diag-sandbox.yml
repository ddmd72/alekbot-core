# TEMPORARY diagnostic (remove before merge): find which sandbox test hangs on Linux.
name: diag-sandbox
on:
  push:
    branches: [feat/sandbox-s1]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: sandbox tests, serial, verbose, stack dump on hang
        run: |
          timeout 600 python -m pytest -p no:xdist -v -o faulthandler_timeout=60 --asyncio-mode=auto \
            tests/unit/adapters/sandbox_engine tests/unit/adapters/sandbox_client \
            tests/unit/web/test_sandbox_app.py tests/unit/web/test_sandbox_supervisor.py \
            tests/unit/web/test_sandbox_caller_gate.py tests/unit/test_sandbox_main.py \
            tests/unit/test_cloudbuild_sandbox.py tests/unit/test_dockerfile_sandbox.py 2>&1 | tail -300
