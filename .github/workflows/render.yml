name: Render

# Post-merge real-render gate (TEST_COVERAGE_SYSTEMIC_RFC P22b). ci.yml never installs node modules or a browser, so the
# DOCX / PDF / HTML render tests skip there (tests/skip_ledger.txt, gate `never`). This workflow installs them on a plain
# GitHub-hosted runner (no custom image), runs exactly those tests and fails when one of them skips. It also builds both
# targets of Dockerfile.sandbox (loaded locally, never pushed) and runs the `docker`-marked tests against them. No secrets, no registry login, no cloud credentials, no Slack.

on:
  push:
    branches: [main]
  pull_request:
    # Only a change to this workflow or to the ledger rules that name its files runs the jobs before the merge.
    paths:
      - ".github/workflows/render.yml"
      - "tests/support/skip_ledger.py"
      - "scripts/ci/check_junit_ran.py"
      - "Dockerfile.sandbox"
      - "docx_generator/**"
      - "pdf_generator/**"
      - "src/adapters/sandbox_engine/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: real node + Puppeteer render tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Puppeteer's postinstall would download a full Chrome; the engine drives chrome-headless-shell only (installed below).
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer
      SKIP_REPORT_PATH: skip-report-render.json
      # slow-marked render tests (test_html_render_engine_real.py) run only with this switch.
      RUN_SLOW_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          # Mirrors the sandbox image's distro node: python:3.11-slim is Debian 13 (trixie), whose nodejs is 20.x.
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            docx_generator/package-lock.json
            pdf_generator/package-lock.json

      - name: npm ci (docx_generator, pdf_generator)
        run: |
          (cd docx_generator && npm ci --omit=dev)
          (cd pdf_generator && npm ci --omit=dev)

      - name: Cache chrome-headless-shell
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: .cache/puppeteer
          key: chrome-headless-shell-${{ runner.os }}-${{ hashFiles('pdf_generator/package-lock.json') }}

      - name: Install chrome-headless-shell
        # The revision the installed puppeteer expects (the lockfile pins puppeteer), as in Dockerfile.sandbox.
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: pdf_generator
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Real-render tests
        # The files whose skipif needs node / node_modules / chrome-headless-shell (the `render-job` rows of
        # tests/skip_ledger.txt; tests/unit/test_render_job_covers_ledger.py keeps both lists equal). The runner is
        # non-root, as those tests require. The `docker` tests belong to job sandbox-image.
        env:
          TESTS: >-
            tests/unit/adapters/sandbox_client/test_docx_runner_contract.py
            tests/unit/adapters/sandbox_client/test_pdf_runner_contract.py
            tests/unit/adapters/sandbox_client/test_html_renderer_contract.py
            tests/unit/adapters/sandbox_engine/test_docx_render_engine.py
            tests/unit/adapters/sandbox_engine/test_docx_render_engine_limits.py
            tests/unit/adapters/sandbox_engine/test_html_render_engine_real.py
            tests/unit/adapters/sandbox_engine/test_html_render_no_network.py
        run: |
          echo "$TESTS" > render-tests.txt
          python -m pytest -p no:cacheprovider -p tests.plugins.skip_report --asyncio-mode=auto -q -rs \
            -m "not docker" --junitxml=junit-render.xml $TESTS

      - name: Fail when a render test was skipped or a file ran nothing
        # A skipped render test is the failure this job exists to catch (a missing install must not read as green). Only
        # the in-process renderer case may skip: it needs Playwright Chromium, which widget_renderer.yml installs and runs.
        if: always()
        run: python scripts/ci/check_junit_ran.py junit-render.xml $(cat render-tests.txt) --allow-skip "Playwright Chromium"

      - name: Skip report as a step summary
        if: always()
        continue-on-error: true
        run: python scripts/ci/skip_report_summary.py skip-report-render.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the skip report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: skip-report-render
          path: |
            skip-report-render.json
            junit-render.xml
          if-no-files-found: warn

  sandbox-image:
    name: build and test Dockerfile.sandbox (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # target -> the env var the `docker`-marked tests read, and the test files that read it.
          - target: render
            image_env: SANDBOX_TEST_IMAGE
            tests: >-
              tests/unit/test_dockerfile_sandbox.py
              tests/unit/adapters/sandbox_engine/test_child_launcher.py
              tests/unit/adapters/sandbox_engine/test_docx_render_engine_limits.py
          - target: light
            image_env: SANDBOX_TEST_LIGHT_IMAGE
            tests: tests/unit/test_sandbox_light_image.py
    env:
      IMAGE_TAG: sandbox-${{ matrix.target }}:ci
      SKIP_REPORT_PATH: skip-report-image.json
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (loaded locally, never pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=sandbox-${{ matrix.target }}
          cache-to: type=gha,mode=min,scope=sandbox-${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: docker-marked tests against the built image
        # The tests start the image with `docker run` as the runner user. test_child_launcher runs its children as the
        # image's engine user (Dockerfile.sandbox: useradd sandboxengine).
        env:
          SANDBOX_IMAGE_ENV: ${{ matrix.image_env }}
          SANDBOX_TEST_USER: sandboxengine
          TESTS: ${{ matrix.tests }}
        run: |
          export "$SANDBOX_IMAGE_ENV=$IMAGE_TAG"
          python -m pytest -p no:cacheprovider -p tests.plugins.skip_report --asyncio-mode=auto -q -rs \
            -m docker --junitxml=junit-image.xml $TESTS

      - name: Fail when a docker test was skipped or a file ran nothing
        if: always()
        env:
          TESTS: ${{ matrix.tests }}
        run: python scripts/ci/check_junit_ran.py junit-image.xml $TESTS

      - name: Skip report as a step summary
        if: always()
        continue-on-error: true
        run: python scripts/ci/skip_report_summary.py skip-report-image.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the skip report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: skip-report-image-${{ matrix.target }}
          path: |
            skip-report-image.json
            junit-image.xml
          if-no-files-found: warn
