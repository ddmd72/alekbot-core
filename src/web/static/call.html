<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Call Lelik</title>
    <link rel="manifest" href="/cabinet/call/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/cabinet/call/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lelik" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ─── Tokens & Base (mirrors cabinet.html) ─────────────────────────── */
      :root {
        --bg-app: #f2f2f7;
        --bg-panel-solid: #ffffff;
        --text-main: #000000;
        --text-muted: #86868b;
        --border-light: rgba(0, 0, 0, 0.08);
        --accent: #0071e3;
        --accent-hover: #0077ed;
        --accent-danger: #ff3b30;
        --accent-danger-hover: #ff453a;
        --accent-call: #34c759;
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
        --shadow-lg:
          0 12px 32px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
        --radius-lg: 24px;
        --radius-xl: 32px;
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        --transition-fast: 0.2s cubic-bezier(0.25, 1, 0.5, 1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-app: #000000;
          --bg-panel-solid: #1c1c1e;
          --text-main: #f5f5f7;
          --text-muted: #86868b;
          --border-light: rgba(255, 255, 255, 0.12);
          --accent: #0a84ff;
          --accent-hover: #409cff;
          --accent-danger: #ff453a;
          --accent-danger-hover: #ff6961;
          --accent-call: #30d158;
          --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.6);
          --shadow-lg:
            0 12px 32px rgba(0, 0, 0, 0.8), 0 4px 12px rgba(0, 0, 0, 0.4);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background-color: var(--bg-app);
        color: var(--text-main);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: -0.01em;
        overflow-x: hidden;
      }

      body {
        min-height: 100%;
        position: relative;
      }

      .back-link {
        position: absolute;
        top: calc(12px + env(safe-area-inset-top));
        left: 16px;
        font-size: 15px;
        font-weight: 500;
        color: var(--text-muted);
        text-decoration: none;
        padding: 8px 4px;
      }
      .back-link:hover {
        color: var(--text-main);
      }

      /* One-handed layout: identity + state at the top, the call button in the bottom third
         (thumb zone), the rarely-needed mic picker folded away under it. */
      .screen {
        width: 100%;
        max-width: 420px;
        min-height: 100dvh;
        margin: 0 auto;
        padding: calc(64px + env(safe-area-inset-top)) 24px
          calc(24px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .identity {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .avatar {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: var(--shadow-lg);
      }
      /* Mode pages show a square app icon: rounded like an iOS Home Screen icon, not cut into a circle. */
      .avatar.app-icon {
        border-radius: 22.5%;
      }
      .avatar.live {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.45); }
        50% { box-shadow: 0 0 0 14px rgba(52, 199, 89, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .avatar.live { animation: none; }
      }

      h1 {
        font-size: 28px;
        font-weight: 600;
      }

      #state {
        font-size: 17px;
        font-weight: 500;
        color: var(--text-muted);
        min-height: 24px;
      }

      #timer {
        font-size: 17px;
        font-variant-numeric: tabular-nums;
        color: var(--text-muted);
        min-height: 24px;
      }

      .controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 32px 0 8px;
      }

      .call-btn {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: none;
        color: #fff;
        background: var(--accent-call);
        box-shadow: var(--shadow-lg);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition-fast);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .call-btn svg {
        width: 48px;
        height: 48px;
        transition: transform var(--transition-fast);
      }
      .call-btn:hover:not(:disabled) {
        filter: brightness(1.08);
      }
      .call-btn:active:not(:disabled) {
        transform: scale(0.94);
      }
      .call-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .call-btn.danger {
        background: var(--accent-danger);
      }
      .call-btn.danger svg {
        transform: rotate(135deg);
      }

      .mode-label {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-muted);
      }

      #call-label {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
      }

      /* "Ask Lelik": created by script on the interpreter page only, so /cabinet/call is unchanged. */
      .ask-btn {
        width: 280px;
        max-width: 100%;
        min-height: 72px;
        margin-top: 20px;
        padding: 14px 24px;
        border-radius: 36px;
        border: 2px solid var(--accent);
        background: var(--bg-panel-solid);
        color: var(--accent);
        font-family: var(--font-sans);
        font-size: 20px;
        font-weight: 700;
        box-shadow: var(--shadow-md);
        cursor: pointer;
        transition: var(--transition-fast);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .ask-btn[hidden] {
        display: none;
      }
      .ask-btn:active:not(:disabled) {
        transform: scale(0.97);
      }
      .ask-btn.armed {
        background: var(--accent);
        color: #fff;
        box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.3);
        font-size: 17px;
      }
      .ask-btn.busy {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-size: 17px;
        cursor: default;
        animation: ask-busy 1.4s ease-in-out infinite;
      }
      .ask-btn:disabled:not(.busy) {
        opacity: 0.45;
        cursor: default;
      }
      @keyframes ask-busy {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ask-btn.busy { animation: none; }
      }

      /* "Share my location": created by script on every call page that gets a control channel; shown only when the call offers `geo`. */
      .geo-btn {
        width: 280px;
        max-width: 100%;
        min-height: 48px;
        margin-top: 12px;
        padding: 10px 20px;
        border-radius: 24px;
        border: 2px solid var(--accent);
        background: var(--bg-panel-solid);
        color: var(--accent);
        font-family: var(--font-sans);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-fast);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .geo-btn[hidden],
      .geo-status[hidden] {
        display: none;
      }
      .geo-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .geo-status {
        max-width: 280px;
        margin-top: 8px;
        font-size: 14px;
        color: var(--text-main);
        text-align: center;
        overflow-wrap: anywhere;
      }

      /* Interpreter page only: the script wraps the call button into [left slot] [call] [right slot]. */
      .call-row {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 12px;
        width: 100%;
      }
      .call-mid {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .call-slot {
        flex: none;
        width: 88px;
        margin-top: 28px; /* centres a 64 px control on the 120 px call button */
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .call-slot:empty {
        visibility: hidden;
      }
      .speaker-ctl {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .speaker-ctl.off {
        visibility: hidden;
      }
      .speaker-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 1px solid var(--border-light);
        background: var(--bg-panel-solid);
        color: var(--text-main);
        box-shadow: var(--shadow-md);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition-fast);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .speaker-btn svg {
        width: 28px;
        height: 28px;
      }
      .speaker-btn:active {
        transform: scale(0.94);
      }
      .speaker-btn.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .speaker-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        text-align: center;
      }
      .speaker-ctl.on .speaker-label {
        color: var(--text-main);
      }
      @media (prefers-reduced-motion: reduce) {
        .speaker-btn { transition: none; }
        .speaker-btn:active { transform: none; }
      }

      .mic-settings {
        width: 100%;
        margin-top: 16px;
        text-align: left;
      }
      .mic-settings summary {
        list-style: none;
        cursor: pointer;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
        padding: 8px;
      }
      .mic-settings summary::-webkit-details-marker {
        display: none;
      }
      .mic-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 8px;
      }
      .mic-row select {
        width: 100%;
        padding: 10px 12px;
        font-size: 16px; /* >=16px: iOS zooms the page into smaller form controls */
        font-family: var(--font-sans);
        color: var(--text-main);
        background: var(--bg-panel-solid);
        border: 1px solid var(--border-light);
        border-radius: 12px;
      }
      .mic-row select:disabled {
        opacity: 0.6;
      }
      .mic-row .hint {
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.4;
      }

      /* ── Live text panel (VOICE_CALL_LIVE_TEXT_RFC §4.8): classes only the live-text script creates; nothing here
         moves, so reduced motion holds by construction. ── */
      .screen.text-live {
        height: 100dvh;
        min-height: 0;
      }
      .screen.text-live .identity {
        flex: none;
        width: 100%;
        display: grid;
        grid-template-columns: 48px auto 1fr;
        column-gap: 12px;
        row-gap: 0;
        align-items: center;
        justify-items: start;
        text-align: left;
      }
      .screen.text-live .avatar {
        grid-column: 1;
        grid-row: 1 / 3;
        width: 48px;
        height: 48px;
      }
      .screen.text-live h1 {
        grid-column: 2 / 4;
        grid-row: 1;
        font-size: 20px;
      }
      .screen.text-live #state {
        grid-column: 2;
        grid-row: 2;
        min-height: 0;
      }
      .screen.text-live #timer {
        grid-column: 3;
        grid-row: 2;
        min-height: 0;
      }
      .screen.text-live .controls {
        padding-top: 12px;
      }
      .text-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        width: 100%;
        display: flex;
        margin-top: 12px;
      }
      .text-panel {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        text-align: left;
        font-size: 17px;
        font-family: var(--font-sans);
        color: var(--text-main);
      }
      @supports (font: -apple-system-body) {
        .text-panel {
          font: -apple-system-body;
          font-family: var(--font-sans);
        }
      }
      .text-hint {
        font-size: 0.765em;
        color: var(--text-muted);
        margin: 0 0 12px;
      }
      .text-line {
        margin: 0 0 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .text-line.lelik {
        font-size: 1.1765em;
        line-height: 1.4;
        color: var(--text-main);
      }
      .text-line.caller {
        font-size: 1em;
        color: var(--text-muted);
      }
      .text-label {
        display: block;
        font-size: 0.765em;
        font-weight: 600;
        color: var(--text-muted);
      }
      .text-block {
        margin: 0 0 12px;
        padding: 12px 14px 2px;
        background: var(--bg-panel-solid);
        border: 1px solid var(--border-light);
        border-radius: 16px;
      }
      .text-block > .text-label {
        color: var(--accent);
      }
      .text-block .text-line.lelik {
        font-size: 1em;
      }
      .text-block .text-line.caller {
        font-size: 0.882em;
      }
      .text-pill {
        position: absolute;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        padding: 8px 16px;
        font-family: var(--font-sans);
        font-size: 14px;
        font-weight: 600;
        color: var(--accent);
        background: var(--bg-panel-solid);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        box-shadow: var(--shadow-md);
        cursor: pointer;
      }
      .text-pill[hidden] {
        display: none;
      }

      /* ── Show view (VOICE_CALL_LIVE_TEXT_RFC §4.8): the interpreter's card for the person across the table.
         Same look as the speaker control under its own class names; nothing here moves. ── */
      .show-ctl {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .show-ctl.off {
        visibility: hidden;
      }
      .show-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 1px solid var(--border-light);
        background: var(--bg-panel-solid);
        color: var(--text-main);
        box-shadow: var(--shadow-md);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .show-btn svg {
        width: 28px;
        height: 28px;
      }
      .show-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        text-align: center;
      }
      .show-view {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        background: var(--bg-panel-solid);
        color: var(--text-main);
        font-family: var(--font-sans);
      }
      .show-view[hidden] {
        display: none;
      }
      .show-card {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        text-align: left;
        font-size: 17px;
        font-family: var(--font-sans);
      }
      @supports (font: -apple-system-body) {
        .show-card {
          font: -apple-system-body;
          font-family: var(--font-sans);
        }
      }
      .show-card.flipped {
        transform: rotate(180deg);
      }
      .show-source {
        font-size: 1em;
        line-height: 1.4;
        color: var(--text-muted);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .show-translation {
        font-size: 2em;
        font-weight: 600;
        line-height: 1.25;
        color: var(--text-main);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .show-bar {
        flex: none;
        display: flex;
        gap: 12px;
        padding-top: 16px;
      }
      .show-back,
      .show-flip {
        flex: 1;
        min-height: 48px;
        padding: 0 16px;
        font-family: var(--font-sans);
        font-size: 17px;
        font-weight: 600;
        color: var(--text-main);
        background: var(--bg-panel-solid);
        border: 1px solid var(--border-light);
        border-radius: 14px;
        cursor: pointer;
      }
      /* ── Save as file (VOICE_CALL_LIVE_TEXT_RFC §4.11): the after-call buttons under the text panel. ── */
      .save-row {
        flex: none;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
        font-family: var(--font-sans);
      }
      .save-result {
        flex-basis: 100%;
        margin: 0;
        font-size: 13px;
        color: var(--text-muted);
        text-align: center;
        overflow-wrap: anywhere;
      }
      .save-result:empty {
        display: none;
      }
      .save-btn:disabled {
        color: var(--text-muted);
      }
      .save-btn {
        min-height: 44px;
        padding: 8px 16px;
        font-family: var(--font-sans);
        font-size: 14px;
        font-weight: 600;
        color: var(--accent);
        background: var(--bg-panel-solid);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        box-shadow: var(--shadow-md);
        touch-action: manipulation;
        cursor: pointer;
      }
      .save-btn.saved {
        color: var(--text-muted);
      }
      .save-spin {
        display: inline-block;
        width: 0.9em;
        height: 0.9em;
        margin-inline-start: 8px;
        vertical-align: -0.1em;
        border: 2px solid var(--border-light);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: save-spin 0.8s linear infinite;
      }
      @keyframes save-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .save-spin {
          animation: none;
        }
      }
      /* The result sheet: modal like the Show view (no outside-tap dismissal), a card centred over a dimmed page. */
      .save-sheet {
        position: fixed;
        inset: 0;
        z-index: 110;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        background: var(--border-light);
        background: color-mix(in srgb, var(--text-main) 45%, transparent);
        font-family: var(--font-sans);
        font-size: 17px;
      }
      @supports (font: -apple-system-body) {
        .save-sheet {
          font: -apple-system-body;
          font-family: var(--font-sans);
        }
      }
      .save-sheet[hidden] {
        display: none;
      }
      .save-sheet-card {
        width: 100%;
        max-width: 420px;
        max-height: 100%;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 24px 20px 20px;
        color: var(--text-main);
        background: var(--bg-panel-solid);
        border: 1px solid var(--border-light);
        border-radius: 20px;
        box-shadow: var(--shadow-md);
        text-align: center;
      }
      .save-sheet-mark {
        font-size: 2em;
        line-height: 1;
        color: var(--accent);
      }
      .save-sheet-mark:empty {
        display: none;
      }
      .save-sheet-text {
        margin: 0;
        font-size: 1em;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .save-sheet-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .save-sheet-btn {
        flex: 1 1 120px;
        min-height: 48px;
        padding: 0 16px;
        font-family: var(--font-sans);
        font-size: 1em;
        font-weight: 600;
        color: var(--text-main);
        background: var(--bg-panel-solid);
        border: 1px solid var(--border-light);
        border-radius: 14px;
        touch-action: manipulation;
        cursor: pointer;
      }
      .save-sheet-btn.primary {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <a class="back-link" href="/cabinet" id="back-link">← Cabinet</a>

    <main class="screen">
      <div class="identity">
        <img class="avatar" id="avatar" src="/cabinet/call/icon-192.png" alt="" />
        <h1 id="title">Lelik</h1>
        <div id="state">Ready to call</div>
        <div id="timer"></div>
      </div>

      <div class="controls">
        <button id="call-btn" class="call-btn" aria-labelledby="call-label">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path

      /* ── UI language ─────────────────────────────────── */
      // The page language is the owner's UI language from his settings (the language the server uses for the call
      // file's drive folder and summary), fetched from a gated route because this page is public static HTML. Until
      // that answers: the last server language stored here, then the phone's, then English. The first render never
      // waits for the fetch; a different answer re-renders the visible texts through applyLanguage.
      const LANG_STORAGE_KEY = "voice_ui_language";
      const UI_LANG_URL = "/api/voice/ui-language";

      function hasLanguage(code) {
        return typeof code === "string" && Object.prototype.hasOwnProperty.call(LANG_DICT, code);
      }

      function storedLanguage() {
        try {
          const code = localStorage.getItem(LANG_STORAGE_KEY);
          return hasLanguage(code) ? code : null;
        } catch (e) {
          return null; // storage unavailable: no stored language
        }
      }

      function storeLanguage(code) {
        try {
          localStorage.setItem(LANG_STORAGE_KEY, code);
        } catch (e) {
          // storage unavailable: the next load starts from the phone language until the fetch answers
        }
      }

      function phoneLanguage() {
        const code = (navigator.language || "en").slice(0, 2).toLowerCase();
        return hasLanguage(code) ? code : null;
      }

      let _currentLang = storedLanguage() || phoneLanguage() || "en";

      function t(key) {
        return (LANG_DICT[_currentLang] || LANG_DICT.en)[key] || key;
      }

      async function syncServerLanguage() {
        try {
          const resp = await authFetch(UI_LANG_URL, { credentials: "same-origin" });
          if (!resp.ok) return; // no answer: keep the fallback
          const body = await resp.json();
          const code = body && typeof body.language === "string" ? body.language.toLowerCase() : "";
          if (!hasLanguage(code)) return; // a language this page does not have: keep the fallback
          storeLanguage(code);
          if (code === _currentLang) return;
          const previous = _currentLang;
          _currentLang = code;
          applyLanguage(previous);
        } catch (e) {
          // offline or a bad body: keep the fallback
        }
      }

      // Set by the server only on a mode page (interpreter / tutor); absent on /cabinet/call.
      function renderModeLabel() {
        if (!window.VOICE_MODE) return;
        let el = document.getElementById("mode-label");
        if (!el) {
          el = document.createElement("div");
          el.id = "mode-label";
          el.className = "mode-label";
          document.querySelector(".controls").prepend(el);
        }
        el.textContent = t(`mode.${window.VOICE_MODE}`);
      }

      function applyTranslations() {
        renderModeLabel();
        document.title = t("app.title");
        document.getElementById("back-link").textContent = t("back.cabinet");
        document.getElementById("mic-summary").textContent = `⚙ ${t("mic.label")}`;
        document.getElementById("mic-hint").textContent = t("mic.hint");
        renderGeo();
      }

      /* ── Call state ──────────────────────────────────── */
      const $ = (id) => document.getElementById(id);
      const stateEl = $("state");
      const btn = $("call-btn");
      const callLabel = $("call-label");
      const timerEl = $("timer");
      const avatar = $("avatar");
      const remoteAudio = $("remote-audio");
      const micSelect = $("mic-select");

      let pc = null;
      let localStream = null;
      let wakeLock = null;
      let callId = null;
      let statusTimer = null;
      let inCall = false;
      // Bumped on every startCall() and on every manual hang up. A startCall() invocation
      // captures its own token; if a manual "Hang up" click (or a new call) supersedes it
      // before its promise chain settles, its catch block sees a stale token and no-ops
      // instead of overwriting the state/button the newer action already set.
      let callToken = 0;

      function setState(text) {
        stateEl.textContent = text;
      }

      function renderButton(mode) {
        // mode: "idle" | "connecting" | "live" — while connecting the button stays enabled
        // and reads "Hang up", so a stuck connection attempt is never a dead end.
        if (mode === "idle") {
          callLabel.textContent = t("button.call");
          btn.disabled = false;
          btn.classList.remove("danger");
        } else {
          callLabel.textContent = t("button.hangup");
          btn.disabled = false;
          btn.classList.add("danger");
        }
        avatar.classList.toggle("live", mode === "live");
        if (mode === "live") startTimer();
        else stopTimer();
        // The mic choice only takes effect at the getUserMedia() call that starts a call —
        // switching it mid-call has no effect, so lock it while connecting/live.
        micSelect.disabled = mode !== "idle";
      }

      /* ── Call timer ─────────────────────────────────── */
      let timerInterval = null;

      function startTimer() {
        if (timerInterval) return;
        const startedAt = Date.now();
        callLiveAt = startedAt;
        const tick = () => {
          const total = Math.floor((Date.now() - startedAt) / 1000);
          const m = Math.floor(total / 60);
          const sec = String(total % 60).padStart(2, "0");
          timerEl.textContent = `${m}:${sec}`;
        };
        tick();
        timerInterval = setInterval(tick, 1000);
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        timerEl.textContent = "";
      }

      /* ── Session ─────────────────────────────────────── */
      // authFetch refreshes the session silently on a 401 and goes to login only when the refresh fails;
      // ensureSession (session.js) runs on load and whenever the page becomes visible again.

      /* ── Microphone choice ───────────────────────────── */
      // Persisted so the caller's pick survives a reload. Every localStorage access is
      // wrapped — private-mode/disabled storage must degrade to "no saved choice", never throw.
      const MIC_STORAGE_KEY = "alek_call_mic_device_id";

      function loadSavedMic() {
        try {
          return localStorage.getItem(MIC_STORAGE_KEY) || "";
        } catch (e) {
          return "";
        }
      }

      function saveMic(deviceId) {
        try {
          if (deviceId) localStorage.setItem(MIC_STORAGE_KEY, deviceId);
          else localStorage.removeItem(MIC_STORAGE_KEY);
        } catch (e) {
          // Storage unavailable — the choice just won't persist across reloads.
        }
      }

      async function refreshMicList() {
        if (!navigator.mediaDevices?.enumerateDevices) return;
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const mics = devices.filter((d) => d.kind === "audioinput");
          const saved = loadSavedMic();
          const previousValue = micSelect.value;
          micSelect.innerHTML = "";
          const defaultOpt = document.createElement("option");
          defaultOpt.value = "";
          defaultOpt.textContent = t("mic.default");
          micSelect.appendChild(defaultOpt);
          mics.forEach((d, i) => {
            const opt = document.createElement("option");
            opt.value = d.deviceId;
            // Labels are empty strings until the user has granted mic permission at least
            // once — fall back to a numbered placeholder so the list is still usable.
            opt.textContent = d.label || `${t("mic.unnamed")} ${i + 1}`;
            micSelect.appendChild(opt);
          });
          const stillPresent = [saved, previousValue].find(
            (v) => v && mics.some((d) => d.deviceId === v),
          );
          micSelect.value = stillPresent || "";
        } catch (e) {
          // enumerateDevices failing is non-fatal — the call still works on the default mic.
        }
      }

      micSelect.addEventListener("change", () => {
        saveMic(micSelect.value);
      });
      if (navigator.mediaDevices?.addEventListener) {
        navigator.mediaDevices.addEventListener("devicechange", refreshMicList);
      }

      /* ── Ringback ─────────────────────────────────────── */
      // Ringback: 425 Hz (the common European tone), 1.5 s on / 3.0 s off. Plays from Call tap until the first
      // audible sound from Lelik (not until the WebRTC connection — the relay sends digital
      // silence frames before he actually speaks), or hang-up/error/ended/pagehide. Capped to
      // at most RINGBACK_LIVE_CAP_MS past "Live" regardless — it must never ring indefinitely.
      const RINGBACK_FREQ_HZ = 425;
      const RINGBACK_ON_S = 1.5;
      const RINGBACK_OFF_S = 3.0;
      const RINGBACK_GAIN = 0.15;
      const RINGBACK_CYCLE_MS = (RINGBACK_ON_S + RINGBACK_OFF_S) * 1000;
      const AUDIBLE_RMS_THRESHOLD = 0.02;
      const AUDIBLE_SUSTAIN_MS = 150;
      const AUDIBLE_POLL_MS = 50;
      // Lelik's first audio leaves the relay about a second after Live (live log, 2026-10-29);
      // the cap is the guarantee when neither detector hears him. Was 8 s: rang over his reply.
      const RINGBACK_LIVE_CAP_MS = 2500;

      // One AudioContext for the page's lifetime (iOS requires it to be created — or, if
      // already created, resumed — synchronously inside a user-gesture handler; a call page
      // reuses the same context across calls rather than creating a new one each time).
      // Used ONLY for the ringback tone and for tapping the remote track to detect Lelik's
      // first sound — never for playback. The <audio id="remote-audio"> element is the sole
      // playback path for Lelik's voice, so a suspended/interrupted AudioContext (iOS screen
      // lock, a Siri/phone interruption) can never make the call go silent, and the browser's
      // own echo cancellation — which covers normal <audio>/<video> element output but not
      // audio routed through Web Audio — keeps covering it.
      let audioCtx = null;
      let ringOsc = null;
      let ringGain = null;
      let ringLoopTimer = null;
      let ringActive = false;
      let audibleMonitorTimer = null;
      let audibleAboveSince = null;

      // iOS routes WebAudio through the ringer-switch-muted "ambient" session until mic capture
      // starts, so ringback is silent on a phone in silent mode. Declaring play-and-record up
      // front (Safari 17+ Audio Session API) makes it audible; "auto" restores the default.
      function setAudioSessionType(type) {
        try {
          if (navigator.audioSession) navigator.audioSession.type = type;
        } catch (e) {}
      }

      function ensureAudioContext() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          if (!audioCtx) {
            audioCtx = new Ctx();
          } else if (audioCtx.state === "suspended" || audioCtx.state === "interrupted") {
            // "interrupted" is Safari/iOS-specific (e.g. a phone call or Siri took the audio
            // session) — resume covers both that and a plain browser-initiated suspend.
            audioCtx.resume().catch(() => {});
          }
          return audioCtx;
        } catch (e) {
          return null;
        }
      }

      function scheduleRingCycle() {
        if (!audioCtx || !ringGain) return;
        const now = audioCtx.currentTime;
        ringGain.gain.cancelScheduledValues(now);
        ringGain.gain.setValueAtTime(RINGBACK_GAIN, now);
        ringGain.gain.setValueAtTime(0, now + RINGBACK_ON_S);
      }

      function buildRemoteAnalyser(track) {
        // A fresh tap per call, built from a fresh MediaStream wrapping the just-arrived
        // track — connected ONLY to the analyser, never to ctx.destination. This is purely a
        // measurement tap: Lelik's actual playback goes through remoteAudio.srcObject
        // (the <audio> element), completely independent of this graph and of audioCtx's state.
        if (!audioCtx) return null;
        try {
          const source = audioCtx.createMediaStreamSource(new MediaStream([track]));
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 512;
          source.connect(analyser);
          return analyser;
        } catch (e) {
          // Analysis unavailable — the receiver's own audio level still detects Lelik.
          return null;
        }
      }

      // Playback report (observation only): small snapshots of the remote audio's state, POSTed fire-and-forget so
      // the server log shows where playback dies. Nothing here touches playback or the call flow.
      let playingEvents = 0;
      let trackArrivedAt = 0;
      let firstPlayingMs = -1;
      let reportTrack = null;
      remoteAudio.addEventListener("playing", () => {
        try {
          playingEvents++;
          if (firstPlayingMs < 0 && trackArrivedAt) firstPlayingMs = Math.round(performance.now() - trackArrivedAt);
        } catch (e) {
          // observation only
        }
      });

      async function sendClientReport(stage, token, extra = {}) {
        try {
          if (token !== callToken || !callId) return;
          const reportCallId = callId;
          const d = {};
          const put = (k, fn) => {
            try {
              const v = fn();
              if (v !== undefined && v !== null) d[k] = v;
            } catch (e) {
              // missing API — key omitted
            }
          };
          put("el_paused", () => remoteAudio.paused);
          put("el_ready_state", () => remoteAudio.readyState);
          put("el_current_time", () => remoteAudio.currentTime);
          put("el_muted", () => remoteAudio.muted);
          put("el_volume", () => remoteAudio.volume);
          put("el_has_src", () => remoteAudio.srcObject !== null);
          put("el_error", () => (remoteAudio.error ? remoteAudio.error.code : 0));
          put("el_playing_events", () => playingEvents);
          put("el_first_playing_ms", () => firstPlayingMs);
          const track = reportTrack;
          put("tr_ready_state", () => track.readyState);
          put("tr_muted", () => track.muted);
          put("tr_enabled", () => track.enabled);
          put("pc_state", () => pc.connectionState);
          put("ice_state", () => pc.iceConnectionState);
          put("ctx_state", () => (audioCtx ? audioCtx.state : "none"));
          put("session_type", () => (navigator.audioSession ? navigator.audioSession.type : "none"));
          // the `route` stage's own fields (the speaker switch)
          put("route", () => extra.route);
          put("ok", () => extra.ok);
          put("err", () => extra.err);
          put("outs", () => extra.outs);
          try {
            const receiver = pc.getReceivers().find((r) => r.track && r.track.kind === "audio");
            const stats = await receiver.getStats();
            stats.forEach((s) => {
              if (s.type !== "inbound-rtp" || s.kind === "video") return;
              const take = (k, v) => {
                if (typeof v === "number") d[k] = v;
              };
              take("rx_packets", s.packetsReceived);
              take("rx_bytes", s.bytesReceived);
              take("rx_audio_level", s.audioLevel);
              take("rx_samples", s.totalSamplesReceived);
              take("rx_concealed", s.concealedSamples);
            });
          } catch (e) {
            // no stats — the rx keys are omitted
          }
          authFetch(`/api/voice/web-call/${reportCallId}/client-report`, {
            method: "POST",
            credentials: "same-origin",
            keepalive: true,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ stage, data: d }),
          }).catch(() => {});
        } catch (e) {
          // never throws
        }
      }

      function inboundAudioLevel(report) {
        // The receiver's decoded audio level (0..1, linear, like the analyser's RMS), computed by
        // the WebRTC stack itself — no Web Audio involved.
        let level = 0;
        report.forEach((s) => {
          if (s.type === "inbound-rtp" && typeof s.audioLevel === "number") level = Math.max(level, s.audioLevel);
        });
        return level;
      }

      function stopAudibleMonitor() {
        if (audibleMonitorTimer) {
          clearInterval(audibleMonitorTimer);
          audibleMonitorTimer = null;
        }
        audibleAboveSince = null;
      }

      function startAudibleMonitor(track, receiver) {
        if (!ringActive) return; // ringback already stopped — nothing to watch for anymore
        if (audibleMonitorTimer) return; // already watching
        // Two independent signals; the louder one counts: the Web Audio tap on the track and the
        // receiver's own audio level from getStats(). The tap alone stopped hearing Lelik on live
        // calls (2026-10-29: one or two rings over his first reply, until the cap below).
        const analyser = buildRemoteAnalyser(track);
        const canStat = !!(receiver && receiver.getStats);
        if (!analyser && !canStat) return;
        const data = analyser ? new Float32Array(analyser.fftSize) : null;
        let statsLevel = 0;
        let statsBusy = false;
        audibleMonitorTimer = setInterval(() => {
          let level = statsLevel;
          if (analyser) {
            analyser.getFloatTimeDomainData(data);
            let sumSquares = 0;
            for (let i = 0; i < data.length; i++) sumSquares += data[i] * data[i];
            level = Math.max(level, Math.sqrt(sumSquares / data.length));
          }
          if (canStat && !statsBusy) {
            // Read on this poll, used on the next: one getStats() in flight at a time.
            statsBusy = true;
            receiver
              .getStats()
              .then((report) => {
                statsLevel = inboundAudioLevel(report);
              })
              .catch(() => {})
              .finally(() => {
                statsBusy = false;
              });
          }
          const now = performance.now();
          if (level > AUDIBLE_RMS_THRESHOLD) {
            if (audibleAboveSince === null) audibleAboveSince = now;
            if (now - audibleAboveSince >= AUDIBLE_SUSTAIN_MS) {
              stopRingback();
            }
          } else {
            audibleAboveSince = null;
          }
        }, AUDIBLE_POLL_MS);
      }

      function startRingback() {
        const ctx = ensureAudioContext();
        if (!ctx) return;
        try {
          ringGain = ctx.createGain();
          ringGain.gain.value = 0;
          ringGain.connect(ctx.destination);
          ringOsc = ctx.createOscillator();
          ringOsc.frequency.value = RINGBACK_FREQ_HZ;
          ringOsc.connect(ringGain);
          ringOsc.start();
          ringActive = true;
          scheduleRingCycle();
          ringLoopTimer = setInterval(scheduleRingCycle, RINGBACK_CYCLE_MS);
          // Audible-detection monitoring itself starts later, once pc.ontrack hands us the
          // actual remote track to tap.
        } catch (e) {
          ringActive = false;
          // WebAudio unavailable/blocked — the call proceeds without a ringback tone.
        }
      }

      function stopRingback() {
        // Idempotent and safe to call from multiple sites (audible detection, Live-time
        // fallback/cap, hangup, error, ended, pagehide) — never restarted once stopped for the
        // rest of this call. Only the oscillator/gain and the poll timer are torn down;
        // audioCtx is untouched here (endCall() owns suspending it) and Lelik's playback was
        // never routed through it in the first place.
        if (!ringActive) return;
        ringActive = false;
        if (ringLoopTimer) {
          clearInterval(ringLoopTimer);
          ringLoopTimer = null;
        }
        stopAudibleMonitor();
        if (ringOsc) {
          try {
            ringOsc.stop();
          } catch (e) {}
          try {
            ringOsc.disconnect();
          } catch (e) {}
          ringOsc = null;
        }
        if (ringGain) {
          try {
            ringGain.disconnect();
          } catch (e) {}
          ringGain = null;
        }
      }

      async function requestWakeLock() {
        try {
          wakeLock = await navigator.wakeLock?.request("screen");
        } catch (e) {
          // Not fatal — the call still works without it.
        }
      }

      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "visible" && pc) {
          await requestWakeLock();
        }
      });

      function waitForConnected(peer) {
        // No timeout here would mean a stalled ICE handshake leaves the page stuck on
        // "Connecting…" indefinitely — 15s is generous for a real handshake and short enough
        // that the caller isn't left waiting on a call that is never going to complete.
        const CONNECT_TIMEOUT_MS = 15000;
        return new Promise((resolve, reject) => {
          const deadline = performance.now() + CONNECT_TIMEOUT_MS;
          const check = () => {
            if (peer.connectionState === "connected") resolve();
            else if (peer.connectionState === "failed" || peer.connectionState === "closed") {
              reject(new Error(`pc ${peer.connectionState}`));
            } else if (performance.now() > deadline) {
              reject(new Error("connection timed out"));
            } else {
              setTimeout(check, 50);
            }
          };
          check();
        });
      }

      // Control channel to the relay (VOICE_CALL_CONTROL_CHANNEL_RFC §4): a websocket to the
      // relay process that runs the call, opened on every page whenever /connect hands out
      // `control` (the VOICE_CONTROL_CHANNEL knob). The token goes in the first frame, never in
      // the URL. No UI here: a feature ("Ask Lelik" below) registers with onControl() and hears
      // every frame, and null when the socket is down; it sends with sendControl(). The call
      // itself never depends on this socket.
      const CONTROL_PING_MS = 20000;
      const CONTROL_BACKOFF_MS = [1000, 2000, 4000, 8000, 10000];
      let control = null;
      const controlListeners = [];

      function onControl(listener) {
        controlListeners.push(listener);
      }

      function notifyControl(msg) {
        controlListeners.forEach((listener) => {
          try {
            listener(msg);
          } catch (e) {}
        });
      }

      function sendControl(frame) {
        const ws = control && control.ws;
        if (!ws || ws.readyState !== WebSocket.OPEN) return false;
        ws.send(JSON.stringify(frame));
        return true;
      }

      function openControl(handout, owner) {
        closeControl();
        if (!handout || typeof handout.url !== "string" || typeof handout.token !== "string") return;
        control = { url: handout.url, token: handout.token, owner, ws: null, ping: null, retry: null,
                    attempt: 0, done: false, features: [],
                    welcomed: false, listening: false, listenSent: false };
        dialControl(control);
      }

      // `listening` (RFC §4.2): the relay holds the call's greeting until the page hears Lelik's
      // track, or a few seconds at most. Sent once per call, as soon as both hold: /renegotiate is
      // done (controlListening) and the socket is welcomed; a reconnect never sends it again.
      function controlListening(owner) {
        const ch = control;
        if (!ch || ch.owner !== owner) return;
        ch.listening = true;
        sendListening(ch);
      }

      function sendListening(ch) {
        if (ch !== control || !ch.listening || !ch.welcomed || ch.listenSent) return;
        if (sendControl({ type: "listening" })) ch.listenSent = true;
      }

      function dialControl(ch) {
        if (ch !== control || ch.done || ch.owner !== callToken) return;
        let ws;
        try {
          ws = new WebSocket(ch.url);
        } catch (e) {
          retryControl(ch);
          return;
        }
        ch.ws = ws;
        ws.onopen = () => {
          ws.send(JSON.stringify({ type: "hello", v: 1, token: ch.token }));
        };
        ws.onmessage = (ev) => {
          if (ws !== ch.ws) return;
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            return;
          }
          if (!msg || typeof msg !== "object") return;
          if (msg.type === "welcome") {
            ch.attempt = 0;
            ch.features = Array.isArray(msg.features) ? msg.features : [];
            clearInterval(ch.ping);
            ch.ping = setInterval(() => {
              if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" }));
            }, CONTROL_PING_MS);
            ch.welcomed = true;
            sendListening(ch);
          } else if (msg.type === "bye") {
            // version / auth / call_ended / replaced: the relay will not take this token again
            // on this socket's behalf; stop redialling.
            ch.done = true;
          }
          // Every frame goes to the features; a type nobody knows is ignored (forward-compatible).
          notifyControl(msg);
        };
        ws.onclose = () => {
          if (ws !== ch.ws) return;
          clearInterval(ch.ping);
          ch.ping = null;
          ch.ws = null;
          ch.features = [];
          ch.welcomed = false;
          notifyControl(null);
          retryControl(ch);
        };
      }

      function retryControl(ch) {
        if (ch !== control || ch.done || !inCall || ch.owner !== callToken) return;
        const delay = CONTROL_BACKOFF_MS[Math.min(ch.attempt, CONTROL_BACKOFF_MS.length - 1)];
        ch.attempt += 1;
        ch.retry = setTimeout(() => dialControl(ch), delay);
      }

      function closeControl() {
        if (!control) return;
        const ch = control;
        control = null;
        ch.done = true;
        clearInterval(ch.ping);
        clearTimeout(ch.retry);
        if (ch.ws) {
          try {
            ch.ws.close();
          } catch (e) {}
          ch.ws = null;
        }
        notifyControl(null);
      }

      function stopStatusPolling() {
        if (statusTimer) {
          clearInterval(statusTimer);
          statusTimer = null;
        }
      }

      /* ── Ask Lelik ───────────────────────────────────── */
      // Interpreter page only (VOICE_CALL_CONTROL_CHANNEL_RFC §5.5): a press marks the caller's
      // next words as addressed to Lelik; pressing again before speaking cancels. The button is
      // created only on the interpreter page (showAsk checks the mode) and only when a call hands
      // out the control channel, so /cabinet/call and the tutor page never have one.
      // Views: hidden (no call), disabled (channel down, or the call offers no `ask`), idle,
      // armed (pressed), busy (Lelik is answering). The relay is authoritative: a tap shows its
      // result at once and rolls back unless an `ask_state` answers within 2 s.
      const ASK_ROLLBACK_MS = 2000;
      const ask = { view: "hidden", offered: false, seq: 0, rollback: null, btn: null };

      function askViewFor(state) {
        if (state === "armed") return "armed";
        if (state === "active") return "busy";
        return "idle";
      }

      function setAskView(view) {
        ask.view = view;
        renderAsk();
      }

      function clearAskRollback() {
        clearTimeout(ask.rollback);
        ask.rollback = null;
      }

      function onAskFrame(msg) {
        if (ask.view === "hidden") return;
        if (msg === null || msg.type === "bye") {
          clearAskRollback();
          ask.offered = false;
          setAskView("disabled");
        } else if (msg.type === "welcome") {
          clearAskRollback();
          ask.offered = Array.isArray(msg.features) && msg.features.includes("ask");
          setAskView(ask.offered ? askViewFor(msg.ask) : "disabled");
        } else if (msg.type === "ask_state" && ask.offered) {
          clearAskRollback();
          setAskView(askViewFor(msg.state));
        }
      }

      function pressAsk() {
        if (ask.view !== "idle" && ask.view !== "armed") return;
        const previous = ask.view;
        const next = previous === "idle" ? "armed" : "idle";
        ask.seq += 1;
        if (!sendControl({ type: next === "armed" ? "ask_arm" : "ask_disarm", seq: ask.seq })) return;
        if (next === "armed" && typeof navigator.vibrate === "function") {
          try {
            navigator.vibrate(30);
          } catch (e) {}
        }
        clearAskRollback();
        setAskView(next);
        ask.rollback = setTimeout(() => {
          ask.rollback = null;
          if (ask.view === next) setAskView(previous);
        }, ASK_ROLLBACK_MS);
      }

      function showAsk() {
        if (window.VOICE_MODE !== "interpreter") return;
        ask.offered = false;
        setAskView("disabled");
      }

      function hideAsk() {
        clearAskRollback();
        ask.offered = false;
        if (ask.view !== "hidden") setAskView("hidden");
      }

      function renderAsk() {
        if (!ask.btn) {
          if (ask.view === "hidden") return;
          const btnEl = document.createElement("button");
          btnEl.id = "ask-btn";
          btnEl.type = "button";
          btnEl.className = "ask-btn";
          btnEl.addEventListener("click", pressAsk);
          document.querySelector(".controls").append(btnEl);
          ask.btn = btnEl;
        }
        const view = ask.view;
        ask.btn.hidden = view === "hidden";
        ask.btn.disabled = view === "disabled" || view === "busy";
        ask.btn.classList.toggle("armed", view === "armed");
        ask.btn.classList.toggle("busy", view === "busy");
        ask.btn.setAttribute("aria-pressed", String(view === "armed"));
        ask.btn.textContent = t(view === "armed" ? "ask.armed" : view === "busy" ? "ask.busy" : "ask.button");
      }

      onControl(onAskFrame);

      /* ── Geo ─────────────────────────────────────────── */
      // Every call page that gets the control channel (GEO_MARKS_RFC §4.7): a button shared by the caller on purpose.
      // It exists only while the call's `welcome.features` lists `geo`. A tap takes one fix with getCurrentPosition
      // (high accuracy, fresh, 15 s) and sends it as `geo {seq, latitude, longitude, accuracy}`; the relay answers
      // `geo_state`. The Permissions API is never used: the browser's own prompt is the only permission step.
      const GEO_TIMEOUT_MS = 15000;
      const geo = { offered: false, seq: 0, busy: false, btn: null, status: null, visible: false,
                    result: null /* { key | text } of the status line */ };

      function geoSetResult(result) {
        geo.result = result;
        renderGeo();
      }

      function renderGeo() {
        if (!geo.btn) {
          if (!geo.visible) return;
          const btnEl = document.createElement("button");
          btnEl.id = "geo-btn";
          btnEl.type = "button";
          btnEl.className = "geo-btn";
          btnEl.addEventListener("click", pressGeo);
          const statusEl = document.createElement("div");
          statusEl.id = "geo-status";
          statusEl.className = "geo-status";
          statusEl.setAttribute("role", "status");
          const host = document.querySelector(".controls");
          host.append(btnEl);
          host.append(statusEl);
          geo.btn = btnEl;
          geo.status = statusEl;
        }
        const shown = geo.visible && geo.offered;
        geo.btn.hidden = !shown;
        geo.btn.disabled = geo.busy;
        geo.btn.textContent = t(geo.busy ? "geo.locating" : "geo.button");
        const result = shown ? geo.result : null;
        geo.status.hidden = !result;
        geo.status.textContent = !result ? "" : result.address ? `✓ ${result.address}`
          : result.ok ? `✓ ${t("geo.no_address")}` : t(result.key);
      }

      function onGeoFrame(msg) {
        if (!geo.visible) return;
        if (msg === null || msg.type === "bye") {
          geo.offered = false;
          geo.busy = false;
          geo.result = null;
          renderGeo();
        } else if (msg.type === "welcome") {
          geo.offered = Array.isArray(msg.features) && msg.features.includes("geo");
          renderGeo();
        } else if (msg.type === "geo_state" && geo.offered && msg.seq === geo.seq) {
          geo.busy = false;
          if (msg.ok === true) {
            geoSetResult({ ok: true, address: typeof msg.address === "string" ? msg.address : "" });
          } else {
            geoSetResult({ ok: false, key: msg.reason === "rate" ? "geo.rate" : "geo.failed" });
          }
        }
      }

      function pressGeo() {
        if (!geo.visible || !geo.offered || geo.busy) return;
        if (!navigator.geolocation || typeof navigator.geolocation.getCurrentPosition !== "function") {
          geoSetResult({ ok: false, key: "geo.insecure" });
          return;
        }
        geo.busy = true;
        geo.seq += 1;
        const seq = geo.seq;
        geo.result = null;
        renderGeo();
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            if (!geo.busy || geo.seq !== seq) return;
            const c = pos.coords;
            const frame = { type: "geo", seq, latitude: c.latitude, longitude: c.longitude, accuracy: c.accuracy };
            if (!sendControl(frame)) {
              geo.busy = false;
              geoSetResult({ ok: false, key: "geo.failed" });
            }
          },
          (err) => {
            if (!geo.busy || geo.seq !== seq) return;
            geo.busy = false;
            geoSetResult({ ok: false, key: err && err.code === 1 ? "geo.denied" : "geo.unavailable" });
          },
          { enableHighAccuracy: true, timeout: GEO_TIMEOUT_MS, maximumAge: 0 }
        );
      }

      function showGeo() {
        geo.visible = true;
        geo.offered = false;
        geo.busy = false;
        geo.result = null;
        renderGeo();
      }

      function hideGeo() {
        geo.visible = false;
        geo.offered = false;
        geo.busy = false;
        geo.result = null;
        if (geo.btn) renderGeo();
      }

      onControl(onGeoFrame);

      /* ── Speaker route ───────────────────────────────── */
      // Interpreter page only: moves Lelik's voice from the headphones to the phone's loudspeaker and back.
      // WebKit ignores setSinkId on an <audio> playing a remote WebRTC track (bug 320087), so ON routes the
      // track through WebAudio into a second, hidden <audio> that setSinkId does steer. The direct remoteAudio
      // path stays the default and is only muted while the bridge plays. The main call page keeps playback off
      // WebAudio (see the AudioContext comment above) and never gets this.
      const SPEAKER_DEFAULT_ON = false;
      const SPEAKER_LABEL_RE = /speaker|динамік|динамик|haut-parleur|altavoz/i;
      const EARPIECE_LABEL_RE = /receiver|earpiece|écouteur|auricular|приймач/i;
      const speaker = {
        live: false, on: SPEAKER_DEFAULT_ON, available: false, gen: 0, busy: false,
        speakerId: null, phonesId: null, outs: 0, track: null,
        el: null, src: null, dest: null, srcTrack: null, ctx: null,
        row: null, ctl: null, btn: null, label: null,
      };

      function speakerSupported() {
        return typeof HTMLMediaElement !== "undefined" && "setSinkId" in HTMLMediaElement.prototype;
      }

      function buildSpeakerRow() {
        if (window.VOICE_MODE !== "interpreter" || speaker.row) return;
        const row = document.createElement("div");
        row.className = "call-row";
        const left = document.createElement("div");
        left.id = "call-slot-left";
        left.className = "call-slot";
        const mid = document.createElement("div");
        mid.className = "call-mid";
        // Reserved for the "Show text" button (VOICE_CALL_LIVE_TEXT_RFC §4.8); same width keeps the call button centred.
        const right = document.createElement("div");
        right.id = "call-slot-right";
        right.className = "call-slot";
        const ctl = document.createElement("div");
        ctl.className = "speaker-ctl off";
        const sbtn = document.createElement("button");
        sbtn.id = "speaker-btn";
        sbtn.type = "button";
        sbtn.className = "speaker-btn";
        sbtn.setAttribute("aria-pressed", "false");
        sbtn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/>' +
          '<path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>' +
          '<path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
        sbtn.addEventListener("click", toggleSpeaker);
        const slabel = document.createElement("div");
        slabel.className = "speaker-label";
        ctl.append(sbtn, slabel);
        left.append(ctl);
        btn.parentNode.insertBefore(row, btn);
        mid.append(btn, callLabel);
        row.append(left, mid, right);
        Object.assign(speaker, { row, ctl, btn: sbtn, label: slabel });
        renderSpeaker();
      }

      function renderSpeaker() {
        if (!speaker.row) return;
        const visible = speaker.live && speaker.available;
        speaker.ctl.classList.toggle("off", !visible);
        speaker.ctl.classList.toggle("on", speaker.on);
        speaker.btn.classList.toggle("on", speaker.on);
        speaker.btn.setAttribute("aria-pressed", String(speaker.on));
        speaker.label.textContent = t("route.speaker");
      }

      async function scanOutputs() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const outs = devices.filter((d) => d.kind === "audiooutput");
        const loud = outs.find((d) => d.deviceId !== "default" && SPEAKER_LABEL_RE.test(d.label));
        const phones = outs.find(
          (d) => d.deviceId !== "default" && d !== loud && !SPEAKER_LABEL_RE.test(d.label) && !EARPIECE_LABEL_RE.test(d.label)
        );
        return { outs: outs.length, speakerId: loud ? loud.deviceId : null, phonesId: phones ? phones.deviceId : null };
      }

      function reportRoute(route, ok, err) {
        sendClientReport("route", callToken, { route, ok, err, outs: speaker.outs });
      }

      // Direct path back on first, then the bridge silent: both paths are never muted together.
      function speakerToPhones() {
        remoteAudio.muted = false;
        if (speaker.el) {
          speaker.el.muted = true;
          try {
            speaker.el.pause();
          } catch (e) {}
        }
        speaker.on = false;
        renderSpeaker();
      }

      async function refreshSpeaker() {
        const gen = speaker.gen;
        if (!speaker.live || !speakerSupported()) return;
        let found = null;
        try {
          found = await scanOutputs();
        } catch (e) {}
        if (gen !== speaker.gen || !speaker.live) return;
        speaker.outs = found ? found.outs : 0;
        speaker.speakerId = found ? found.speakerId : null;
        speaker.phonesId = found ? found.phonesId : null;
        speaker.available = !!(speaker.speakerId && speaker.phonesId);
        if (speaker.on && !speaker.available) {
          speakerToPhones();
          reportRoute("phones", false, "devices");
        }
        renderSpeaker();
      }

      function onSpeakerCtxState() {
        const state = speaker.ctx ? speaker.ctx.state : "closed";
        if (!speaker.on || (state !== "suspended" && state !== "interrupted" && state !== "closed")) return;
        speakerToPhones();
        reportRoute("phones", false, `ctx_${state}`);
      }

      function buildSpeakerBridge(ctx) {
        if (!speaker.el) {
          speaker.el = document.createElement("audio");
          speaker.el.setAttribute("playsinline", "");
          speaker.el.hidden = true;
          document.body.append(speaker.el);
        }
        if (speaker.src && speaker.srcTrack === speaker.track) return;
        dropSpeakerGraph();
        speaker.src = ctx.createMediaStreamSource(new MediaStream([speaker.track]));
        speaker.dest = ctx.createMediaStreamDestination();
        speaker.src.connect(speaker.dest);
        speaker.srcTrack = speaker.track;
        speaker.el.srcObject = speaker.dest.stream;
        speaker.ctx = ctx;
        ctx.addEventListener("statechange", onSpeakerCtxState);
      }

      function dropSpeakerGraph() {
        if (speaker.ctx) speaker.ctx.removeEventListener("statechange", onSpeakerCtxState);
        try {
          if (speaker.src) speaker.src.disconnect();
        } catch (e) {}
        speaker.src = null;
        speaker.dest = null;
        speaker.srcTrack = null;
        speaker.ctx = null;
      }

      async function speakerToLoud() {
        // The tap is the user gesture: the context is created or resumed here, before any await.
        const ctx = ensureAudioContext();
        const resumed = ctx && ctx.state !== "running" ? ctx.resume() : null;
        const gen = speaker.gen;
        let err = "";
        try {
          if (!ctx || !speaker.track || !speaker.speakerId) throw new Error("NoRoute");
          if (resumed) await resumed;
          if (ctx.state !== "running") throw new Error("CtxNotRunning");
          buildSpeakerBridge(ctx);
          await speaker.el.setSinkId(speaker.speakerId);
          if (gen !== speaker.gen) return;
          speaker.el.muted = false;
          await speaker.el.play();
          if (gen !== speaker.gen) return;
          remoteAudio.muted = true;
          speaker.on = true;
        } catch (e) {
          err = (e && e.name) || "Error";
          if (gen !== speaker.gen) return;
          speakerToPhones();
        }
        renderSpeaker();
        reportRoute(speaker.on ? "speaker" : "phones", err === "", err);
      }

      async function toggleSpeaker() {
        if (!speaker.live || !speaker.available || speaker.busy) return;
        speaker.busy = true;
        try {
          if (speaker.on) {
            speakerToPhones();
            reportRoute("phones", true, "");
          } else {
            await speakerToLoud();
          }
        } finally {
          speaker.busy = false;
        }
      }

      function showSpeaker() {
        if (window.VOICE_MODE !== "interpreter" || !speakerSupported()) return Promise.resolve();
        buildSpeakerRow();
        speaker.live = true;
        return refreshSpeaker();
      }

      function hideSpeaker() {
        speaker.gen += 1;
        speaker.live = false;
        speaker.available = false;
        speaker.busy = false;
        dropSpeakerGraph();
        if (speaker.el) {
          speaker.el.muted = true;
          try {
            speaker.el.pause();
          } catch (e) {}
          speaker.el.srcObject = null;
        }
        speaker.track = null;
        speaker.on = SPEAKER_DEFAULT_ON;
        remoteAudio.muted = false;
        renderSpeaker();
      }

      function speakerInit() {
        if (window.VOICE_MODE !== "interpreter") return;
        buildSpeakerRow();
        try {
          navigator.mediaDevices.addEventListener("devicechange", refreshSpeaker);
        } catch (e) {}
      }
      speakerInit();

      /* ── Live text ───────────────────────────────────── */
      // Mode pages only (VOICE_CALL_LIVE_TEXT_RFC §4.7-§4.9): the relay's `line` / `snapshot` frames become a
      // scrolling text panel between the identity row and the call button. Every entry point returns at the
      // mode gate, so /cabinet/call is untouched. The channel's own reconnect is all the recovery there is:
      // each (re)connect brings a `snapshot`. All frame text goes in with textContent; nothing is stored.
      // `liveText.lines` is the list a later "save as file" reads: display order, at most LIVE_TEXT_LIST_CAP.
      const LIVE_TEXT_MODES = ["interpreter", "tutor"];
      const LIVE_TEXT_DOM_CAP = 50;
      const LIVE_TEXT_LIST_CAP = 2000;
      const LIVE_TEXT_ID = /^l\d+$/;
      const liveText = { live: false, lastSeq: -1, lines: [], els: null /* {wrap, panel, pill, hint} */, follow: true };
      const LIVE_TEXT_LINGER_MS = 3000;
      let liveTextLinger = null; // timer of a hang-up still waiting for the relay's `bye`
      const liveTextEls = new Map(); // line id -> { el, body } for the lines currently in the DOM

      function liveTextNum(id) {
        return Number(id.slice(1));
      }

      function liveTextWho(who) {
        return who === "lelik" || who === "caller";
      }

      // The list is ordered by the relay's allocation number, not by arrival (§4.4).
      function liveTextInsert(rec) {
        const lines = liveText.lines;
        let i = lines.length;
        while (i > 0 && liveTextNum(lines[i - 1].line) > liveTextNum(rec.line)) i--;
        lines.splice(i, 0, rec);
      }

      function liveTextTrim() {
        const extra = liveText.lines.length - LIVE_TEXT_LIST_CAP;
        if (extra <= 0) return false;
        liveText.lines.splice(0, extra);
        return true;
      }

      function liveTextShown(rec) {
        return rec.status === "interrupted" ? rec.text + "…" : rec.text;
      }

      function liveTextAtBottom(panel) {
        return panel.scrollHeight - panel.scrollTop - panel.clientHeight < 24;
      }

      function liveTextNotify() {
        // The Show view (interpreter only) follows every change of the list.
        if (typeof renderShow === "function") renderShow();
      }

      function liveTextBuildDom() {
        if (liveText.els) return;
        const controls = document.querySelector(".controls");
        const screen = document.querySelector(".screen");
        if (!controls || !screen) return;
        const wrap = document.createElement("div");
        wrap.className = "text-wrap";
        const panel = document.createElement("div");
        panel.className = "text-panel";
        panel.setAttribute("role", "log");
        panel.setAttribute("aria-live", "off"); // a screen reader must not talk over Lelik
        panel.setAttribute("aria-label", t("text.panel"));
        const hint = document.createElement("p");
        hint.className = "text-hint";
        hint.textContent = t("text.heard_hint");
        panel.append(hint);
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = "text-pill";
        pill.textContent = t("text.latest");
        pill.hidden = true;
        wrap.append(panel, pill);
        screen.insertBefore(wrap, controls);
        screen.classList.add("text-live");
        panel.addEventListener("scroll", () => {
          if (liveTextAtBottom(panel)) {
            liveText.follow = true;
            pill.hidden = true;
          }
        });
        pill.addEventListener("click", () => {
          panel.scrollTop = panel.scrollHeight;
          liveText.follow = true;
          pill.hidden = true;
        });
        liveText.els = { wrap, panel, pill, hint };
        liveText.follow = true;
      }

      // The language changed: the panel's own labels, then every line (its "You" / "Lelik" labels) is rebuilt.
      function liveTextRelabel() {
        const els = liveText.els;
        if (!els) return;
        els.panel.setAttribute("aria-label", t("text.panel"));
        els.hint.textContent = t("text.heard_hint");
        els.pill.textContent = t("text.latest");
        liveTextRebuild();
      }

      function liveTextTearDown() {
        const screen = document.querySelector(".screen");
        if (screen) screen.classList.remove("text-live");
        if (liveText.els) liveText.els.wrap.remove();
        liveText.els = null;
        liveTextEls.clear();
      }

      function liveTextLineEl(rec, inBlock) {
        const el = document.createElement("div");
        el.className = "text-line " + rec.who;
        const body = document.createElement("span");
        body.className = "text-body";
        body.textContent = liveTextShown(rec);
        if (rec.who === "caller" && !inBlock) {
          const label = document.createElement("span");
          label.className = "text-label";
          label.textContent = t("text.you");
          el.append(label, body);
        } else {
          el.append(body);
        }
        if (rec.who === "lelik" && !inBlock && window.VOICE_MODE === "interpreter") {
          el.addEventListener("click", () => {
            if (typeof openShow === "function") openShow();
          });
        }
        liveTextEls.set(rec.line, { el, body });
        return el;
      }

      // A new line, a removal, a snapshot or a cap trim: rebuild the last LIVE_TEXT_DOM_CAP lines.
      function liveTextRebuild() {
        const els = liveText.els;
        if (!els) return;
        Array.from(els.panel.children).forEach((child) => {
          if (child !== els.hint) child.remove();
        });
        liveTextEls.clear();
        let block = null; // the open "Ask Lelik" block (a question split by a pause is several caller lines), waiting for its answer
        liveText.lines.slice(-LIVE_TEXT_DOM_CAP).forEach((rec) => {
          if (rec.kind !== "ask") {
            block = null;
            els.panel.append(liveTextLineEl(rec, false));
            return;
          }
          if (!block) {
            block = document.createElement("div");
            block.className = "text-block";
            const label = document.createElement("span");
            label.className = "text-label";
            label.textContent = t("text.lelik");
            block.append(label);
            els.panel.append(block);
          }
          block.append(liveTextLineEl(rec, true));
          if (rec.who === "lelik") block = null;
        });
      }

      function liveTextRefresh(wasBottom, rebuild, touched) {
        if (liveText.lines.length && !liveText.els) {
          liveTextBuildDom();
          rebuild = true;
        }
        const els = liveText.els;
        if (els) {
          if (rebuild) {
            liveTextRebuild();
          } else if (touched) {
            const hit = liveTextEls.get(touched.line);
            if (hit) hit.body.textContent = liveTextShown(touched);
          }
          if (wasBottom) {
            els.panel.scrollTop = els.panel.scrollHeight; // instant, never smooth
            liveText.follow = true;
            els.pill.hidden = true;
          } else {
            liveText.follow = false;
            els.pill.hidden = false;
          }
        }
        liveTextNotify();
      }

      // Returns { rebuild, touched } for a valid frame, null for one to ignore.
      function liveTextApplyLine(msg) {
        if (typeof msg.line !== "string" || !LIVE_TEXT_ID.test(msg.line)) return null;
        const text = typeof msg.text === "string" ? msg.text : "";
        let rec = liveText.lines.find((l) => l.line === msg.line);
        let rebuild = false;
        if (msg.op === "end") {
          if (!rec) return null;
          if (msg.status === "done" || msg.status === "interrupted") rec.status = msg.status;
          return { rebuild, touched: rec };
        }
        if (msg.op !== "append" && msg.op !== "set") return null;
        if (msg.op === "set" && text === "") {
          // An empty transcript removes the caller's line (§4.4).
          if (!rec) return null;
          liveText.lines.splice(liveText.lines.indexOf(rec), 1);
          return { rebuild: true, touched: null };
        }
        if (!rec) {
          if (!liveTextWho(msg.who)) return null;
          rec = { line: msg.line, who: msg.who, kind: undefined, text: "", status: "open" };
          liveTextInsert(rec);
          rebuild = true;
        }
        rec.text = msg.op === "append" ? rec.text + text : text;
        if (msg.kind === "ask" && rec.kind !== "ask") {
          rec.kind = "ask";
          rebuild = true;
        }
        if (liveTextTrim()) rebuild = true;
        return { rebuild, touched: rec };
      }

      function liveTextApplySnapshot(msg) {
        if (!Array.isArray(msg.lines)) return;
        msg.lines.forEach((item) => {
          if (!item || typeof item.line !== "string" || !LIVE_TEXT_ID.test(item.line)) return;
          if (typeof item.text !== "string") return;
          const status = item.status === "done" || item.status === "interrupted" ? item.status : "open";
          const kind = item.kind === "ask" ? "ask" : undefined;
          const rec = liveText.lines.find((l) => l.line === item.line);
          if (rec) {
            rec.text = item.text;
            rec.status = status;
            rec.kind = kind;
          } else if (liveTextWho(item.who) && item.text !== "") {
            liveTextInsert({ line: item.line, who: item.who, kind, text: item.text, status });
          }
        });
        liveTextTrim();
      }

      function onLiveTextFrame(msg) {
        if (!LIVE_TEXT_MODES.includes(window.VOICE_MODE)) return;
        if (liveTextLinger !== null && (msg === null || msg.type === "bye")) {
          finishLiveTextLinger();
          return;
        }
        if (!msg || !liveText.live) return; // null = the socket closed: the view stays, the snapshot restores it
        if (msg.v !== 1 || (msg.type !== "line" && msg.type !== "snapshot" && msg.type !== "status")) return;
        // `ask_state` frames carry their own `seq` (the press counter): they never reach this check.
        if (!Number.isInteger(msg.seq) || msg.seq <= liveText.lastSeq) return;
        liveText.lastSeq = msg.seq;
        if (msg.type === "status") return; // S3's: the seq advances, nothing else
        const els = liveText.els;
        const wasBottom = els ? liveTextAtBottom(els.panel) : true;
        if (msg.type === "snapshot") {
          liveTextApplySnapshot(msg);
          liveTextRefresh(wasBottom, true, null);
          return;
        }
        const done = liveTextApplyLine(msg);
        if (done) liveTextRefresh(wasBottom, done.rebuild, done.touched);
      }

      function showLiveText() {
        if (!LIVE_TEXT_MODES.includes(window.VOICE_MODE)) return;
        liveText.live = true;
      }

      function resetLiveText() {
        if (!LIVE_TEXT_MODES.includes(window.VOICE_MODE)) return;
        if (typeof closeShow === "function") closeShow();
        clearTimeout(liveTextLinger);
        liveTextLinger = null;
        if (typeof clearSaveRow === "function") clearSaveRow();
        liveText.lines = [];
        liveText.lastSeq = -1;
        liveText.live = false;
        liveText.follow = true;
        liveTextTearDown();
        liveTextNotify();
      }

      // A user hang-up: the relay's last frames (the cut, the final tick) come before its `bye`, and they
      // complete the last line. Keep the socket and keep applying frames until `bye` (or the socket going
      // away) or LIVE_TEXT_LINGER_MS, then close it and end the live text. Returns false when there is
      // nothing to wait for (the caller then closes at once).
      function lingerLiveText(trigger) {
        if (!LIVE_TEXT_MODES.includes(window.VOICE_MODE)) return false;
        if (trigger !== "button" || !liveText.live || !control || !control.ws || control.done) return false;
        clearTimeout(liveTextLinger);
        liveTextLinger = setTimeout(finishLiveTextLinger, LIVE_TEXT_LINGER_MS);
        return true;
      }

      function finishLiveTextLinger() {
        if (liveTextLinger === null) return;
        clearTimeout(liveTextLinger);
        liveTextLinger = null;
        closeControl();
        endLiveText();
      }

      function endLiveText() {
        if (!LIVE_TEXT_MODES.includes(window.VOICE_MODE)) return;
        liveText.live = false;
        if (!liveText.lines.length) liveTextTearDown();
        if (typeof showSaveRow === "function") showSaveRow();
      }
      onControl(onLiveTextFrame);

      /* ── Show view ───────────────────────────────────── */
      // Interpreter page only (VOICE_CALL_LIVE_TEXT_RFC §4.8): a full-screen card with the latest translation
      // large and its source small above it, for the person across the table. It follows the list live (the
      // live-text block calls renderShow after every change) and closes ONLY through Back: no listener on the
      // overlay, the card or a key, so a stray tap by either person cannot dismiss it. Flip turns the card
      // alone, so Back and Flip keep facing the owner. A translation is a Lelik line that is not an Ask block.
      const show = { ctl: null, view: null, card: null, source: null, translation: null, back: null };

      // The latest translation and its source: the nearest caller line before it that comes after the
      // previous translation (otherwise there is none, e.g. an interrupted or unanswered turn).
      function showCurrent() {
        const lines = liveText.lines;
