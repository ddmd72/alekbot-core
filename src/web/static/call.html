        const isTranslation = (l) => l.who === "lelik" && l.kind !== "ask";
        let at = lines.length - 1;
        while (at >= 0 && !isTranslation(lines[at])) at--;
        if (at < 0) return null;
        let source = null;
        for (let i = at - 1; i >= 0 && !isTranslation(lines[i]); i--) {
          if (lines[i].who === "caller" && lines[i].kind !== "ask") {
            source = lines[i];
            break;
          }
        }
        return { translation: lines[at], source };
      }

      function renderShow() {
        if (window.VOICE_MODE !== "interpreter") return;
        const cur = showCurrent();
        if (show.ctl) show.ctl.classList.toggle("off", !cur);
        if (!show.view || show.view.hidden) return;
        show.source.textContent = cur && cur.source ? cur.source.text : "";
        show.source.hidden = !(cur && cur.source);
        show.translation.textContent = cur ? liveTextShown(cur.translation) : "";
      }

      function buildShowView() {
        if (show.view) return;
        const view = document.createElement("div");
        view.className = "show-view";
        view.setAttribute("role", "dialog");
        view.setAttribute("aria-modal", "true");
        view.setAttribute("aria-label", t("show.button"));
        view.hidden = true;
        const card = document.createElement("div");
        card.className = "show-card";
        const source = document.createElement("div");
        source.className = "show-source";
        const translation = document.createElement("div");
        translation.className = "show-translation";
        card.append(source, translation);
        const bar = document.createElement("div");
        bar.className = "show-bar";
        const back = document.createElement("button");
        back.type = "button";
        back.className = "show-back";
        back.textContent = t("show.back");
        back.addEventListener("click", closeShow);
        const flip = document.createElement("button");
        flip.type = "button";
        flip.className = "show-flip";
        flip.textContent = t("show.flip");
        flip.addEventListener("click", () => card.classList.toggle("flipped"));
        bar.append(back, flip);
        view.append(card, bar);
        document.body.append(view);
        Object.assign(show, { view, card, source, translation, back });
      }

      function openShow() {
        if (window.VOICE_MODE !== "interpreter") return;
        if (!showCurrent()) return;
        buildShowView();
        show.view.hidden = false;
        renderShow();
        show.back.focus();
      }

      function closeShow() {
        if (!show.view) return;
        show.view.hidden = true;
        show.card.classList.remove("flipped");
      }

      function showViewInit() {
        if (window.VOICE_MODE !== "interpreter" || show.ctl) return;
        const slot = document.getElementById("call-slot-right");
        if (!slot) return;
        const ctl = document.createElement("div");
        ctl.className = "show-ctl off";
        const btn = document.createElement("button");
        btn.id = "show-btn";
        btn.type = "button";
        btn.className = "show-btn";
        btn.setAttribute("aria-label", t("show.button"));
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "currentColor");
        svg.setAttribute("aria-hidden", "true");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute(
          "d",
          "M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm3 4v2h10V9H7zm0 4v2h7v-2H7z",
        );
        svg.append(path);
        btn.append(svg);
        btn.addEventListener("click", openShow);
        const label = document.createElement("div");
        label.className = "show-label";
        label.textContent = t("show.button");
        ctl.append(btn, label);
        slot.append(ctl);
        show.ctl = ctl;
        renderShow();
      }
      showViewInit();

      // The language changed: the Show control, and the Show view when it has been built (open or not).
      function showRelabel() {
        if (show.ctl) {
          show.ctl.querySelector(".show-btn").setAttribute("aria-label", t("show.button"));
          show.ctl.querySelector(".show-label").textContent = t("show.button");
        }
        if (show.view) {
          show.view.setAttribute("aria-label", t("show.button"));
          show.back.textContent = t("show.back");
          show.view.querySelector(".show-flip").textContent = t("show.flip");
        }
      }

      /* ── Save as file ────────────────────────────────── */
      // Mode pages only (VOICE_CALL_LIVE_TEXT_RFC §4.11): once the call has ended with at least one line, a row under
      // the text panel offers "Copy text", "File to chat" and, when the start response said the drive is reachable,
      // "File to drive". The file is built on the server from `liveText.lines`, sent as the page holds them. The
      // row goes away on the next Call tap or on pagehide (the live-text reset calls clearSaveRow). Nothing is stored.
      let callLiveAt = 0; // ms timestamp of the call going live (startTimer); 0 before
      let callFileToDrive = false; // start response `file_to_drive`
      const saveFile = {
        row: null, buttons: [], result: null, busy: false, gen: 0, duration: 0,
        pressed: null, saved: { chat: false, drive: false }, sheet: null,
        say: null /* [key, extra] of the result line */, sheetSpec: null /* [ok, key, extra] of the open sheet */,
      };

      // Display-order lines -> request entries: an ask caller line + the Lelik line after it is one {question, answer};
      // a caller line + the next Lelik line is {source, translation, interrupted}; a lone line pairs with "".
      function callTextEntries(lines) {
        const out = [];
        for (let i = 0; i < lines.length; i++) {
          const a = lines[i];
          const b = lines[i + 1];
          const ask = a.kind === "ask";
          if (a.who === "caller" && b && b.who === "lelik" && (b.kind === "ask") === ask) {
            out.push(
              ask
                ? { question: a.text, answer: b.text }
                : { source: a.text, translation: b.text, interrupted: b.status === "interrupted" },
            );
            i++;
          } else if (ask) {
            out.push(a.who === "caller" ? { question: a.text, answer: "" } : { question: "", answer: a.text });
          } else if (a.who === "caller") {
            out.push({ source: a.text, translation: "", interrupted: false });
          } else {
            out.push({ source: "", translation: a.text, interrupted: a.status === "interrupted" });
          }
        }
        return out;
      }

      // The same entries as plain text: source then translation (or question then answer), a blank line between.
      function callTextPlain(entries) {
        return entries
          .map((e) => {
            const second = "question" in e ? e.answer : e.translation + (e.interrupted ? " …" : "");
            return [("question" in e ? e.question : e.source), second].filter((s) => s !== "").join("\n");
          })
          .filter((s) => s !== "")
          .join("\n\n");
      }

      // Buttons are [copy, chat, drive?]; a target already filed stays disabled and marked for the rest of this text.
      const SAVE_TARGET_BUTTON = { chat: 1, drive: 2 };

      function saveRefreshButtons() {
        saveFile.buttons.forEach((b, i) => {
          const target = i === SAVE_TARGET_BUTTON.chat ? "chat" : i === SAVE_TARGET_BUTTON.drive ? "drive" : null;
          const filed = target !== null && saveFile.saved[target];
          b.disabled = saveFile.busy || filed;
          b.classList.toggle("saved", filed);
          const label = b.getAttribute("data-label") || "";
          const saving = saveFile.busy && b === saveFile.pressed;
          b.textContent = saving ? t("save.saving") : filed ? `✓ ${label}` : label;
          if (saving) {
            const spin = document.createElement("span");
            spin.className = "save-spin";
            spin.setAttribute("aria-hidden", "true");
            b.append(spin);
          }
        });
      }

      function saveSetBusy(busy, pressed) {
        saveFile.busy = busy;
        saveFile.pressed = busy ? pressed || null : null;
        saveRefreshButtons();
      }

      function saveSay(key, extra) {
        saveFile.say = [key, extra];
        if (saveFile.result) saveFile.result.textContent = t(key) + (extra ? ` ${extra}` : "");
      }

      // The language changed: the row's buttons and result line, and the open result sheet (rebuilt in place).
      function saveRelabel() {
        saveFile.buttons.forEach((b) => b.setAttribute("data-label", t(b.getAttribute("data-key"))));
        saveRefreshButtons();
        if (saveFile.say && saveFile.result) saveSay(...saveFile.say);
        if (saveFile.sheet && saveFile.sheetSpec) openSaveSheet(...saveFile.sheetSpec);
      }

      async function saveCopy() {
        if (saveFile.busy) return;
        const gen = saveFile.gen;
        try {
          await navigator.clipboard.writeText(callTextPlain(callTextEntries(liveText.lines)));
          if (gen === saveFile.gen) saveSay("save.copied");
        } catch (e) {
          if (gen === saveFile.gen) saveSay("save.failed");
        }
      }

      const SAVE_REASONS = { not_connected: "save.not_connected", refused: "save.refused", no_chat: "save.no_chat" };

      async function saveToTarget(target) {
        if (saveFile.busy || saveFile.saved[target]) return; // a target already filed is never filed twice
        const gen = saveFile.gen;
        saveSetBusy(true, saveFile.buttons[SAVE_TARGET_BUTTON[target]]);
        let key = "save.failed";
        let extra = "";
        let ok = false;
        try {
          const resp = await authFetch("/api/voice/call-text/file", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              target,
              mode: window.VOICE_MODE,
              duration_s: saveFile.duration,
              entries: callTextEntries(liveText.lines),
            }),
          });
          const body = await resp.json().catch(() => ({}));
          if (resp.status === 200 && body.ok) {
            ok = true;
            key = target === "drive" ? "save.saved" : "save.sent";
            extra = target === "drive" && typeof body.path === "string" ? body.path : "";
          } else if (resp.status === 409 && SAVE_REASONS[body.reason]) {
            key = SAVE_REASONS[body.reason];
          } else if (resp.status === 413) {
            key = "save.too_long";
          }
        } catch (e) {
          // network error: the generic line
        }
        if (gen !== saveFile.gen) return; // Done, a new call or pagehide cleared the row meanwhile: no sheet
        if (ok) saveFile.saved[target] = true;
        saveSetBusy(false);
        openSaveSheet(ok, key, extra);
      }

      // A Save more is offered while some target is still unfiled: the chat, or the drive when this call allows it.
      function saveMoreLeft() {
        return !saveFile.saved.chat || (callFileToDrive && !saveFile.saved.drive);
      }

      function saveSheetButton(bar, key, primary, handler) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "save-sheet-btn" + (primary ? " primary" : "");
        b.textContent = t(key);
        b.addEventListener("click", handler);
        bar.append(b);
        return b;
      }

      // The result sheet: modal, closes ONLY through its buttons (no listener on the backdrop or a key).
      function openSaveSheet(ok, key, extra) {
        closeSaveSheet();
        saveFile.sheetSpec = [ok, key, extra];
        const sheet = document.createElement("div");
        sheet.className = "save-sheet";
        sheet.setAttribute("role", "dialog");
        sheet.setAttribute("aria-modal", "true");
        sheet.setAttribute("aria-label", t(ok ? "save.done" : "save.failed"));
        const card = document.createElement("div");
        card.className = "save-sheet-card";
        const mark = document.createElement("div");
        mark.className = "save-sheet-mark";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = ok ? "✓" : "";
        const text = document.createElement("p");
        text.className = "save-sheet-text";
        text.textContent = t(key) + (extra ? ` ${extra}` : "");
        const bar = document.createElement("div");
        bar.className = "save-sheet-bar";
        let first = null;
        if (ok && saveMoreLeft()) first = saveSheetButton(bar, "save.more", true, closeSaveSheet);
        else if (!ok) first = saveSheetButton(bar, "save.back", true, closeSaveSheet);
        const done = saveSheetButton(bar, "save.done", !first, saveSheetDone);
        card.append(mark, text, bar);
        sheet.append(card);
        document.body.append(sheet);
        saveFile.sheet = sheet;
        (first || done).focus();
      }

      function closeSaveSheet() {
        if (saveFile.sheet) saveFile.sheet.remove();
        saveFile.sheet = null;
        saveFile.sheetSpec = null;
      }

      // Done: the page goes back to what a fresh load shows, without starting a call. resetLiveText drops the text
      // panel, the Show view, the save row and the sheet; the state line and the Call button are what the next
      // Call tap would otherwise leave "Ended"-looking.
      function saveSheetDone() {
        closeSaveSheet();
        resetLiveText();
        if (typeof setState === "function") setState(t("state.idle"));
        if (typeof renderButton === "function") renderButton("idle");
      }

      function clearSaveRow() {
        saveFile.gen++;
        closeSaveSheet();
        if (saveFile.row) saveFile.row.remove();
        Object.assign(saveFile, {
          row: null, buttons: [], result: null, busy: false, duration: 0, pressed: null,
          saved: { chat: false, drive: false }, say: null,
        });
        callFileToDrive = false;
        callLiveAt = 0;
      }

      // Called when the call ends (endLiveText): the row appears only when there is text to keep.
      function showSaveRow() {
        if (!LIVE_TEXT_MODES.includes(window.VOICE_MODE)) return;
        if (saveFile.row || !liveText.lines.length) return;
        const controls = document.querySelector(".controls");
        const screen = document.querySelector(".screen");
        if (!controls || !screen) return;
        const seconds = callLiveAt ? (Date.now() - callLiveAt) / 1000 : 0;
        saveFile.duration = Math.min(Math.max(seconds, 0), 6 * 3600);
        const row = document.createElement("div");
        row.className = "save-row";
        const actions = [["save.copy", saveCopy]];
        actions.push(["save.chat", () => saveToTarget("chat")]);
        if (callFileToDrive) actions.push(["save.drive", () => saveToTarget("drive")]);
        saveFile.buttons = actions.map(([key, handler]) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "save-btn";
          b.textContent = t(key);
          b.setAttribute("data-label", t(key));
          b.setAttribute("data-key", key);
          b.addEventListener("click", handler);
          row.append(b);
          return b;
        });
        const result = document.createElement("p");
        result.className = "save-result";
        result.setAttribute("role", "status");
        row.append(result);
        screen.insertBefore(row, controls);
        Object.assign(saveFile, { row, result });
      }

      async function pollStatus() {
        if (!callId) return;
        try {
          const resp = await authFetch(`/api/voice/web-call/${callId}/status`, {
            credentials: "same-origin",
          });
          if (!resp.ok) return; // transient — keep polling
          const body = await resp.json();
          if (body.state === "ended") {
            // The relay ended the call, but only hangup closes the SFU adapters (otherwise
            // Cloudflare keeps retrying egress) and deletes the record. Hangup is idempotent.
            await endCall(true, "status_ended");
            setState(t("state.ended"));
            renderButton("idle");
          }
        } catch (e) {
          // transient network hiccup — keep polling
        }
      }

      async function endCall(notifyServer, trigger = "button") {
        stopRingback();
        // Unconditional, not only via stopRingback(): stopRingback() no-ops once ringback has
        // already stopped (audible detection, or the Live-time fallback/cap below), but the
        // monitor timer must always be cleared here regardless, so it can never outlive the call.
        stopAudibleMonitor();
        if (audioCtx) {
          // Guarded — suspending an already-suspended/closed context, or one that never
          // started, must never throw. Resumed on the next Call tap (ensureAudioContext).
          try {
            audioCtx.suspend().catch(() => {});
          } catch (e) {}
        }
        setAudioSessionType("auto");
        stopStatusPolling();
        hideAsk();
        hideGeo();
        hideSpeaker();
        // A user hang-up keeps the control socket a moment so the relay's last text frames land first.
        if (!lingerLiveText(trigger)) {
          closeControl();
          endLiveText();
        }
        inCall = false;
        const endingCallId = callId;
        callId = null;
        if (notifyServer && endingCallId) {
          try {
            await authFetch(`/api/voice/web-call/${endingCallId}/hangup`, {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ trigger }),
            });
          } catch (e) {
            // best effort — nothing more to do client-side
          }
        }
        if (pc) {
          pc.close();
          pc = null;
        }
        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
          localStream = null;
        }
        if (wakeLock) {
          try {
            await wakeLock.release();
          } catch (e) {
            // already released
          }
          wakeLock = null;
        }
      }

      async function startCall() {
        const myToken = ++callToken;
        inCall = true;
        resetLiveText();
        renderButton("connecting");
        setState(t("state.connecting"));
        // Must run synchronously in this tap handler, before any await — iOS only allows
        // creating/resuming an AudioContext inside a user-gesture call stack.
        setAudioSessionType("play-and-record");
        startRingback();

        // A call start needs a fresh passkey assertion when the user has a passkey (CABINET_DEVICE_SESSIONS_RFC §7.3):
        // the server refuses the start without one, so the passkey sheet runs first. After the audio setup above,
        // which must stay in the tap's own call stack.
        const passkeyOk = await ensurePasskey();
        if (myToken !== callToken) return; // hung up while the sheet was open
        if (!passkeyOk) {
          inCall = false;
          stopRingback();
          setState(t("state.passkey_needed"));
          renderButton("idle");
          return;
        }

        const AUDIO_PROCESSING = {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        };
        const savedMic = loadSavedMic();
        try {
          const constraints = savedMic
            ? { audio: { ...AUDIO_PROCESSING, deviceId: { exact: savedMic } } }
            : { audio: AUDIO_PROCESSING };
          localStream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (e) {
          if (myToken !== callToken) return; // superseded by a manual hang up — don't touch
          // storage/UI or retry getUserMedia for a call that's already been abandoned
          if (savedMic && (e.name === "OverconstrainedError" || e.name === "NotFoundError")) {
            // The saved device is gone (unplugged, permission revoked for it, etc.) — clear
            // the stale choice and fall back to the default mic rather than failing the call.
            saveMic("");
            micSelect.value = "";
            try {
              localStream = await navigator.mediaDevices.getUserMedia({ audio: AUDIO_PROCESSING });
            } catch (e2) {
              if (myToken !== callToken) return; // superseded during the retry's permission prompt
              inCall = false;
              stopRingback();
              setState(t("state.mic_blocked"));
              renderButton("idle");
              return;
            }
          } else {
            inCall = false;
            stopRingback();
            setState(t("state.mic_blocked"));
            renderButton("idle");
            return;
          }
        }
        if (myToken !== callToken) {
          // Hung up while the mic permission prompt was open — hangupCall() already cleaned
          // up everything it knew about; this stream wasn't acquired yet at that point.
          localStream.getTracks().forEach((track) => track.stop());
          return;
        }
        // Labels are empty until permission is granted at least once — refresh now that it
        // has been (fire-and-forget; the call itself doesn't need to wait on this).
        refreshMicList();

        let handledState = false;
        try {
          await requestWakeLock();

          pc = new RTCPeerConnection({
            iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }],
            bundlePolicy: "max-bundle",
          });
          pc.ontrack = (ev) => {
            // The sole playback path for Lelik's voice — independent of audioCtx.
            remoteAudio.srcObject = new MediaStream([ev.track]);
            speaker.track = ev.track; // the speaker bridge taps this track (see Speaker route)
            // Safari 27 never starts an autoplay element with no renderer (an <audio> without controls) that has not
            // played yet (WebKit bug 326969), so autoplay alone leaves Lelik silent there. Start it explicitly; a
            // refusal shows in the playback report (el_paused), never in the call flow.
            remoteAudio.play().catch(() => {});
            try {
              playingEvents = 0;
              firstPlayingMs = -1;
              trackArrivedAt = performance.now();
              reportTrack = ev.track;
              const reportToken = callToken;
              setTimeout(() => sendClientReport("track", reportToken), 0);
            } catch (e) {
              // observation only
            }
            // A separate tap on the same track, for ringback's audible-detection only.
            startAudibleMonitor(ev.track, ev.receiver);
          };
          const tx = pc.addTransceiver(localStream.getAudioTracks()[0], { direction: "sendonly" });

          await pc.setLocalDescription(await pc.createOffer());
          const startResp = await authFetch("/api/voice/web-call", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(
              window.VOICE_MODE
                ? { sdp: pc.localDescription.sdp, mid: tx.mid, mode: window.VOICE_MODE }
                : { sdp: pc.localDescription.sdp, mid: tx.mid },
            ),
          });
          if (startResp.status === 401) {
            // authFetch already refreshed and is sending the user to login; release everything.
            handledState = true;
            throw new Error("unauthorized");
          }
          if (startResp.status === 403) {
            // The passkey went stale between the check above and the start: the next tap asks again.
            handledState = true;
            setState(t("state.passkey_needed"));
            throw new Error("passkey_required");
          }
          if (startResp.status === 409) {
            handledState = true;
            const conflict = await startResp.json().catch(() => ({}));
            setState(t(conflict.error === "mode_unavailable" ? "state.mode_unavailable" : "state.busy"));
            throw new Error("busy");
          }
          if (!startResp.ok) {
            throw new Error(`start failed: ${startResp.status}`);
          }
          const startBody = await startResp.json();
          const startedCallId = startBody.call_id;
          if (myToken !== callToken) {
            // Superseded while POST /api/voice/web-call was in flight: hangupCall() ran with
            // the global callId still null (nothing to notify from its side) and already reset
            // the UI to "Ended". The server has now claimed the marker/ticket and opened the
            // SFU leg for a call we're abandoning — release it explicitly (fire-and-forget,
            // same pattern as pagehide) instead of leaving it to expire on its own TTL, and
            // don't touch `pc` (already closed) or write the global callId for an abandoned
            // call the rest of this function no longer owns.
            authFetch(`/api/voice/web-call/${startedCallId}/hangup`, {
              method: "POST",
              keepalive: true,
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ trigger: "superseded" }),
            });
            return;
          }
          callId = startedCallId;
          callFileToDrive = startBody.file_to_drive === true;
          await pc.setRemoteDescription({ type: "answer", sdp: startBody.sdp });
          await waitForConnected(pc);

          const connectResp = await authFetch(`/api/voice/web-call/${callId}/connect`, {
            method: "POST",
            credentials: "same-origin",
          });
          if (!connectResp.ok) {
            throw new Error(`connect failed: ${connectResp.status}`);
          }
          const connectBody = await connectResp.json();
          if (myToken !== callToken) {
            // Superseded while POST .../connect was in flight. callId was already set above,
            // so hangupCall()'s endCall(true) already had a real id to notify — the server is
            // already released. Just don't let this stale continuation overwrite the "Ended"
            // state with "Live", or start a status-poll timer for an already-abandoned call.
            return;
          }
          if (connectBody.sdp) {
            await pc.setRemoteDescription({ type: "offer", sdp: connectBody.sdp });
            await pc.setLocalDescription(await pc.createAnswer());
            await authFetch(`/api/voice/web-call/${callId}/renegotiate`, {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ sdp: pc.localDescription.sdp }),
            });
          }

          setState(t("state.live"));
          setTimeout(() => sendClientReport("live_3s", myToken), 3000);
          setTimeout(() => sendClientReport("live_10s", myToken), 10000);
          renderButton("live");
          showSpeaker();
          statusTimer = setInterval(pollStatus, 2000);
          if (connectBody.control) openControl(connectBody.control, myToken);
          // Shown disabled; the control channel's `welcome` enables it when the call offers `ask`.
          // Interpreter page only: showAsk() checks the mode.
          if (connectBody.control) showAsk();
          if (connectBody.control) showLiveText();
          // Hidden until the channel's `welcome` lists `geo`.
          if (connectBody.control) showGeo();
          // /renegotiate is done: the page hears Lelik's track, so the relay may greet now (the frame
          // goes out once the channel is welcomed). Never awaited; the call does not wait on it.
          controlListening(myToken);

          // Ringback safety net: if nothing ever started watching for Lelik's first sound
          // (neither the analyser nor the receiver's stats are available), don't ring
          // indefinitely — stop right now that the call is confirmed live. Otherwise cap it:
          // ringback must never keep playing more than RINGBACK_LIVE_CAP_MS past Live even if
          // audible detection never fires for some other reason.
          if (!audibleMonitorTimer) {
            stopRingback();
          } else {
            setTimeout(() => {
              // Guarded by this call's own token — without it, a cap timer left over from an
              // earlier call could fire during a freshly-started one and cut its ringback short.
              if (myToken === callToken) stopRingback();
            }, RINGBACK_LIVE_CAP_MS);
          }
        } catch (e) {
          if (myToken !== callToken) return; // superseded by a manual hang up already handled
          if (!handledState) {
            setState(t("state.could_not_connect"));
          }
          await endCall(Boolean(callId), "start_failed");
          renderButton("idle");
        }
      }

      async function hangupCall() {
        callToken++; // invalidate any in-flight startCall() so its error path no-ops
        btn.disabled = true;
        await endCall(true);
        setState(t("state.ended"));
        renderButton("idle");
      }

      btn.addEventListener("click", () => {
        if (inCall) {
          hangupCall();
        } else {
          startCall();
        }
      });

      window.addEventListener("pagehide", () => {
        // No hangup here: a backgrounded page keeps its call (VOICE_CALL_CONTROL_CHANNEL_RFC §7.2).
        stopRingback();
        resetLiveText();
      });

      /* ── Language change ─────────────────────────────── */
      // Re-renders every text the page set through t(). The state line holds a translated string, so it is mapped back
      // to its key through the previous language's dictionary. Texts set once per event (the timer, the Show
      // translation, the live-text bodies) are the call's own words or numbers and carry no UI language.
      function relabelState(previous) {
        const old = LANG_DICT[previous] || LANG_DICT.en;
        const key = Object.keys(old).find((k) => k.startsWith("state.") && old[k] === stateEl.textContent);
        if (key) setState(t(key));
      }

      function applyLanguage(previous) {
        applyTranslations();
        relabelState(previous);
        callLabel.textContent = btn.classList.contains("danger") ? t("button.hangup") : t("button.call");
        refreshMicList();
        if (ask.btn) renderAsk();
        renderSpeaker();
        liveTextRelabel();
        showRelabel();
        saveRelabel();
      }

      applyTranslations();
      setState(t("state.idle"));
      renderButton("idle");
      refreshMicList();
      ensureSession();
      syncServerLanguage();
    </script>
  </body>
</html>
