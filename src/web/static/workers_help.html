    <style>
      /* The Cabinet's tokens (cabinet.css), light and dark. A static page, public like the Cabinet shell. */
      :root {

        --tint-warning: rgba(255, 149, 0, 0.14);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
        --radius-sm: 10px;
        --radius-lg: 24px;
        --font-sans:
          "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-app: #000000;
          --bg-panel-solid: #1c1c1e;
          --bg-inset: rgba(118, 118, 128, 0.16);
          --text-main: #f5f5f7;
          --text-secondary: #a1a1a6;
          --border-light: rgba(255, 255, 255, 0.12);
          --accent: #0a84ff;
          --tint-accent: rgba(10, 132, 255, 0.18);
          --tint-warning: rgba(255, 159, 10, 0.18);
          --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.6);
        }
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background-color: var(--bg-app);
        color: var(--text-main);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
        line-height: 1.5;
      }
      .page {
        max-width: 640px;
        margin: 0 auto;
        padding: calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
      }
      .back-link { display: inline-block; padding: 8px 0; font-size: 15px; font-weight: 500; color: var(--text-muted); text-decoration: none; }
      .back-link:hover { color: var(--text-main); }
      h1 { font-size: 30px; line-height: 1.15; font-weight: 700; margin: 8px 0 10px; }
      h2 { font-size: 22px; font-weight: 700; margin: 36px 0 12px; scroll-margin-top: 12px; }
      h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
      p, li { font-size: 16px; color: var(--text-secondary); }
      p + p, p + ul, ul + p, p + ol { margin-top: 10px; }
      ul, ol { padding-left: 22px; margin-top: 10px; }
      li { margin-top: 6px; }
      b { color: var(--text-main); font-weight: 600; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: var(--bg-inset);
        color: var(--text-main);
        padding: 1px 6px;
        border-radius: 6px;
        overflow-wrap: anywhere;
      }
      .lead { font-size: 17px; }
      .toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
      .toc a {
        font-size: 14px; font-weight: 500; color: var(--accent); text-decoration: none;
        background: var(--tint-accent); padding: 6px 12px; border-radius: 999px;
      }
      .tldr { background: var(--tint-accent); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; }
      .tldr-label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
      .tldr p { color: var(--text-main); font-size: 17px; font-weight: 500; margin-top: 2px; }
      .card {
        background: var(--bg-panel-solid);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        padding: 16px 18px;
        margin-top: 12px;
      }
      .mini { font-size: 15px; }
      .flow { margin-top: 12px; display: flex; flex-direction: column; align-items: stretch; }
      .step {
        background: var(--bg-panel-solid);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        box-shadow: var(--shadow-md);
      }
      .step-t { font-weight: 600; color: var(--text-main); font-size: 17px; }
      .step-d { font-size: 15px; color: var(--text-secondary); margin-top: 2px; }
      .arrow { text-align: center; font-size: 22px; line-height: 1.2; color: var(--accent); padding: 2px 0; }
      .note { margin-top: 10px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 15px; color: var(--text-main); background: var(--tint-warning); }
      .tools { list-style: none; padding-left: 0; }
      .tools li { font-size: 15px; }
      .dash { color: var(--text-muted); }
      .trouble { padding: 14px 18px; }
      .sym { font-weight: 600; color: var(--text-main); font-size: 16px; }
      .fix { margin-top: 6px; font-size: 15px; color: var(--text-secondary); }
      .fix-label { font-weight: 700; color: var(--text-main); }
      .fix-label::after { content: " →"; color: var(--accent); }
      .footer { margin-top: 36px; text-align: center; font-size: 15px; color: var(--text-muted); }

      const LANG_DICT = {

          "tldr.label": "In one line",

      // The language comes from the Cabinet's link (?lang=, the Cabinet's own interface language). A bare visit falls
      // back to the phone's language, then English. The page is static and public: it cannot read the Cabinet's setting.
      function hasLanguage(code) {
        return typeof code === "string" && Object.prototype.hasOwnProperty.call(LANG_DICT, code);
      }

      function pickLanguage() {
        const asked = (new URLSearchParams(window.location.search).get("lang") || "").slice(0, 2).toLowerCase();
        if (hasLanguage(asked)) return asked;
        const phone = (navigator.language || "en").slice(0, 2).toLowerCase();
        return hasLanguage(phone) ? phone : "en";
      }

      const LANG = pickLanguage();

      function t(key) {
        return (LANG_DICT[LANG] || LANG_DICT.en)[key] || LANG_DICT.en[key] || key;
      }

      // Text with **bold** and `code` marks becomes DOM nodes: no HTML string is ever built from a dictionary.
      function fillRich(el, text) {
        el.textContent = "";
        const host = window.location.host;
        for (const part of text.replace(/\{host\}/g, host).split(/(\*\*[^*]+\*\*|`[^`]+`)/)) {
          if (!part) continue;
          if (part.startsWith("**")) {
            const b = document.createElement("b");
            b.textContent = part.slice(2, -2);
            el.appendChild(b);
          } else if (part.startsWith("`")) {
            const c = document.createElement("code");
            c.textContent = part.slice(1, -1);
            el.appendChild(c);
          } else {
            el.appendChild(document.createTextNode(part));
          }
        }
      }

      function render() {
        document.documentElement.lang = LANG;
        document.title = t("app.title");
        for (const el of document.querySelectorAll("[data-i18n]")) fillRich(el, t(el.dataset.i18n));
        for (const ol of document.querySelectorAll("[data-i18n-list]")) {
          ol.textContent = "";
          for (const item of t(ol.dataset.i18nList).split("|")) {
            const li = document.createElement("li");
            fillRich(li, item);
            ol.appendChild(li);
          }
        }
      }

      render();
    </script>
