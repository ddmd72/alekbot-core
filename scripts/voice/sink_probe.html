<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lelik sink probe</title>
<!--
  Throwaway probe, not for main. Can a web page on iOS move WebRTC remote audio between the AirPods and the
  iPhone speaker during a call (HTMLMediaElement.setSinkId / AudioContext.setSinkId)? The page loops WebRTC back
  into itself (no server): a local beep goes pc1 -> pc2 and plays from the remote track the way call.html does.
  The mic is opened only to put iOS into the play-and-record session of a real call; it is never sent or played.
  A guided run: the page switches the output itself and asks one question per step.
-->
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --fg: #1c2230; --muted: #5d6678; --line: #d9dde5;
    --accent: #2b6de0; --ok: #1e8e4e; --bad: #c4362c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141a; --card: #1a1f28; --fg: #e8ebf1; --muted: #9aa3b5; --line: #2c3340;
            --accent: #6b9cff; --ok: #4cc27f; --bad: #ff6b5f; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                  max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 20px;
         justify-content: center; }
  .step { font-size: 15px; color: var(--muted); text-align: center; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0; text-align: center; }
  p { margin: 0; color: var(--muted); text-align: center; }
  .buttons { display: grid; gap: 12px; }
  button { font: inherit; font-size: 22px; font-weight: 600; border-radius: 16px; border: 2px solid var(--line);
           background: var(--card); color: var(--fg); padding: 18px; min-height: 72px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { font-size: 16px; font-weight: 500; min-height: 48px; padding: 10px; }
  button:disabled { opacity: .4; }
  details { font-size: 13px; color: var(--muted); }
  pre { font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word;
        max-height: 40vh; overflow: auto; background: var(--card); border-radius: 8px; padding: 10px; }
  .media { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<main>
  <div class="step" id="step"></div>
  <h1 id="title">Надень AirPods</h1>
  <p id="hint">Потом нажми кнопку. Телефон начнёт пикать, а я буду спрашивать, где ты это слышишь.</p>
  <div class="buttons" id="buttons">
    <button class="primary" id="go">Начать</button>
  </div>
  <details>
    <summary>Технический лог</summary>
    <pre id="log"></pre>
  </details>
</main>

<audio id="a1" class="media" playsinline></audio>
<audio id="a2" class="media" playsinline muted></audio>
<video id="v1" class="media" playsinline></video>
<canvas id="cv" class="media" width="16" height="16"></canvas>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const lines = [];
function log(msg) {
  lines.push(new Date().toISOString().slice(11, 23) + " " + msg);
  $("log").textContent = lines.join("\n");
}
const errStr = (e) => (e ? (e.name || "Error") + ": " + (e.message || String(e)) : "?");
const short = (id) => (id ? id.slice(0, 8) : "(default)");
const fmt = (v) => (v === undefined ? "undefined" : JSON.stringify(v));
const Ctx = window.AudioContext || window.webkitAudioContext;
const PATH_NAMES = { single: "A (как в звонке сейчас)", dual: "B (видео-обход)", webaudio: "C (WebAudio-обход)" };

let ctx = null, osc = null, gain = null, mic = null, pc1 = null, pc2 = null, remoteTrack = null, path = null;
let tests = [], idx = 0;
const results = [];

// ---------- screen ----------
function screen(step, title, hint, buttons) {
  $("step").textContent = step || "";
  $("title").textContent = title;
  $("hint").textContent = hint || "";
  const box = $("buttons");
  box.innerHTML = "";
  buttons.forEach(([label, cls, fn]) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener("click", () => { box.querySelectorAll("button").forEach((x) => (x.disabled = true)); fn(); });
    box.appendChild(b);
  });
}

// ---------- audio plumbing ----------
async function openMic() {
  mic = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  log("mic open: \"" + mic.getAudioTracks()[0].label + "\"");
}

async function buildLoopback() {
  const dest = ctx.createMediaStreamDestination();
  gain = ctx.createGain();
  gain.gain.value = 0;
  gain.connect(dest);
  osc = ctx.createOscillator();
  osc.connect(gain);
  osc.start();
  pc1 = new RTCPeerConnection();
  pc2 = new RTCPeerConnection();
  pc1.onicecandidate = (e) => e.candidate && pc2.addIceCandidate(e.candidate).catch(() => {});
  pc2.onicecandidate = (e) => e.candidate && pc1.addIceCandidate(e.candidate).catch(() => {});
  const got = new Promise((resolve) => { pc2.ontrack = (ev) => resolve(ev.track); });
  pc1.addTrack(dest.stream.getAudioTracks()[0], dest.stream);
  const offer = await pc1.createOffer();
  await pc1.setLocalDescription(offer);
  await pc2.setRemoteDescription(offer);
  const answer = await pc2.createAnswer();
  await pc2.setLocalDescription(answer);
  await pc1.setRemoteDescription(answer);
  remoteTrack = await Promise.race([
    got, new Promise((_, rej) => setTimeout(() => rej(new Error("no remote track in 8 s")), 8000)),
  ]);
  log("remote WebRTC track: " + remoteTrack.readyState);
  let i = 0;
  setInterval(() => {
    const t = ctx.currentTime;
    osc.frequency.setValueAtTime(i++ % 2 ? 520 : 780, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.5, t + 0.02);
    gain.gain.setValueAtTime(0.5, t + 0.28);
    gain.gain.linearRampToValueAtTime(0, t + 0.32);
  }, 800);
}

function stopPath() {
  if (!path) return;
  try { path.stop(); } catch (e) { log("stop path: " + errStr(e)); }
  path = null;
}

async function usePath(kind) {
  stopPath();
  if (kind === "single") {
    const el = $("a1");
    el.srcObject = new MediaStream([remoteTrack]);
    el.play().catch((e) => log("play: " + errStr(e)));
    path = { kind, sink: (id) => el.setSinkId(id), now: () => el.sinkId,
             stop: () => { el.pause(); el.srcObject = null; } };
  } else if (kind === "dual") {
    const cv = $("cv");
    cv.getContext("2d").fillRect(0, 0, cv.width, cv.height);
    const vt = cv.captureStream(1).getVideoTracks()[0];
    const el = $("v1");
    el.muted = false;
    el.srcObject = new MediaStream([remoteTrack, vt]);
    el.play().catch((e) => log("play: " + errStr(e)));
    path = { kind, sink: (id) => el.setSinkId(id), now: () => el.sinkId,
             stop: () => { el.pause(); el.srcObject = null; vt.stop(); } };
  } else {
    const c2 = new Ctx();
    c2.resume().catch(() => {});
    const keep = $("a2");
    keep.srcObject = new MediaStream([remoteTrack]);
    keep.play().catch(() => {});
    const src = c2.createMediaStreamSource(new MediaStream([remoteTrack]));
    src.connect(c2.destination);
    path = { kind,
             sink: (id) => (c2.setSinkId ? c2.setSinkId(id) : Promise.reject(new Error("AudioContext.setSinkId missing"))),
             now: () => c2.sinkId,
             stop: () => { src.disconnect(); c2.close(); keep.pause(); keep.srcObject = null; } };
  }
  log("path " + kind + " playing");
}

// ---------- the guided run ----------
async function begin() {
  if (navigator.audioSession) navigator.audioSession.type = "play-and-record";
  ctx = new Ctx();
  ctx.resume().catch(() => {});
  log("UA: " + navigator.userAgent);
  log("HTMLMediaElement.setSinkId: " + ("setSinkId" in HTMLMediaElement.prototype) +
      ", AudioContext.setSinkId: " + !!(Ctx && "setSinkId" in Ctx.prototype) +
      ", selectAudioOutput: " + !!navigator.mediaDevices.selectAudioOutput);
  try {
    screen("", "Секунду…", "Разреши доступ к микрофону, если телефон спросит.", []);
    await openMic();
    await buildLoopback();
  } catch (e) {
    log("start failed: " + errStr(e));
    return finish("Не запустилось", "Пришли мне технический лог.");
  }
  const ds = await navigator.mediaDevices.enumerateDevices();
  const outs = ds.filter((d) => d.kind === "audiooutput" && d.deviceId && d.deviceId !== "default");
  ds.forEach((d) => log("  " + d.kind + ": \"" + d.label + "\" " + short(d.deviceId)));
  log("outputs offered: " + outs.length);

  tests = [{ path: "single", sinkId: null, label: "без переключения" }];
  if ("setSinkId" in HTMLMediaElement.prototype) {
    ["single", "dual", "webaudio"].forEach((p) =>
      outs.forEach((d) => tests.push({ path: p, sinkId: d.deviceId, label: d.label || short(d.deviceId) })));
  }
  idx = 0;
  runTest();
}

async function runTest() {
  const t = tests[idx];
  screen("Шаг " + (idx + 1) + " из " + tests.length, "Переключаю…", "", []);
  if (!path || path.kind !== t.path) await usePath(t.path);
  if (t.sinkId !== null) {
    try {
      await path.sink(t.sinkId);
      log("setSinkId(\"" + t.label + "\") on " + t.path + " resolved, sinkId=" + fmt(path.now()));
    } catch (e) {
      log("setSinkId(\"" + t.label + "\") on " + t.path + " rejected: " + errStr(e));
    }
  }
  await new Promise((r) => setTimeout(r, 1200));
  screen("Шаг " + (idx + 1) + " из " + tests.length, "Где сейчас пикает?", "", [
    ["🎧  В наушниках", "", () => answer("headphones")],
    ["📱  Из телефона", "", () => answer("speaker")],
    ["🔇  Не слышу", "", () => answer("silence")],
  ]);
}

function answer(where) {
  const t = tests[idx];
  results.push({ ...t, where });
  log("VERDICT " + t.path + " / " + t.label + " -> " + where);
  if (idx === 0 && where === "silence") {
    return finish("Звука нет совсем", "Значит, тест не завёлся. Пришли мне технический лог.");
  }
  idx += 1;
  if (idx < tests.length) runTest(); else verdict();
}

function verdict() {
  const outs = tests.length - 1;
  const win = results.find((r) => r.sinkId !== null && r.where === "speaker");
  if (!("setSinkId" in HTMLMediaElement.prototype)) {
    finish("❌ Не получится", "Этот Safari вообще не умеет выбирать выход звука.");
  } else if (outs === 0) {
    finish("❌ Не получится", "iPhone не показал странице ни одного выхода, переключать некуда.");
  } else if (win) {
    finish("✅ Получилось!", "Способ " + PATH_NAMES[win.path] + " переключает звук на телефон. Скопируй результат и пришли мне.");
  } else {
    finish("❌ Не переключилось", "Ни один способ не увёл звук из наушников. Скопируй результат и пришли мне.");
  }
}

function finish(title, hint) {
  stopPath();
  if (mic) mic.getTracks().forEach((t) => t.stop());
  if (navigator.audioSession) navigator.audioSession.type = "auto";
  const summary = ["RESULT: " + title].concat(results.map((r) => r.path + " / " + r.label + " -> " + r.where));
  log(summary.join("\n"));
  screen("Готово", title, hint, [["Скопировать результат", "primary", copy]]);
}

function copy() {
  const text = lines.join("\n");
  navigator.clipboard.writeText(text).then(
    () => screen("Готово", "Скопировано 👍", "Вставь мне в чат.", []),
    () => {
      $("log").closest("details").open = true;
      const r = document.createRange();
      r.selectNodeContents($("log"));
      getSelection().removeAllRanges();
      getSelection().addRange(r);
      screen("Готово", "Не смог скопировать сам", "Лог открыт внизу и выделен: скопируй его вручную.", []);
    });
}

$("go").addEventListener("click", () => { $("go").disabled = true; begin(); });
</script>
</body>
</html>
