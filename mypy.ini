# CI gate (`make typecheck`): the pure layers are held to strict typing.
# Adapters have an informational, lenient config — see mypy-adapters.ini.
[mypy]
python_version = 3.11
plugins = pydantic.mypy
ignore_missing_imports = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR
files = src/domain, src/ports
strict = True
