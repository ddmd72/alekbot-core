[pytest]
markers =
    requirement: mark test as covering a specific business requirement ID
    performance: marks performance tests (manual run against real Firestore)
    timing: asserts on wall-clock/CPU time; skipped unless RUN_TIMING_TESTS=1 (`make test-timing`, CI after merge to main)
    slow: over 0.5 s with coverage on; skipped unless RUN_SLOW_TESTS=1 (`make ci` sets it)
    h1_only(reason): a store-kit test that drives a hook only the evaluating fake has; skipped when the kit runs on the real test database (tests/cloud/test_kits_cloud.py)
    gcs_fake_only(reason): a GCS store-kit test that drives a hook only the GCS fake has (tests/support/gcs_kit_backend.py); skipped when the kit runs on the test bucket (tests/cloud/test_kits_cloud.py)
    docker: needs the built sandbox image and a docker daemon; skipped unless SANDBOX_TEST_IMAGE is set
asyncio_mode = auto
# A test that hangs dumps every thread's stack after 4 min instead of holding the run silently.
faulthandler_timeout = 240
