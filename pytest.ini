[pytest]
markers =
    requirement: mark test as covering a specific business requirement ID
    performance: marks performance tests (manual run against real Firestore)
    timing: asserts on wall-clock/CPU time; skipped unless RUN_TIMING_TESTS=1 (`make test-timing`, CI after merge to main)
    slow: over 0.5 s with coverage on (half the 1 s per-test CI budget); skipped unless RUN_SLOW_TESTS=1 (`make ci` sets it)
    datafile: input is a data file or a child process, which testmon cannot select; `make test-affected` always runs it
    docker: needs the built sandbox image and a docker daemon; skipped unless SANDBOX_TEST_IMAGE is set
asyncio_mode = auto
# A test that hangs dumps every thread's stack after 4 min instead of holding the run silently.
faulthandler_timeout = 240
